name: Male catalog probe direct

on:
  push:
    paths:
      - '.github/workflows/male-catalog-probe-direct.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: git clone --quiet --depth=1 "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: work
        run: npm ci

      - name: Probe male audio listing
        id: audio
        working-directory: work
        continue-on-error: true
        env:
          MAX_PAGES_PER_RUN: '2'
          PAGE_DELAY_MS: '2000'
          DLSITE_CATALOG_BASE: https://www.dlsite.com/maniax-touch/works/type/=/work_type_category/audio
          DATA_ROOT: data/male/catalog
        run: node scripts/collect-catalog-index.mjs

      - name: Probe male manga listing
        id: manga
        working-directory: work
        continue-on-error: true
        env:
          MAX_PAGES_PER_RUN: '2'
          PAGE_DELAY_MS: '2000'
          DLSITE_CATALOG_BASE: https://www.dlsite.com/maniax-touch/works/type/=/work_type_category/comic
          DATA_ROOT: data/male/manga/catalog
        run: node scripts/collect-catalog-index.mjs

      - name: Save private index progress
        working-directory: work
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/male/catalog/index data/male/manga/catalog/index)" ]; then
            echo 'No index progress to commit.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/male/catalog/index data/male/manga/catalog/index
          git commit -m "data: male catalog ID probe $(TZ=Asia/Tokyo date +%F' '%H:%M)"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin main; then exit 0; fi
            sleep $((i * 5))
          done
          exit 1

      - name: Record probe result
        env:
          AUDIO_OUTCOME: ${{ steps.audio.outcome }}
          MANGA_OUTCOME: ${{ steps.manga.outcome }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const read=p=>fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):null;
          const count=p=>{if(!fs.existsSync(p))return null;const x=read(p);return Array.isArray(x)?x.length:Object.keys(x).length};
          const ac=read('work/data/male/catalog/index/checkpoint.json');
          const mc=read('work/data/male/manga/catalog/index/checkpoint.json');
          const out={
            checked_at:new Date().toISOString(),
            audio_outcome:process.env.AUDIO_OUTCOME,
            manga_outcome:process.env.MANGA_OUTCOME,
            audio:ac?{source_total_count:ac.source_total_count??null,last_page:ac.last_page??null,done:!!ac.done,stopped_reason:ac.stopped_reason??null,ids_collected:count('work/data/male/catalog/index/ids.json')}:null,
            manga:mc?{source_total_count:mc.source_total_count??null,last_page:mc.last_page??null,done:!!mc.done,stopped_reason:mc.stopped_reason??null,ids_collected:count('work/data/male/manga/catalog/index/ids.json')}:null
          };
          fs.mkdirSync('status',{recursive:true});
          fs.writeFileSync('status/male-catalog-probe-direct.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE

      - name: Publish probe result
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add status/male-catalog-probe-direct.json
          git commit -m 'status: male catalog direct probe'
          git pull --rebase origin main
          git push origin main
