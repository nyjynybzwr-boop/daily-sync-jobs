name: Read Ainou Yu reviews once

on:
  push:
    paths:
      - '.github/workflows/read-ainou-yu-reviews-once.yml'

permissions:
  contents: read

jobs:
  fetch-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Fetch official DLsite reviews for RJ01306051
        working-directory: work
        run: |
          mkdir -p data/research/interview-2026-09-01
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const productId='RJ01306051';
          const headers={
            'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1',
            'Accept-Language':'ja-JP,ja;q=0.9',
            'Accept':'application/json,text/plain,*/*'
          };
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const clean=v=>String(v??'').replace(/\s+/g,' ').trim();
          const rows=[];
          for(let page=1;page<=30;page++){
            const url=`https://www.dlsite.com/girls/api/review?product_id=${productId}&limit=20&mix_pickup=false&page=${page}&order=regist_d&locale=ja_JP`;
            let res;
            for(let attempt=1;attempt<=3;attempt++){
              try {
                res=await fetch(url,{headers,redirect:'follow'});
                if(!res.ok) throw new Error(`HTTP ${res.status}`);
                break;
              } catch(e) {
                if(attempt===3) throw e;
                await sleep(attempt*1500);
              }
            }
            const body=await res.text();
            let json;
            try{json=JSON.parse(body);}catch{throw new Error(`INVALID_JSON page=${page} ${body.slice(0,120)}`)}
            if(json?.is_success!==true) throw new Error(`API_ERROR page=${page} ${clean(json?.error_msg||'is_success=false')}`);
            const list=Array.isArray(json.review_list)?json.review_list:[];
            if(!list.length) break;
            for(const r of list){
              rows.push({
                review_id:clean(r.member_review_id||r.review_id||''),
                title:String(r.review_title??''),
                text:String(r.review_text??''),
                entry_date:clean(r.entry_date||''),
                regist_date:clean(r.regist_date||''),
                rate_num:Number(r.rate_num)||null,
                is_purchased:['1','true'].includes(String(r.is_purchased??'').toLowerCase())||r.is_purchased===true,
                recommend:clean(r.recommend||''),
                spoiler:clean(r.spoiler||''),
                good_review:Number(r.good_review)||0,
                bad_review:Number(r.bad_review)||0,
                genre:Array.isArray(r.genre)?r.genre:[]
              });
            }
            if(list.length<20) break;
            await sleep(900);
          }
          const dedup=[...new Map(rows.map(r=>[r.review_id||`${r.entry_date}:${r.title}:${r.text}`,r])).values()];
          const out={schema_version:1,source:'official_dlsite_review_api',product_id:productId,fetched_at:new Date().toISOString(),review_count:dedup.length,reviews:dedup};
          fs.writeFileSync('data/research/interview-2026-09-01/ainou-yu-reviews.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({product_id:productId,review_count:dedup.length},null,2));
          NODE

      - name: Commit research packet to private source
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/interview-2026-09-01/ainou-yu-reviews.json
          git commit -m '[CF-Pages-Skip] [skip actions] research: cache Ainou Yu interview reviews'
          git pull --rebase origin main
          git push origin HEAD:main
