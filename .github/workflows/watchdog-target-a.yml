name: Target A freshness watchdog

# Independent of sync-target-a-daily.yml on purpose: that job already fails
# loudly when it runs and collection genuinely fails, but it cannot detect
# itself never being invoked at all (Actions quota exhaustion, a scheduler
# outage, workflow file breakage). This is a dead-man's-switch: it does no
# real work, just checks that today's checkpoint landed, and fails loudly
# (triggering GitHub's own scheduled-workflow-failure notification) if not.
#
# Deliberately scheduled AFTER sync-target-a-daily.yml's last self-healing
# retry (23:25/00:25/01:25/02:25 JST), not right after the primary run: a
# human does not need to be awake for the system to recover from a
# transient failure, only to find out once every automatic retry has
# already been exhausted and something actually needs a person's attention.
on:
  workflow_dispatch:
  schedule:
    - cron: '50 17 * * *'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check today's Target A daily snapshot exists
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: token ${SYNC_TOKEN}" \
            "https://api.github.com/repos/${SOURCE_REPO}/contents/data/raw/${today}.json")
          if [ "$status" != "200" ]; then
            echo "::error::Target A daily snapshot data/raw/${today}.json is missing (HTTP $status). sync-target-a-daily.yml likely never ran today, or ran and failed silently."
            exit 1
          fi
          echo "Target A daily snapshot for ${today} confirmed present."
