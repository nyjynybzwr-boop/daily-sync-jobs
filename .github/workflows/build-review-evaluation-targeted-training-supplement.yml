name: Build review evaluation targeted training supplement

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-review-evaluation-targeted-training-supplement.yml'
      - '.review-evaluation-targeted-supplement-trigger'

permissions:
  contents: read

concurrency:
  group: review-evaluation-targeted-supplement
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_BUCKET_NAME: melosignal-data
      REVIEW_TARGETED_SUPPLEMENT_ROWS_PER_LANE: '100'
      REVIEW_TARGETED_SUPPLEMENT_MAX_PER_PRODUCT: '2'
      REVIEW_TARGETED_SUPPLEMENT_BATCH_COUNT: '7'
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify targeted supplement builder
        working-directory: work
        run: |
          set -euo pipefail
          node --check scripts/build-review-evaluation-targeted-training-supplement.mjs
          node --check scripts/validate-review-evaluation-targeted-training-supplement-decisions.mjs
          node - <<'NODE'
          const fs=require('fs');
          const inv=JSON.parse(fs.readFileSync('data/research/review-evaluation-full-corpus/rev-eval-46255c55e8d1c5dc/inventory/inventory-manifest.json','utf8'));
          const ab=JSON.parse(fs.readFileSync('data/research/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/tier-b-target-ab-report.json','utf8'));
          if(inv.analysis_version_id!=='rev-eval-46255c55e8d1c5dc') throw new Error('inventory analysis version drift');
          if(ab.decision?.admit_tier_b_for_target_training!==false) throw new Error('Tier B decision is not reject/hold');
          if(ab.shadow_v1_opened!==false) throw new Error('shadow state drift');
          console.log({inventory_rows:inv.artifacts.unique_evidence.rows,tier_b_decision:ab.decision});
          NODE

      - name: Download canonical review evidence inventory from R2
        working-directory: work
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          dir=.tmp/review-evaluation-inventory/rev-eval-46255c55e8d1c5dc
          mkdir -p "$dir"
          npx --yes wrangler@latest r2 object get "${R2_BUCKET_NAME}/review-evaluation-full-corpus/rev-eval-46255c55e8d1c5dc/inventory/unique-evidence.jsonl.gz" --file "$dir/unique-evidence.jsonl.gz" --remote >/dev/null
          npx --yes wrangler@latest r2 object get "${R2_BUCKET_NAME}/review-evaluation-full-corpus/rev-eval-46255c55e8d1c5dc/inventory/evidence-occurrences.jsonl.gz" --file "$dir/evidence-occurrences.jsonl.gz" --remote >/dev/null
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const m=JSON.parse(fs.readFileSync('data/research/review-evaluation-full-corpus/rev-eval-46255c55e8d1c5dc/inventory/inventory-manifest.json','utf8'));
          for(const [k,a] of Object.entries(m.artifacts)){
            const file=`.tmp/review-evaluation-inventory/rev-eval-46255c55e8d1c5dc/${k==='unique_evidence'?'unique-evidence.jsonl.gz':'evidence-occurrences.jsonl.gz'}`;
            const sha=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if(sha!==a.sha256) throw new Error(`${k} sha mismatch`);
          }
          console.log('inventory provenance ok');
          NODE

      - name: Build 700-row targeted blind annotation packet
        working-directory: work
        run: node scripts/build-review-evaluation-targeted-training-supplement.mjs

      - name: Verify blindness and lane quotas
        working-directory: work
        run: |
          set -euo pipefail
          root=data/research/review-evaluation-training/rev-eval-46255c55e8d1c5dc/targeted-supplement-v1
          node - "$root/targeted-supplement-input.json" "$root/targeted-supplement-selection-audit.json" "$root/annotation/targeted-supplement-gold-packet.json" <<'NODE'
          const fs=require('fs');const [inputPath,auditPath,packetPath]=process.argv.slice(2);
          const input=JSON.parse(fs.readFileSync(inputPath,'utf8')),audit=JSON.parse(fs.readFileSync(auditPath,'utf8')),packet=JSON.parse(fs.readFileSync(packetPath,'utf8'));
          if(input.rows.length!==700||packet.rows.length!==700) throw new Error('targeted row count mismatch');
          if(Object.keys(audit.lanes||{}).length!==7) throw new Error('lane count mismatch');
          for(const [k,v] of Object.entries(audit.lanes||{})) if(v.selected_rows!==100) throw new Error(`${k}: selected ${v.selected_rows}`);
          for(const r of packet.rows) for(const forbidden of ['product_id','review_ref','title','circle','lane_key','rating','heuristic_polarity','facets']) if(forbidden in r) throw new Error(`packet leak ${forbidden} ${r.row_id}`);
          if(packet.anti_leakage?.excludes_shadow_products!==true||packet.anti_leakage?.selection_lane_hidden_from_annotator!==true) throw new Error('anti leakage flags missing');
          console.log({rows:packet.rows.length,batches:packet.counts.batches,lanes:audit.lanes,selected_products:audit.counts.selected_products});
          NODE
          if grep -E -n 'https?://|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' "$root/annotation/targeted-supplement-gold-packet.json"; then
            echo 'privacy verifier: URL/email-like text leaked' >&2; exit 1
          fi

      - name: Commit targeted packet to private source
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          root=data/research/review-evaluation-training/rev-eval-46255c55e8d1c5dc/targeted-supplement-v1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$root"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: build targeted blind training supplement v1" || exit 0
          git pull --rebase origin main
          git push origin main
