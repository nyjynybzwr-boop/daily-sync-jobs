name: Build review evaluation mixed split packet

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-review-evaluation-mixed-split-packet.yml'

permissions:
  contents: read

concurrency:
  group: review-evaluation-mixed-split-packet
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PILOT_DIR: data/research/review-evaluation-pilot/otome-audio-otome-audio-review-evaluation-semantic-pilot-v1
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm reviewed decisions and assignments
        working-directory: work
        run: |
          set -euo pipefail
          for f in \
            mechanism-mapping-decisions.json \
            semantic-views.jsonl \
            semantic-target-assignments.jsonl \
            play-evaluation-reason-assignments.jsonl; do
              test -s "$PILOT_DIR/$f" || { echo "missing $PILOT_DIR/$f" >&2; exit 1; }
          done

      - name: Build mixed evidence split packet
        working-directory: work
        env:
          REVIEW_EVAL_PILOT_DIR: ${{ env.PILOT_DIR }}
        run: node scripts/build-review-evaluation-mixed-evidence-split-packet.mjs

      - name: Validate packet shape
        working-directory: work
        run: |
          set -euo pipefail
          for f in mixed-evidence-split-packet.json mixed-evidence-split-packet.md mixed-evidence-split-decisions.template.json; do
            test -s "$PILOT_DIR/$f" || { echo "missing $PILOT_DIR/$f" >&2; exit 1; }
          done
          node - "$PILOT_DIR/mixed-evidence-split-packet.json" <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const s=d.summary||{};
          if((s.mixed_general_clusters||0)+(s.mixed_play_clusters||0)<1) throw new Error('no mixed clusters');
          if((s.assignment_rows||0)<1) throw new Error('no mixed assignment rows');
          if((s.unique_evidence||0)<1) throw new Error('no unique evidence');
          console.log(s);
          NODE

      - name: Commit mixed split packet
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PILOT_DIR/mixed-evidence-split-packet.json" \
                  "$PILOT_DIR/mixed-evidence-split-packet.md" \
                  "$PILOT_DIR/mixed-evidence-split-decisions.template.json"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: mixed evidence split packet" || exit 0
          git pull --rebase origin main
          git push origin main
