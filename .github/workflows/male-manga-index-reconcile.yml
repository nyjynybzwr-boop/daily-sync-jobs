name: Male manga index reconcile

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/male-manga-index-reconcile.yml'

concurrency:
  group: male-manga-index-reconcile
  # A newer full reconciliation supersedes an older one. Keeping both alive only
  # increases the chance that catalog mutations during the older scan create drift.
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fresh full listing scan and exact reconciliation
        working-directory: work
        run: |
          set -u
          PROD_ROOT='data/male/manga/catalog/index'
          TMP_ROOT='.tmp/male-manga-reconcile/catalog'
          STATUS_FILE="$PROD_ROOT/reconcile-status.json"
          # The previous default/newest-first full walk could shift while new works
          # were inserted at page 1, producing duplicate pages and a small unique-ID
          # deficit. Walk oldest-first so new releases append at the far end instead.
          FULL_BASE='https://www.dlsite.com/maniax-touch/works/type/=/work_type_category/comic/order/release_a'
          # After the stable full walk, re-read the newest pages once to include works
          # released while the full scan was running.
          NEWEST_BASE='https://www.dlsite.com/maniax-touch/works/type/=/work_type_category/comic/order/release_d'
          before_ids="$(node -e "const i=require('./data/male/manga/catalog/index/ids.json');process.stdout.write(String(Object.keys(i).length))")"

          rm -rf .tmp/male-manga-reconcile
          mkdir -p "$TMP_ROOT/index"
          status='ok'
          failure=''

          # Build a completely fresh current ID set instead of unioning another
          # partial rescan into the old set. 500-page batches keep each collector
          # invocation bounded; the temp checkpoint naturally continues between them.
          for batch in $(seq 1 10); do
            echo "=== fresh manga oldest-first listing scan batch $batch ==="
            set +e
            DLSITE_CATALOG_BASE="$FULL_BASE" \
            DATA_ROOT="$TMP_ROOT" \
            MAX_PAGES_PER_RUN='500' \
            PAGE_DELAY_MS='1500' \
            node scripts/collect-catalog-index.mjs
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              status='failed'
              failure="collector_exit_${rc}_batch_${batch}"
              break
            fi

            read done stopped ids total last <<<"$(node - <<'NODE'
          const c=require('./.tmp/male-manga-reconcile/catalog/index/checkpoint.json');
          const i=require('./.tmp/male-manga-reconcile/catalog/index/ids.json');
          process.stdout.write(`${c.done ? 1 : 0} ${c.stopped_reason || 'none'} ${Object.keys(i).length} ${Number(c.source_total_count || 0)} ${Number(c.last_page || 0)}`);
          NODE
          )"
            echo "batch=$batch done=$done stopped=$stopped ids=$ids total=$total last_page=$last"
            if [ "$stopped" != 'none' ]; then
              status='failed'
              failure="${stopped}_batch_${batch}"
              break
            fi
            if [ "$done" = '1' ]; then
              break
            fi
          done

          if [ "$status" = 'ok' ]; then
            done="$(node -e "const c=require('./.tmp/male-manga-reconcile/catalog/index/checkpoint.json');process.stdout.write(c.done?'1':'0')")"
            if [ "$done" != '1' ]; then
              status='failed'
              failure='fresh_scan_did_not_reach_catalog_end'
            fi
          fi

          # New releases can appear while the full oldest-first scan is running.
          # Re-read the newest 500 pages after reaching the end while preserving the
          # fresh set. This captures those inserts without shifting the full-walk pages.
          if [ "$status" = 'ok' ]; then
            echo '=== final newest-500 top-up after stable full scan ==='
            set +e
            DLSITE_CATALOG_BASE="$NEWEST_BASE" \
            DATA_ROOT="$TMP_ROOT" \
            CATALOG_RESCAN_FROM_START='1' \
            MAX_PAGES_PER_RUN='500' \
            PAGE_DELAY_MS='1500' \
            node scripts/collect-catalog-index.mjs
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              status='failed'
              failure="topup_collector_exit_${rc}"
            fi
          fi

          if [ "$status" = 'ok' ]; then
            read fresh_ids source_total stopped done <<<"$(node - <<'NODE'
          const c=require('./.tmp/male-manga-reconcile/catalog/index/checkpoint.json');
          const i=require('./.tmp/male-manga-reconcile/catalog/index/ids.json');
          process.stdout.write(`${Object.keys(i).length} ${Number(c.source_total_count || 0)} ${c.stopped_reason || 'none'} ${c.done ? 1 : 0}`);
          NODE
          )"
            echo "fresh final: ids=$fresh_ids source_total=$source_total stopped=$stopped done=$done"
            if [ "$stopped" != 'none' ] || [ "$done" != '1' ]; then
              status='failed'
              failure="fresh_final_invalid_checkpoint_${stopped}_done_${done}"
            elif [ "$fresh_ids" -ne "$source_total" ]; then
              status='failed'
              failure="fresh_set_count_mismatch_${fresh_ids}_vs_${source_total}"
            fi
          fi

          # Only replace production IDs after the fresh set independently proves
          # that its unique-ID count equals DLsite's own declared total.
          if [ "$status" = 'ok' ]; then
            cp "$TMP_ROOT/index/ids.json" "$PROD_ROOT/ids.json"
            cp "$TMP_ROOT/index/checkpoint.json" "$PROD_ROOT/checkpoint.json"
          fi

          STATUS="$status" FAILURE="$failure" BEFORE_IDS="$before_ids" node - <<'NODE'
          const fs=require('node:fs');
          const path='data/male/manga/catalog/index/reconcile-status.json';
          const status=process.env.STATUS;
          const prodIds=require('./data/male/manga/catalog/index/ids.json');
          const prodCheckpoint=require('./data/male/manga/catalog/index/checkpoint.json');
          const row={
            schema_version:1,
            updated_at:new Date().toISOString(),
            status,
            failure:process.env.FAILURE || null,
            before_ids:Number(process.env.BEFORE_IDS || 0),
            after_ids:Object.keys(prodIds).length,
            source_total_count:Number(prodCheckpoint.source_total_count || 0),
            gap:Number(prodCheckpoint.source_total_count || 0)-Object.keys(prodIds).length,
            strategy:'oldest-first-full-scan-plus-newest-500-topup',
          };
          fs.writeFileSync(path, JSON.stringify(row,null,2)+'\n');
          console.log(row);
          NODE

      - name: Persist reconciled index
        if: always()
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [ -n "$(git status --porcelain -- data/male/manga/catalog/index)" ]; then
            git add data/male/manga/catalog/index
            git commit -m "data: reconcile male manga catalog index"
            for retry in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin main; then break; fi
              if [ "$retry" = 5 ]; then exit 1; fi
              sleep $((retry * 5))
            done
          fi

      - name: Verify exact reconciled count
        working-directory: work
        run: |
          set -euo pipefail
          git pull --rebase origin main
          node - <<'NODE'
          const s=require('./data/male/manga/catalog/index/reconcile-status.json');
          const c=require('./data/male/manga/catalog/index/checkpoint.json');
          const i=require('./data/male/manga/catalog/index/ids.json');
          const ids=Object.keys(i).length;
          const total=Number(c.source_total_count||0);
          const gap=total-ids;
          console.log({status:s.status,failure:s.failure,ids,total,gap,done:c.done,stopped_reason:c.stopped_reason});
          if (s.status !== 'ok' || !c.done || c.stopped_reason || gap !== 0) process.exit(2);
          NODE

      - name: Start male manga full R2 crawl immediately
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run male-r2-full-manga.yml --repo "$GITHUB_REPOSITORY"
