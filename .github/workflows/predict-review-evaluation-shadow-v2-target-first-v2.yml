name: Freeze target-first v2 predictions on fresh Shadow-v2 before gold

on:
  workflow_dispatch:
  push:
    paths:
      - '.review-evaluation-shadow-v2-predict-trigger'

permissions:
  contents: read

concurrency:
  group: review-evaluation-shadow-v2-predict-v2
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: rev-eval-46255c55e8d1c5dc
      HF_HOME: ${{ github.workspace }}/.cache/huggingface-shadow-v2-predict
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Prove human gold decisions do not exist yet
        working-directory: work
        run: |
          set -euo pipefail
          dir=data/research/review-evaluation-calibration/otome-audio-otome-audio-review-evaluation-shadow-v2/human-gold
          test -s "$dir/shadow-v2-gold-packet.jsonl"
          if find "$dir" -maxdepth 1 -type f -name 'shadow-v2-gold-decisions-batch-*.json' ! -name '*.template.json' | grep -q .; then echo 'Shadow-v2 human gold already exists' >&2; exit 1; fi
          test ! -e "data/research/review-evaluation-classifier/${VERSION}/shadow-v2-target-first-predictions-v2.jsonl"
          node - <<'NODE'
          const fs=require('fs'),V='rev-eval-46255c55e8d1c5dc';
          const f=JSON.parse(fs.readFileSync(`data/research/review-evaluation-classifier/${V}/production-freeze-v2.json`,'utf8'));
          if(f.status!=='review_evaluation_production_v2_frozen_before_new_disjoint_holdout'||f.selection_policy?.uses_shadow_v1_metrics!==false) throw new Error('v2 freeze drift');
          console.log({freeze:f.freeze_payload_sha256,targets:f.targets.selected_target_keys});
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: work/package-lock.json

      - name: Install Node dependencies
        working-directory: work
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Materialize fresh Shadow-v2 evidence-only E5 embeddings
        working-directory: work
        run: node scripts/materialize-review-evaluation-shadow-v2-target-first-embeddings.mjs

      - name: Download frozen base v2 embeddings
        working-directory: work
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          d=.tmp/review-evaluation-classifier/${VERSION}/v2;mkdir -p "$d"
          key=review-evaluation-classifier/${VERSION}/training-v2/training-embeddings-v2.jsonl.gz
          npx --yes wrangler@latest r2 object get "melosignal-data/${key}" --file "$d/training-embeddings-v2.jsonl.gz" --remote >/dev/null
          gzip -dc "$d/training-embeddings-v2.jsonl.gz" > "$d/training-embeddings-v2.jsonl"
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),V='rev-eval-46255c55e8d1c5dc';
          const m=JSON.parse(fs.readFileSync(`data/research/review-evaluation-classifier/${V}/training-embedding-manifest-v2.json`,'utf8'));
          const f=`.tmp/review-evaluation-classifier/${V}/v2/training-embeddings-v2.jsonl.gz`;const sha=crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          if(m.rows!==3528||m.vector_dimension!==384||m.r2?.compressed_sha256!==sha||m.model?.paid_api!==false) throw new Error('base embedding provenance mismatch');
          NODE

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install classifier dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Generate and hash frozen pre-gold predictions
        working-directory: work
        run: |
          set -euo pipefail
          python -m py_compile scripts/predict-review-evaluation-shadow-v2-target-first-v2.py
          python scripts/predict-review-evaluation-shadow-v2-target-first-v2.py

      - name: Commit predictions before human gold annotation starts
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          base=data/research/review-evaluation-classifier/${VERSION}
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$base/shadow-v2-target-first-predictions-v2.jsonl" "$base/shadow-v2-target-first-prediction-manifest-v2.json"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: freeze fresh Shadow-v2 predictions before human gold"
          git reset --hard HEAD
          for attempt in 1 2 3 4 5 6; do git fetch origin main; git rebase origin/main; if git push origin HEAD:main; then exit 0; fi; sleep $((attempt * 3)); done
          exit 1
