name: Audit review reception-profile training coverage

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-review-reception-profile-training.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit reception-profile training coverage
        working-directory: work
        run: node scripts/audit-review-reception-profile-training.mjs

      - name: Verify audit output
        working-directory: work
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='data/research/review-reception-profile/training-coverage-audit-v1.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(x.status!=='review_reception_profile_training_coverage_audit_v1') throw new Error(`bad status ${x.status}`);
          if(!(x.counts?.usable_evaluative_gold_rows>0)) throw new Error('no usable human gold');
          if(!(x.canonical_reusable_coverage?.atmosphere_texture?.rows>0)) throw new Error('no atmosphere coverage');
          if(x.counts?.parse_errors!==0) throw new Error(`parse errors ${x.counts.parse_errors}`);
          console.log(JSON.stringify(x.counts,null,2));
          NODE

      - name: Commit audit to private source
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/review-reception-profile/training-coverage-audit-v1.json
          if git diff --cached --quiet; then
            echo 'No audit changes.'
            exit 0
          fi
          git commit -m '[CF-Pages-Skip] [skip actions] reviews: record reception-profile training coverage'
          git pull --rebase origin main
          git push origin HEAD:main
