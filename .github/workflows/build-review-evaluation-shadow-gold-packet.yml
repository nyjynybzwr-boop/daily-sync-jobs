name: Build review evaluation shadow gold packet

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-review-evaluation-shadow-gold-packet.yml'
      - '.review-evaluation-shadow-gold-trigger'

permissions:
  contents: read

concurrency:
  group: review-evaluation-shadow-gold-packet
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHADOW_DIR: data/research/review-evaluation-calibration/otome-audio-otome-audio-review-evaluation-shadow-v1
      GOLD_DIR: data/research/review-evaluation-calibration/otome-audio-otome-audio-review-evaluation-shadow-v1/human-gold
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build shadow human-gold packet
        working-directory: work
        env:
          REVIEW_SHADOW_DIR: ${{ env.SHADOW_DIR }}
          REVIEW_SHADOW_GOLD_DIR: ${{ env.GOLD_DIR }}
          REVIEW_SHADOW_GOLD_BATCH_COUNT: '4'
        run: node scripts/build-review-evaluation-shadow-gold-packet.mjs

      - name: Verify blank gold packet
        working-directory: work
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const idx=JSON.parse(fs.readFileSync(process.env.GOLD_DIR+'/index.json','utf8'));
          const packet=JSON.parse(fs.readFileSync(process.env.GOLD_DIR+'/shadow-gold-packet.json','utf8'));
          if(packet.status!=='blank_disjoint_shadow_calibration_gold_packet') throw new Error(`status ${packet.status}`);
          if(packet.counts.evidence_rows!==446) throw new Error(`expected 446 rows, got ${packet.counts.evidence_rows}`);
          if(packet.counts.products!==23) throw new Error(`expected 23 products with evidence, got ${packet.counts.products}`);
          if(idx.batches.length!==4) throw new Error(`expected 4 batches, got ${idx.batches.length}`);
          if(idx.batches.reduce((s,b)=>s+b.row_count,0)!==446) throw new Error('batch row total mismatch');
          console.log({counts:packet.counts,batches:idx.batches});
          NODE
          for n in 001 002 003 004; do
            test -s "$GOLD_DIR/shadow-gold-batch-$n.json"
            test -s "$GOLD_DIR/shadow-gold-decisions-batch-$n.template.json"
          done

      - name: Commit shadow gold packet
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$GOLD_DIR"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: shadow calibration gold packet" || exit 0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
