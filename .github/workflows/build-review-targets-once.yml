name: Build review target manifests once

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-review-targets-once.yml'

concurrency:
  group: build-review-target-manifests
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_BUCKET_NAME: melosignal-data
    steps:
      - name: Checkout private source without LFS smudge
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Hydrate female and BL full catalogs
        working-directory: work
        run: |
          set -euo pipefail
          git lfs pull --include='data/catalog/full/details.json,data/bl/catalog/full/details.json,data/manga/catalog/full/details.json,data/manga/bl/catalog/full/details.json' --exclude=''
          for f in data/catalog/full/details.json data/bl/catalog/full/details.json data/manga/catalog/full/details.json data/manga/bl/catalog/full/details.json; do
            test -s "$f" || { echo "missing $f" >&2; exit 2; }
            head -c 32 "$f"
            echo
          done

      - name: Download completed male R2 detail chunks
        working-directory: work
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/review-targets/male/audio .tmp/review-targets/male/manga
          audio_chunks="$(node -e "const p=require('./data/male/r2/audio-progress.json'); if(p.pending!==0||p.stopped_reason) process.exit(2); process.stdout.write(String(p.next_chunk))")"
          manga_chunks="$(node -e "const p=require('./data/male/r2/manga-progress.json'); if(p.pending!==0||p.stopped_reason) process.exit(2); process.stdout.write(String(p.next_chunk))")"
          echo "male audio chunks=$audio_chunks manga chunks=$manga_chunks"

          # These are Cloudflare R2 reads only, not DLsite requests. Parallelizing
          # this stage does not change the deliberately serial DLsite crawl rate.
          npx --yes wrangler@latest --version >/dev/null
          download_one() {
            local media="$1" i="$2" pad attempt=1
            pad="$(printf '%05d' "$i")"
            while true; do
              if npx --yes wrangler@latest r2 object get "${R2_BUCKET_NAME}/male/${media}/raw/chunk-${pad}.json.gz" --file ".tmp/review-targets/male/${media}/chunk-${pad}.json.gz" --remote >/dev/null 2>&1; then
                return 0
              fi
              if [ "$attempt" -ge 3 ]; then
                echo "R2 download failed: ${media}/chunk-${pad}" >&2
                return 1
              fi
              sleep $((attempt * 3))
              attempt=$((attempt + 1))
            done
          }
          export -f download_one
          export R2_BUCKET_NAME
          {
            for i in $(seq 0 $((audio_chunks-1))); do echo "audio $i"; done
            for i in $(seq 0 $((manga_chunks-1))); do echo "manga $i"; done
          } | xargs -n2 -P8 bash -c 'download_one "$1" "$2"' _
          echo 'All male R2 detail chunks downloaded.'

      - name: Build target manifests
        working-directory: work
        run: |
          set -euo pipefail
          mkdir -p data/reviews/targets data/reviews/progress data/reviews/manifests
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import { gunzipSync } from 'node:zlib';

          const specs=[
            {segment:'otome-audio',market:'otome',media:'audio',api_base:'girls',file:'data/catalog/full/details.json'},
            {segment:'bl-audio',market:'bl',media:'audio',api_base:'bl',file:'data/bl/catalog/full/details.json'},
            {segment:'otome-manga',market:'otome',media:'manga',api_base:'girls',file:'data/manga/catalog/full/details.json'},
            {segment:'bl-manga',market:'bl',media:'manga',api_base:'bl',file:'data/manga/bl/catalog/full/details.json'},
          ];
          const clean=s=>String(s??'').replace(/\s+/g,' ').trim();
          const validId=id=>/^(?:RJ|BJ|VJ|AJ)\d+$/.test(String(id||'').toUpperCase());
          const reviewCount=x=>{
            if(x?.detail_error)return null;
            const raw=x?.review_count ?? x?.reviews;
            if(raw===null||raw===undefined||raw==='')return null;
            const n=Number(raw);
            return Number.isFinite(n)&&n>=0?n:null;
          };
          const makeTarget=(item,spec)=>({
            product_id:String(item?.product_id||'').toUpperCase(),
            expected_review_count:reviewCount(item),
            title:clean(item?.title||item?.work_name||item?.name||''),
            circle:clean(item?.circle||item?.circle_name||''),
            market:spec.market,
            media:spec.media,
            api_base:spec.api_base,
          });
          const buildSegment=(works,spec)=>{
            const valid=works.filter(x=>validId(x?.product_id));
            const counts=valid.map(x=>reviewCount(x));
            const knownZero=counts.filter(x=>x===0).length;
            const unknown=counts.filter(x=>x===null).length;
            const targets=valid.filter(x=>{const n=reviewCount(x);return n===null||n>0}).map(x=>makeTarget(x,spec));
            const seen=new Set();
            const dedup=targets.filter(x=>!seen.has(x.product_id)&&seen.add(x.product_id));
            const expectedReviews=dedup.reduce((s,x)=>s+(x.expected_review_count??0),0);
            return {valid,dedup,knownZero,unknown,expectedReviews};
          };
          const targetSignature=targets=>targets.map(x=>`${x.product_id}\u0000${x.expected_review_count??''}\u0000${x.api_base}`).join('\n');
          async function stableGeneratedAt(file,targets){
            try{
              const old=JSON.parse(await fs.readFile(file,'utf8'));
              if(Number(old?.schema_version||0)>=2 && old?.generated_at && Array.isArray(old?.targets) && targetSignature(old.targets)===targetSignature(targets)) return old.generated_at;
            }catch{}
            return new Date().toISOString();
          }
          const outputs=[];

          for(const spec of specs){
            const map=JSON.parse(await fs.readFile(spec.file,'utf8'));
            const works=Array.isArray(map)?map:Object.values(map);
            const b=buildSegment(works,spec);
            const file=`data/reviews/targets/${spec.segment}.json`;
            const generatedAt=await stableGeneratedAt(file,b.dedup);
            const out={schema_version:2,generated_at:generatedAt,segment:spec.segment,market:spec.market,media:spec.media,api_base:spec.api_base,source_work_count:works.length,valid_id_work_count:b.valid.length,target_work_count:b.dedup.length,known_zero_skipped_count:b.knownZero,unknown_review_count_target_count:b.unknown,expected_review_count_sum_known:b.expectedReviews,targets:b.dedup};
            await fs.writeFile(file,JSON.stringify(out,null,2)+'\n');
            outputs.push({segment:spec.segment,source_works:works.length,target_works:b.dedup.length,known_zero_skipped:b.knownZero,unknown_targets:b.unknown,expected_reviews_known:b.expectedReviews,generated_at:generatedAt});
          }

          for(const media of ['audio','manga']){
            const spec={segment:`male-${media}`,market:'male',media,api_base:'maniax'};
            const dir=`.tmp/review-targets/male/${media}`;
            const files=(await fs.readdir(dir)).filter(x=>x.endsWith('.json.gz')).sort();
            const works=[];
            for(const f of files){
              const payload=JSON.parse(gunzipSync(await fs.readFile(path.join(dir,f))).toString('utf8'));
              for(const item of payload.works||[]) works.push(item);
            }
            const b=buildSegment(works,spec);
            const file=`data/reviews/targets/${spec.segment}.json`;
            const generatedAt=await stableGeneratedAt(file,b.dedup);
            const out={schema_version:2,generated_at:generatedAt,segment:spec.segment,market:spec.market,media:spec.media,api_base:spec.api_base,source_work_count:works.length,valid_id_work_count:b.valid.length,target_work_count:b.dedup.length,known_zero_skipped_count:b.knownZero,unknown_review_count_target_count:b.unknown,expected_review_count_sum_known:b.expectedReviews,targets:b.dedup};
            await fs.writeFile(file,JSON.stringify(out,null,2)+'\n');
            outputs.push({segment:spec.segment,source_works:works.length,target_works:b.dedup.length,known_zero_skipped:b.knownZero,unknown_targets:b.unknown,expected_reviews_known:b.expectedReviews,generated_at:generatedAt});
          }
          const summary={schema_version:2,generated_at:new Date().toISOString(),segments:outputs,total_source_works:outputs.reduce((s,x)=>s+x.source_works,0),total_target_works:outputs.reduce((s,x)=>s+x.target_works,0),known_zero_skipped_total:outputs.reduce((s,x)=>s+x.known_zero_skipped,0),unknown_review_count_target_total:outputs.reduce((s,x)=>s+x.unknown_targets,0),expected_review_count_sum_known:outputs.reduce((s,x)=>s+x.expected_reviews_known,0)};
          await fs.writeFile('data/reviews/targets/summary.json',JSON.stringify(summary,null,2)+'\n');
          console.log(JSON.stringify(summary,null,2));
          NODE

      - name: Commit target manifests to private source
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/reviews/targets
          git commit -m '[CF-Pages-Skip] [skip actions] reviews: build complete target manifests' || exit 0
          git pull --rebase origin main
          git push origin main
