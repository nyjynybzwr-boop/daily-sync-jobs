name: Home swipe polish smoke once

on:
  push:
    paths:
      - '.github/workflows/home-swipe-polish-smoke-once.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check polished swipe UI
        working-directory: work
        run: |
          node --check web/home-ui-navigation.js
          node --check web/refine-v4.js
          grep -q "homeSnapshotNewLeftPolished" web/refine-v4.js
          grep -q "translate3d(100%" web/refine-v4.js
          grep -q "opacity:1!important" web/refine-v4.js
          node scripts/check-web-syntax.mjs
