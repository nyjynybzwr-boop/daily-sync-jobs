name: Nuance v8 production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nuance-v8-production-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout live private main
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and audit
        working-directory: work
        run: |
          npm ci
          npm audit --omit=dev
      - name: Syntax check production files
        working-directory: work
        run: |
          node --check api/nuance-search.js
          node --check web/all-nuance-search.js
          node --check web/all.js
      - name: Run all regressions
        working-directory: work
        run: npm test
      - name: Run web syntax checker
        working-directory: work
        run: node scripts/check-web-syntax.mjs
      - name: Materialize production indices
        working-directory: work
        run: git lfs pull --include="api/data/nuance-v8-meta.json,api/data/nuance-v8-vectors.bin,api/data/nuance-v8-bl-meta.json,api/data/nuance-v8-bl-vectors.bin"
      - name: End-to-end API smoke for otome and BL
        working-directory: work
        run: |
          node --input-type=module <<'NODE'
          import handler from './api/nuance-search.js';
          async function call(query,market){
            let statusCode=200,payload=null,headers={};
            const req={method:'GET',query:{q:query,market}};
            const res={
              status(code){statusCode=code;return this;},
              setHeader(k,v){headers[k]=v;return this;},
              json(value){payload=value;return this;},
            };
            const started=Date.now();
            await handler(req,res);
            console.log(`${market}: status=${statusCode} results=${payload?.results?.length} works=${payload?.total_works} engine=${payload?.engine} ms=${Date.now()-started}`);
            if(statusCode!==200)throw new Error(`${market} API status ${statusCode}: ${JSON.stringify(payload)}`);
            if(!Array.isArray(payload.results)||payload.results.length<10)throw new Error(`${market} too few results`);
            if(!String(payload.engine||'').startsWith('nuance-v8-prod'))throw new Error(`${market} wrong engine ${payload.engine}`);
            return payload;
          }
          const otome=await call('女の子にちんぽを触られて、男が余裕をなくして喘いでしまう','otome');
          if(otome.results[0]?.product_id!=='RJ01093983')throw new Error(`otome parity regression: top=${otome.results[0]?.product_id}`);
          const bl=await call('男が相手の反応に釣られて余裕をなくして喘ぐ','bl');
          if(Number(bl.total_works)<2000)throw new Error(`BL index unexpectedly small: ${bl.total_works}`);
          console.log('live production API smoke: passed');
          NODE
