name: Compare review evaluation Tier B target classifier

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compare-review-evaluation-tier-b-target.yml'
      - '.review-evaluation-tier-b-target-ab-trigger'

permissions:
  contents: read

concurrency:
  group: review-evaluation-tier-b-target-ab
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install free local classifier dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Download frozen Tier A and Tier B embeddings
        working-directory: work
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          dir=.tmp/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc
          mkdir -p "$dir"
          npx --yes wrangler r2 object get "melosignal-data/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/training/training-embeddings.jsonl.gz" --file "$dir/training-embeddings.jsonl.gz" --remote
          npx --yes wrangler r2 object get "melosignal-data/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/training/tier-b-target-embeddings.jsonl.gz" --file "$dir/tier-b-target-embeddings.jsonl.gz" --remote
          gzip -dc "$dir/training-embeddings.jsonl.gz" > "$dir/training-embeddings.jsonl"
          gzip -dc "$dir/tier-b-target-embeddings.jsonl.gz" > "$dir/tier-b-target-embeddings.jsonl"

      - name: Verify embedding provenance
        working-directory: work
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const root='data/research/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc';
          for(const [mf,gz] of [[`${root}/training-embedding-manifest.json`,'.tmp/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/training-embeddings.jsonl.gz'],[`${root}/tier-b-target-embedding-manifest.json`,'.tmp/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/tier-b-target-embeddings.jsonl.gz']]){const m=JSON.parse(fs.readFileSync(mf,'utf8')),b=fs.readFileSync(gz),sha=crypto.createHash('sha256').update(b).digest('hex');if(m.r2?.compressed_sha256!==sha||m.model?.paid_api!==false)throw new Error(`provenance mismatch ${mf}`);}
          console.log('embedding provenance ok');
          NODE

      - name: Compare Tier A baseline against Tier A plus downweighted Tier B
        working-directory: work
        run: |
          set -euo pipefail
          python -m py_compile scripts/compare-review-evaluation-tier-b-target.py
          python scripts/compare-review-evaluation-tier-b-target.py

      - name: Verify comparison boundary
        working-directory: work
        run: |
          set -euo pipefail
          r=data/research/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/tier-b-target-ab-report.json
          m=data/research/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/tier-b-target-augmented-model.json
          node - "$r" "$m" <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8')),m=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));if(r.shadow_v1_opened!==false||m.shadow_used!==false)throw new Error('shadow seal violated');if(r.counts?.tier_b_train_used!==162)throw new Error(`unexpected Tier B fit count ${r.counts?.tier_b_train_used}`);if(r.comparison_policy?.tier_a_calibration_unchanged!==true||r.comparison_policy?.tier_a_development_validation_unchanged!==true)throw new Error('comparison boundary drift');console.log({status:r.status,baseline:r.baseline,augmented:r.augmented,decision:r.decision});
          NODE
          if grep -n -E 'shadow-calibration/.*/(human-gold|predictions)|shadow-predictions|human-gold' scripts/compare-review-evaluation-tier-b-target.py; then echo 'A/B script references sealed shadow labels' >&2; exit 1; fi

      - name: Commit Tier B A/B decision
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          root=data/research/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$root/tier-b-target-ab-report.json" "$root/tier-b-target-augmented-model.json"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: compare Tier B target training admission" || exit 0
          git pull --rebase origin main
          git push origin main
