name: Inspect manga product routing metadata once

on:
  push:
    paths:
      - '.github/workflows/inspect-manga-product-routing-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare two DLsite manga product pages
        run: |
          npm install --no-save cheerio devalue
          node --input-type=module <<'NODE'
          import * as cheerio from 'cheerio';
          import { parse } from 'devalue';
          const UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1';
          const targets=[
            ['missing','RJ01512512'],
            ['known','RJ01538553'],
          ];
          const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
          function decodeNuxt(html){
            const m=html.match(/<script[^>]*\bid="__NUXT_DATA__"[^>]*>([\s\S]*?)<\/script>/);
            if(!m)return null;
            try{return parse(m[1],{ShallowReactive:v=>v,Reactive:v=>v,Ref:v=>v,ShallowRef:v=>v});}catch(e){return {parse_error:String(e)};}
          }
          function scan(root){
            const hits=[]; const seen=new Set();
            function walk(v,path='root',depth=0){
              if(depth>9||hits.length>400)return;
              if(typeof v==='string'){
                if(/doujin|books|comic|manga|マンガ|同人|電子書籍|商業|乙女|TL|girls-touch|work_category|work_type|category/i.test(v)) hits.push({path,value:clean(v).slice(0,250)});
                return;
              }
              if(!v||typeof v!=='object'||seen.has(v))return;
              seen.add(v);
              if(Array.isArray(v)) v.forEach((x,i)=>walk(x,`${path}[${i}]`,depth+1));
              else Object.entries(v).forEach(([k,x])=>{
                if(/category|type|floor|site|shop|work|genre/i.test(k)&&['string','number','boolean'].includes(typeof x)) hits.push({path:`${path}.${k}`,value:String(x).slice(0,250)});
                walk(x,`${path}.${k}`,depth+1);
              });
            }
            walk(root);
            return hits;
          }
          for(const [label,id] of targets){
            const url=`https://www.dlsite.com/girls-touch/work/=/product_id/${id}.html`;
            const res=await fetch(url,{headers:{'User-Agent':UA,'Accept-Language':'ja-JP,ja;q=0.9'},redirect:'follow'});
            const html=await res.text(); const $=cheerio.load(html);
            const links=[];
            $('a[href]').each((_,a)=>{
              const href=$(a).attr('href')||''; const text=clean($(a).text());
              if(text&&(/マンガ|同人|乙女|TL|作品一覧|ぽつねんじん|強肉強食/.test(text)||/work_category|work_type_category|fsr|works\/type/.test(href))) links.push({text:text.slice(0,100),href});
            });
            const body=clean($('body').text());
            const rows=[...body.matchAll(/作品形式.{0,120}|作品カテゴリ.{0,120}|ジャンル.{0,120}|販売日.{0,80}/g)].map(m=>m[0]).slice(0,30);
            console.log('PRODUCT_ROUTE '+JSON.stringify({label,id,status:res.status,final_url:res.url,title:clean($('title').text()),rows,links:links.slice(0,120),nuxt_hits:scan(decodeNuxt(html))}));
          }
          NODE
