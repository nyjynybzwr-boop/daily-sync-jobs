name: Research release-year Top50 persist

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/research-release-year-top50-probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: research-release-year-top50-probe
  cancel-in-progress: false

jobs:
  persist-audited-cohorts:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4

      - name: Download audited cohort artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: '9695900569'
        run: |
          mkdir -p "$RUNNER_TEMP/top50-artifact"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > "$RUNNER_TEMP/top50.zip"
          unzip -q "$RUNNER_TEMP/top50.zip" -d "$RUNNER_TEMP/top50-artifact"
          test -f "$RUNNER_TEMP/top50-artifact/raw/2023.json"
          test -f "$RUNNER_TEMP/top50-artifact/raw/2024.json"
          test -f "$RUNNER_TEMP/top50-artifact/raw/2025.json"
          test -f "$RUNNER_TEMP/top50-artifact/raw/2026-current.json"

      - name: Verify cohort integrity before persistence
        run: |
          python - <<'PY'
          import json, os
          root = os.path.join(os.environ['RUNNER_TEMP'], 'top50-artifact', 'raw')
          expected = {
              '2023.json': (2023, 'annual_final', None),
              '2024.json': (2024, 'annual_final', None),
              '2025.json': (2025, 'annual_final', None),
              '2026-current.json': (2026, 'current_ytd', '2026-08-29'),
          }
          for name, (year, status, as_of) in expected.items():
              with open(os.path.join(root, name), encoding='utf-8') as f:
                  d = json.load(f)
              assert d['ranking_year'] == year, (name, d['ranking_year'])
              assert d['release_year_filter'] == year, (name, d['release_year_filter'])
              assert d['period_status'] == status, (name, d['period_status'])
              assert d.get('as_of_date') == as_of, (name, d.get('as_of_date'))
              assert d['complete'] is True and d['item_count'] == 50, name
              assert [x['release_year_rank'] for x in d['items']] == list(range(1, 51)), name
              assert all(x['release_year'] == year for x in d['items']), name
              source_ranks = [x['source_ranking_rank'] for x in d['items']]
              assert source_ranks == sorted(source_ranks) and len(source_ranks) == len(set(source_ranks)), name
              unresolved = [x for x in d['selection_audit'] if x['decision'] not in ('included', 'excluded_release_year_mismatch')]
              assert not unresolved, (name, unresolved)
              print(f'{name}: verified 50/50; source rank through {source_ranks[-1]}')
          PY

      - name: Checkout private research repository
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" "$RUNNER_TEMP/dlsite-trend-radar"

      - name: Persist raw cohort files only
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
        run: |
          repo="$RUNNER_TEMP/dlsite-trend-radar"
          dest="$repo/data/research/otome-audio-release-year-sales-top50/raw"
          mkdir -p "$dest"
          cp "$RUNNER_TEMP/top50-artifact/raw/2023.json" "$dest/2023.json"
          cp "$RUNNER_TEMP/top50-artifact/raw/2024.json" "$dest/2024.json"
          cp "$RUNNER_TEMP/top50-artifact/raw/2025.json" "$dest/2025.json"
          cp "$RUNNER_TEMP/top50-artifact/raw/2026-current.json" "$dest/2026-current.json"
          cd "$repo"
          git config user.name 'research-sync-bot'
          git config user.email 'research-sync-bot@users.noreply.github.com'
          git add data/research/otome-audio-release-year-sales-top50/raw
          if git diff --cached --quiet; then
            echo 'No cohort data changes to commit.'
            exit 0
          fi
          git commit -m 'research: add audited release-year sales Top50 cohorts'
          git push origin HEAD:main
