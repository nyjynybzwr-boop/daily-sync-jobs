name: Research release-year Top50 probe

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/research-release-year-top50-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-release-year-top50-probe
  cancel-in-progress: false

jobs:
  collect-all-years:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout runner repository
        uses: actions/checkout@v4

      - name: Checkout private research source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" "$RUNNER_TEMP/dlsite-trend-radar"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install collector dependencies
        working-directory: ${{ runner.temp }}/dlsite-trend-radar
        run: |
          npm ci
          npm install --no-save playwright devalue
          npx playwright install --with-deps chromium

      - name: Syntax check collector
        working-directory: ${{ runner.temp }}/dlsite-trend-radar
        run: node --check scripts/backfill-release-year-sales-top50.mjs

      - name: Collect release-year sales Top50 cohorts
        id: collect
        continue-on-error: true
        working-directory: ${{ runner.temp }}/dlsite-trend-radar
        env:
          YEARS: '2023,2024,2025,2026'
          TARGET_COUNT: '50'
          RANKING_SCAN_LIMIT: '200'
          MAX_RANKING_PAGES: '10'
          RANKING_MAX_ATTEMPTS: '4'
          DETAIL_DELAY_MS: '800'
          PAGE_DELAY_MS: '1000'
          DETAIL_MAX_ATTEMPTS: '4'
          DETAIL_RETRY_DELAY_MS: '1500'
          AS_OF_DATE: '2026-08-29'
          DATA_ROOT: ${{ runner.temp }}/release-year-top50
        run: node scripts/backfill-release-year-sales-top50.mjs

      - name: Upload complete or partial cohort audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-year-top50-2023-2026
          path: ${{ runner.temp }}/release-year-top50
          if-no-files-found: warn
          retention-days: 3

      - name: Fail if any cohort was incomplete
        if: steps.collect.outcome != 'success'
        run: |
          echo 'At least one cohort was incomplete; inspect the preserved artifact.'
          exit 1
