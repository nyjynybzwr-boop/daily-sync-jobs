name: Audit unregistered words across four markets

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/audit-unregistered-words.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and build dashboard
        working-directory: work
        run: |
          set -euo pipefail
          npm ci >/tmp/npm-ci.log 2>&1
          npm run build:site

      - name: Audit candidate buckets and source evidence
        working-directory: work
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const dashboard=JSON.parse(fs.readFileSync('site/data/dashboard.json','utf8'));

          const configs=[
            {id:'otome_audio',label:'乙女音声',data:dashboard.media?.audio?.otome || dashboard.markets?.otome,root:'data'},
            {id:'bl_audio',label:'BL音声',data:dashboard.media?.audio?.bl || dashboard.markets?.bl,root:'data/bl'},
            {id:'otome_manga',label:'乙女漫画',data:dashboard.media?.comic?.otome,root:'data/manga'},
            {id:'bl_manga',label:'BL漫画',data:dashboard.media?.comic?.bl,root:'data/manga/bl'},
          ];

          function latestJson(dir){
            if(!fs.existsSync(dir)) return null;
            const files=fs.readdirSync(dir).filter(f=>/^\d{4}-\d{2}-\d{2}\.json$/.test(f)).sort();
            return files.length?path.join(dir,files.at(-1)):null;
          }
          function rawItems(root){
            const f=latestJson(path.join(root,'raw'));
            if(!f) return {file:null,items:[]};
            const j=JSON.parse(fs.readFileSync(f,'utf8'));
            return {file:f,items:j.items||[]};
          }
          function candidateRows(report){
            if(!report) return [];
            const promoted=[...(report.auto_candidates?.tags||[]),...(report.auto_candidates?.phrases||[])];
            const promotedLabels=new Set(promoted.map(r=>r.label));
            const pendingTags=(report.pending_candidates?.tags||[]).filter(r=>!promotedLabels.has(r.label)).map(r=>({...r,source_bucket:'pending_official_tag'}));
            const pendingPhrases=(report.pending_candidates?.phrases||[]).filter(r=>!promotedLabels.has(r.label)).map(r=>({...r,source_bucket:'pending_free_phrase'}));
            const pendingLabels=new Set([...pendingTags,...pendingPhrases].map(r=>r.label));
            const rawTags=(report.emerging_tags||[]).filter(r=>!promotedLabels.has(r.label)&&!pendingLabels.has(r.label)).map(r=>({...r,source_bucket:'today_official_tag'}));
            const rawPhrases=(report.emerging_phrases||[]).filter(r=>!promotedLabels.has(r.label)&&!pendingLabels.has(r.label)).map(r=>({...r,source_bucket:'today_free_phrase'}));
            return [...pendingTags,...pendingPhrases,...rawTags,...rawPhrases];
          }
          function flattenText(item){
            const vals=[];
            const walk=(v,k='')=>{
              if(v==null)return;
              if(typeof v==='string') vals.push({field:k,text:v});
              else if(Array.isArray(v)) v.forEach((x,i)=>walk(x,`${k}[${i}]`));
              else if(typeof v==='object') for(const [kk,vv] of Object.entries(v)) walk(vv,k?`${k}.${kk}`:kk);
            };
            // Restrict to source-ish fields; do not let derived labels become fake evidence.
            for(const key of ['title','description','description_long','tags','tracks','content_sections','introductions']) walk(item[key],key);
            return vals;
          }
          function evidenceFor(label,items){
            const norm=String(label).normalize('NFKC');
            const out=[];
            for(const item of items){
              for(const row of flattenText(item)){
                const t=String(row.text).normalize('NFKC');
                const idx=t.indexOf(norm);
                if(idx<0) continue;
                const s=Math.max(0,idx-70),e=Math.min(t.length,idx+norm.length+110);
                out.push({rank:item.rank??null,product_id:item.product_id,title:item.title,field:row.field,snippet:t.slice(s,e).replace(/\s+/g,' ')});
                break;
              }
              if(out.length>=5)break;
            }
            return out;
          }

          const result={generated_at:new Date().toISOString(),markets:{}};
          for(const cfg of configs){
            const report=cfg.data?.daily?.report||null;
            const raw=rawItems(cfg.root);
            const rows=candidateRows(report).map(r=>({
              label:r.label,
              source_bucket:r.source_bucket,
              count:r.count??null,
              share:r.share??null,
              days_seen:r.days_seen??null,
              distinct_circles:r.distinct_circles??null,
              blocked_reason:r.blocked_reason??r.reason??null,
              evidence:evidenceFor(r.label,raw.items),
            }));
            result.markets[cfg.id]={label:cfg.label,date:report?.date||cfg.data?.daily?.date||null,raw_file:raw.file,candidate_count:rows.length,candidates:rows};
          }
          fs.mkdirSync('/tmp/audit-status',{recursive:true});
          fs.writeFileSync('/tmp/audit-status/unregistered-words-four-markets.json',JSON.stringify(result,null,2)+'\n');
          console.log(JSON.stringify(result,null,2));
          NODE

      - name: Persist audit result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" statusrepo
          cd statusrepo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p status
          cp /tmp/audit-status/unregistered-words-four-markets.json status/
          git add status/unregistered-words-four-markets.json
          git commit -m 'status: audit unregistered words across four markets'
          git push origin main
