name: Review evaluation provisional holdout validation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/review-evaluation-holdout-validation.yml'
      - '.review-evaluation-holdout-trigger'

permissions:
  contents: read

concurrency:
  group: review-evaluation-provisional-holdout
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUT_DIR: data/research/review-evaluation-holdout/otome-audio-rest75-provisional-v1
      PILOT_DIR: data/research/review-evaluation-pilot/otome-audio-otome-audio-review-evaluation-semantic-pilot-v1
      TAXONOMY_FILE: data/research/review-evaluation-spec/shared-mechanism-taxonomy-v1.json
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build broad holdout candidate packet
        working-directory: work
        run: node scripts/build-review-evaluation-holdout-candidate-packet.mjs

      - name: Validate holdout packet
        working-directory: work
        run: |
          set -euo pipefail
          for f in \
            holdout-candidate-packet.json \
            holdout-candidate-packet.md \
            holdout-decisions.template.json; do
            test -s "$OUT_DIR/$f" || { echo "missing $f" >&2; exit 1; }
          done
          node - "$OUT_DIR/holdout-candidate-packet.json" "$OUT_DIR/holdout-decisions.template.json" <<'NODE'
          const fs=require('fs');
          const packet=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const template=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          if(packet.holdout_review_count!==239) throw new Error(`expected 239 held-out reviews, got ${packet.holdout_review_count}`);
          if(!packet.rows?.length) throw new Error('no holdout candidates');
          if(template.decisions?.length!==packet.rows.length) throw new Error('decision template length mismatch');
          for(const key of ['atmosphere_immersion_mood','scenario_worldbuilding_quality','audio_mix_technical_quality']) {
            const s=packet.axis_summary?.[key];
            if(!s || s.candidate_rows<1 || s.unique_products<1) throw new Error(`missing holdout candidates for ${key}`);
          }
          console.log({heldout:packet.holdout_review_count,candidates:packet.rows.length,axes:packet.axis_summary});
          NODE

      - name: Validate reviewed holdout batches
        working-directory: work
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$OUT_DIR"/holdout-decisions.batch-*.json)
          if test ${#files[@]} -eq 0; then
            echo 'no reviewed holdout batches yet'
          else
            for f in "${files[@]}"; do
              echo "validating $f"
              REVIEW_HOLDOUT_OUT_DIR="$OUT_DIR" REVIEW_HOLDOUT_BATCH_JSON="$f" node scripts/validate-review-evaluation-holdout-decision-batch.mjs
            done
          fi

      - name: Merge reviewed holdout batches
        working-directory: work
        env:
          REVIEW_HOLDOUT_OUT_DIR: ${{ env.OUT_DIR }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$OUT_DIR"/holdout-decisions.batch-*.json)
          if test ${#files[@]} -gt 0; then
            node scripts/merge-review-evaluation-holdout-decision-batches.mjs
          else
            echo 'no reviewed holdout batches yet; skipping merge'
          fi

      - name: Build final mechanism promotion review packet
        working-directory: work
        env:
          REVIEW_HOLDOUT_OUT_DIR: ${{ env.OUT_DIR }}
          REVIEW_EVAL_PILOT_DIR: ${{ env.PILOT_DIR }}
        run: |
          set -euo pipefail
          if test -s "$OUT_DIR/holdout-validation-summary.json"; then
            node scripts/build-review-evaluation-final-promotion-review-packet.mjs
            for f in \
              final-mechanism-promotion-review-packet.json \
              final-mechanism-promotion-review-packet.md \
              final-mechanism-promotion-decisions.template.json; do
              test -s "$OUT_DIR/$f" || { echo "missing $f" >&2; exit 1; }
            done
          else
            echo 'holdout review incomplete; final promotion packet not built'
          fi

      - name: Validate final mechanism promotion decisions
        working-directory: work
        env:
          REVIEW_HOLDOUT_OUT_DIR: ${{ env.OUT_DIR }}
        run: |
          set -euo pipefail
          if test -s "$OUT_DIR/final-mechanism-promotion-decisions.json"; then
            node scripts/validate-review-evaluation-final-promotion-decisions.mjs
          else
            echo 'no final promotion decisions yet; skipping validation'
          fi

      - name: Apply validated mechanism promotions
        working-directory: work
        env:
          REVIEW_HOLDOUT_OUT_DIR: ${{ env.OUT_DIR }}
          REVIEW_EVAL_PILOT_DIR: ${{ env.PILOT_DIR }}
          REVIEW_MECHANISM_TAXONOMY_JSON: ${{ env.TAXONOMY_FILE }}
        run: |
          set -euo pipefail
          if test -s "$OUT_DIR/final-mechanism-promotion-decisions.json"; then
            node scripts/apply-review-evaluation-final-mechanism-promotions.mjs
            test -s "$TAXONOMY_FILE" || { echo 'canonical mechanism taxonomy missing' >&2; exit 1; }
            node - "$TAXONOMY_FILE" <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(d.status!=='human_validated_shared_taxonomy') throw new Error(`unexpected canonical status ${d.status}`);
          const count=d.mechanism_count??d.mechanisms?.length??0;
          if(count!==15||d.mechanisms?.length!==15) throw new Error(`expected canonical 15 mechanisms, got ${count}/${d.mechanisms?.length}`);
          for(const k of ['atmosphere_immersion_mood','scenario_worldbuilding_quality','audio_mix_technical_quality']) {
            const m=d.mechanisms.find(x=>x.key===k);
            if(!m||!String(m.provenance||'').includes('holdout')) throw new Error(`missing holdout-promoted canonical mechanism ${k}`);
          }
          console.log({taxonomy:d.taxonomy_id||d.taxonomy_version,mechanisms:count,status:d.status});
          NODE
          else
            echo 'no final promotion decisions; taxonomy not changed'
          fi

      - name: Verify shared mapping vocabulary integration
        working-directory: work
        env:
          REVIEW_EVAL_PILOT_DIR: ${{ env.PILOT_DIR }}
          REVIEW_MECHANISM_TAXONOMY_JSON: ${{ env.TAXONOMY_FILE }}
          REVIEW_MECHANISM_MAPPING_JSON: /tmp/mechanism-mapping-packet.json
          REVIEW_MECHANISM_MAPPING_MD: /tmp/mechanism-mapping-packet.md
        run: |
          set -euo pipefail
          node scripts/build-review-evaluation-mechanism-mapping-packet.mjs
          node - /tmp/mechanism-mapping-packet.json <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(d.mechanism_candidates?.length!==15) throw new Error(`mapping builder did not load 15 mechanisms: ${d.mechanism_candidates?.length}`);
          if(d.vocabulary_source!=='otome-audio-review-evaluation-mechanisms-v1') throw new Error(`unexpected vocabulary source: ${d.vocabulary_source}`);
          if(d.vocabulary_status!=='human_validated_shared_taxonomy') throw new Error(`unexpected vocabulary status: ${d.vocabulary_status}`);
          for(const k of ['atmosphere_immersion_mood','scenario_worldbuilding_quality','audio_mix_technical_quality']) {
            if(!d.mechanism_candidates.some(x=>x.key===k)) throw new Error(`mapping vocabulary missing ${k}`);
          }
          console.log({mapping_schema:d.schema_version,vocabulary:d.vocabulary_source,status:d.vocabulary_status,mechanisms:d.mechanism_candidates.length});
          NODE

      - name: Commit holdout packet and review state
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$OUT_DIR"
          if test -f "$TAXONOMY_FILE"; then git add "$TAXONOMY_FILE"; fi
          if git diff --cached --quiet; then
            echo 'no generated changes to commit'
            exit 0
          fi
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: provisional mechanism holdout validation"
          for attempt in 1 2 3 4 5 6; do
            echo "push attempt $attempt"
            git fetch origin main
            git rebase origin/main
            if git push origin main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'failed to push after retries' >&2
          exit 1
