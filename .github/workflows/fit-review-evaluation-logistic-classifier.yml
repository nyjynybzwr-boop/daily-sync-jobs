name: Fit review evaluation logistic classifier

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fit-review-evaluation-logistic-classifier.yml'
      - '.review-evaluation-logistic-classifier-fit-trigger'

permissions:
  contents: read

concurrency:
  group: review-evaluation-logistic-classifier-fit
  cancel-in-progress: false

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install free local classifier dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Download frozen training embeddings from R2
        working-directory: work
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc
          key=review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/training/training-embeddings.jsonl.gz
          npx --yes wrangler r2 object get "melosignal-data/${key}" --file .tmp/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/training-embeddings.jsonl.gz --remote
          gzip -dc .tmp/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/training-embeddings.jsonl.gz > .tmp/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/training-embeddings.jsonl

      - name: Verify embedding provenance
        working-directory: work
        run: |
          set -euo pipefail
          mf=data/research/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/training-embedding-manifest.json
          node - "$mf" .tmp/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/training-embeddings.jsonl.gz <<'NODE'
          const fs=require('fs'),crypto=require('crypto');const [mf,gz]=process.argv.slice(2);const m=JSON.parse(fs.readFileSync(mf,'utf8')),b=fs.readFileSync(gz);const sha=crypto.createHash('sha256').update(b).digest('hex');if(m.rows!==2931||m.vector_dimension!==384||m.r2?.compressed_sha256!==sha)throw new Error('embedding provenance mismatch');if(m.model?.paid_api!==false)throw new Error('paid embeddings forbidden');console.log({rows:m.rows,dimension:m.vector_dimension,sha});
          NODE

      - name: Fit logistic classifier and evaluate development split
        working-directory: work
        run: |
          set -euo pipefail
          python -m py_compile scripts/fit-review-evaluation-logistic-classifier.py
          python scripts/fit-review-evaluation-logistic-classifier.py

      - name: Verify shadow seal and zero-cost contract
        working-directory: work
        run: |
          set -euo pipefail
          r=data/research/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/logistic-internal-validation-report.json
          m=data/research/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/logistic-classifier-model.json
          node - "$r" "$m" <<'NODE'
          const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8')),m=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));if(r.shadow_v1_opened!==false||m.training?.shadow_used!==false)throw new Error('shadow seal violated');if(m.algorithm?.paid_api!==false)throw new Error('paid classifier forbidden');if(r.split?.development_validation!==421)throw new Error('development split drift');console.log({status:r.status,gates:r.gates,classification:r.validation.classification,target:r.validation.target_end_to_end,mechanism:r.validation.mechanism_end_to_end});
          NODE
          if grep -n -E 'shadow-calibration/.*/(human-gold|predictions)|shadow-predictions|human-gold' scripts/fit-review-evaluation-logistic-classifier.py; then echo 'logistic fit script references sealed shadow label assets' >&2; exit 1; fi

      - name: Commit compact logistic model and report
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          root=data/research/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$root/logistic-classifier-model.json" "$root/logistic-internal-validation-report.json"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: fit logistic classifier and compare development validation" || exit 0
          git pull --rebase origin main
          git push origin main
