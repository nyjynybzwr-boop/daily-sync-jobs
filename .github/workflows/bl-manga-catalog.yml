name: BL manga catalog background sync

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: 'Max listing pages to walk this run'
        default: '60'
      batch_size:
        description: 'Max product details to enrich this run'
        default: '1000'
  push:
    paths:
      - '.github/workflows/bl-manga-catalog.yml'
  schedule:
    - cron: '30 17 * * 0'

concurrency:
  group: bl-manga-catalog-background
  cancel-in-progress: false

permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: work
        run: |
          npm ci
          npm install --no-save devalue

      - name: Materialize existing BL manga details
        working-directory: work
        run: git lfs pull --include="data/manga/bl/catalog/full/details.json" || true

      - name: Crawl BL manga through Tokyo relay
        working-directory: work
        env:
          INPUT_MAX_PAGES: ${{ github.event.inputs.max_pages || '60' }}
          INPUT_BATCH_SIZE: ${{ github.event.inputs.batch_size || '1000' }}
          DLSITE_JP_RELAY_ORIGIN: ${{ vars.DLSITE_JP_RELAY_ORIGIN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == 'schedule' ]]; then
            export MAX_PAGES_PER_RUN='3'
            export CATALOG_RESCAN_FROM_START='1'
          else
            export MAX_PAGES_PER_RUN="$INPUT_MAX_PAGES"
            export CATALOG_RESCAN_FROM_START='0'
          fi
          export BATCH_SIZE="$INPUT_BATCH_SIZE"
          export DETAIL_DELAY_MS='800'
          source scripts/ci/dlsite-jp-relay-env.sh
          bash scripts/ci/run-manga-bl-catalog.sh

      - name: Record exact BL manga progress
        id: progress
        working-directory: work
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const checkpointPath = 'data/manga/bl/catalog/index/checkpoint.json';
          const idsPath = 'data/manga/bl/catalog/index/ids.json';
          const detailsPath = 'data/manga/bl/catalog/full/details.json';
          const outPath = 'data/manga/bl/catalog/index/progress.json';
          const checkpoint = JSON.parse(fs.readFileSync(checkpointPath, 'utf8'));
          const indexed = Object.keys(JSON.parse(fs.readFileSync(idsPath, 'utf8'))).length;
          const enriched = fs.existsSync(detailsPath)
            ? Object.keys(JSON.parse(fs.readFileSync(detailsPath, 'utf8'))).length
            : 0;
          const progress = {
            updated_at: new Date().toISOString(),
            indexed,
            enriched,
            pending: Math.max(0, indexed - enriched),
            detail_percent: indexed ? Number((enriched / indexed * 100).toFixed(2)) : 0,
            index_done: Boolean(checkpoint.done),
            stopped_reason: checkpoint.stopped_reason || null,
          };
          fs.writeFileSync(outPath, JSON.stringify(progress, null, 2) + '\n');
          console.log(JSON.stringify(progress));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `complete=${progress.index_done && progress.pending === 0 && !progress.stopped_reason}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `indexed=${indexed}\n`);
          NODE

      - name: Build BL manga web catalog
        if: steps.progress.outputs.complete == 'true'
        working-directory: work
        env:
          DATA_ROOT: data/manga/bl/catalog
          OUT_DIR: web/data/catalog/manga/bl
        run: |
          set -euo pipefail
          node scripts/build-catalog-web.mjs
          node scripts/build-similar-works.mjs
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const progress = JSON.parse(fs.readFileSync('data/manga/bl/catalog/index/progress.json', 'utf8'));
          const summary = JSON.parse(fs.readFileSync('web/data/catalog/manga/bl/summary.json', 'utf8'));
          const index = JSON.parse(fs.readFileSync('web/data/catalog/manga/bl/search-index.json', 'utf8'));
          if (summary.total_works !== progress.indexed || index.total_works !== progress.indexed) {
            throw new Error(`BL manga web catalog count mismatch: indexed=${progress.indexed}, summary=${summary.total_works}, search=${index.total_works}`);
          }
          console.log(`BL manga web catalog verified: ${progress.indexed} works`);
          NODE

      - name: Push BL manga progress and web catalog to private main
        working-directory: work
        run: |
          PATHS="data/manga/bl/catalog/index data/manga/bl/catalog/full/details.json"
          if [[ -d web/data/catalog/manga/bl ]]; then
            PATHS="$PATHS web/data/catalog/manga/bl"
          fi
          bash scripts/ci/push.sh "$PATHS"

      - name: Continue in background if work remains
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_MAX_PAGES: ${{ github.event.inputs.max_pages || '60' }}
          # Never propagate an old small batch through the auto-chain. The
          # background continuation is intentionally fixed at 1000 details/run.
          NEXT_BATCH_SIZE: '1000'
        run: |
          set -euo pipefail
          CHECKPOINT='data/manga/bl/catalog/index/checkpoint.json'
          IDS='data/manga/bl/catalog/index/ids.json'
          DETAILS='data/manga/bl/catalog/full/details.json'
          if [[ ! -f "$CHECKPOINT" || ! -f "$IDS" ]]; then
            echo 'No BL manga checkpoint yet; stopping instead of looping blindly.'
            exit 0
          fi
          DONE=$(node -e "const x=require('./$CHECKPOINT');process.stdout.write(String(Boolean(x.done)))")
          STOPPED=$(node -e "const x=require('./$CHECKPOINT');process.stdout.write(x.stopped_reason||'')")
          TOTAL=$(node -e "console.log(Object.keys(require('./$IDS')).length)")
          ENRICHED=$(node -e "const fs=require('fs');const p='$DETAILS';console.log(fs.existsSync(p)?Object.keys(JSON.parse(fs.readFileSync(p))).length:0)")
          echo "BL manga indexed=$TOTAL enriched=$ENRICHED done=$DONE stopped_reason=${STOPPED:-none}"
          if [[ -n "$STOPPED" ]]; then
            echo 'Safety stop recorded; not auto-looping.'
          elif [[ "$DONE" != 'true' || "$ENRICHED" -lt "$TOTAL" ]]; then
            gh workflow run bl-manga-catalog.yml --repo "$GITHUB_REPOSITORY" --ref main -f max_pages="$NEXT_MAX_PAGES" -f batch_size="$NEXT_BATCH_SIZE"
          else
            echo 'BL manga catalog crawl, detail enrichment, and web-data build complete.'
          fi
