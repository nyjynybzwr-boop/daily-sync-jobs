name: Scheduled sync

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which job to run'
        type: choice
        options:
          - a
          - b
          - c
          - d
          - e
          - f
        default: a
  schedule:
    - cron: '0 14 * * *'
    - cron: '30 14 * * *'

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Determine target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target }}"
          elif [ "${{ github.event.schedule }}" = "30 14 * * *" ]; then
            TARGET="b"
          else
            TARGET="a"
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Checkout source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          if ! git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work >/tmp/step.log 2>&1; then
            echo 'Source checkout failed.'
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        if: steps.target.outputs.target != 'd'
        working-directory: work
        run: npm ci >/tmp/step.log 2>&1 || (echo 'Dependency installation failed.'; exit 1)

      - name: Install browser
        if: steps.target.outputs.target == 'a' || steps.target.outputs.target == 'b' || steps.target.outputs.target == 'c'
        working-directory: work
        run: |
          npm install --no-save playwright devalue >/tmp/step.log 2>&1 || (echo 'Browser dependency installation failed.'; exit 1)
          npx playwright install --with-deps chromium >>/tmp/step.log 2>&1 || (echo 'Browser installation failed.'; exit 1)

      - name: Materialize catalog data
        if: steps.target.outputs.target == 'e' || steps.target.outputs.target == 'f'
        working-directory: work
        run: |
          if [ "${{ steps.target.outputs.target }}" = "e" ]; then
            INCLUDE="data/catalog/full/details.json,data/catalog/bl/full/details.json"
          else
            INCLUDE="data/catalog/full/details.json"
          fi
          git lfs pull --include="$INCLUDE" >/tmp/step.log 2>&1 || (echo 'Catalog materialization failed.'; exit 1)

      - name: Run job A
        if: steps.target.outputs.target == 'a'
        working-directory: work
        run: bash scripts/ci/run-a.sh >/tmp/step.log 2>&1 || (echo 'Job A failed.'; exit 1)

      - name: Run job B
        if: steps.target.outputs.target == 'b'
        working-directory: work
        run: bash scripts/ci/run-b.sh >/tmp/step.log 2>&1 || (echo 'Job B failed.'; exit 1)

      - name: Run job C
        if: steps.target.outputs.target == 'c'
        working-directory: work
        run: bash scripts/ci/run-c.sh >/tmp/step.log 2>&1 || (echo 'Job C failed.'; exit 1)

      - name: Run job D
        if: steps.target.outputs.target == 'd'
        working-directory: work
        run: node scripts/postprocess-catalog-sensitive-labels.mjs >/tmp/step.log 2>&1 || (echo 'Job D failed.'; exit 1)

      - name: Run job E
        if: steps.target.outputs.target == 'e'
        working-directory: work
        run: |
          node scripts/audit-lover-label.mjs >/tmp/step.log 2>&1 || (echo 'Lover audit failed.'; exit 1)
          node scripts/build-bl-role-summary.mjs >>/tmp/step.log 2>&1 || (echo 'BL role build failed.'; exit 1)

      - name: Run job F
        if: steps.target.outputs.target == 'f'
        working-directory: work
        run: bash scripts/ci/run-f.sh >/tmp/step.log 2>&1 || (echo 'Job F failed.'; exit 1)

      - name: Push results (A)
        if: steps.target.outputs.target == 'a'
        working-directory: work
        run: bash scripts/ci/push.sh "data/raw data/labeled data/reports data/windows" >/tmp/step.log 2>&1 || (echo 'Push A failed.'; exit 1)

      - name: Push results (B)
        if: steps.target.outputs.target == 'b'
        working-directory: work
        run: bash scripts/ci/push.sh "data/bl/raw data/bl/labeled data/bl/reports data/bl/windows" >/tmp/step.log 2>&1 || (echo 'Push B failed.'; exit 1)

      - name: Push results (C)
        if: steps.target.outputs.target == 'c'
        working-directory: work
        run: bash scripts/ci/push.sh "data/bl/yearly" >/tmp/step.log 2>&1 || (echo 'Push C failed.'; exit 1)

      - name: Push results (D)
        if: steps.target.outputs.target == 'd'
        working-directory: work
        run: bash scripts/ci/push.sh "web/data/catalog/summary.json web/data/catalog/search-index.json" >/tmp/step.log 2>&1 || (echo 'Push D failed.'; exit 1)

      - name: Push results (E)
        if: steps.target.outputs.target == 'e'
        working-directory: work
        run: bash scripts/ci/push.sh "analysis/lover-label-audit.json web/data/catalog/bl/summary.json" >/tmp/step.log 2>&1 || (echo 'Push E failed.'; exit 1)

      - name: Push results (F)
        if: steps.target.outputs.target == 'f'
        working-directory: work
        run: bash scripts/ci/push.sh "web/data/catalog/summary.json web/data/catalog/search-index.json" >/tmp/step.log 2>&1 || (echo 'Push F failed.'; exit 1)
