name: Merge and aggregate review evaluation full corpus target-first v2

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - 'Infer review evaluation full corpus target-first v2 shards'
    types:
      - completed
  push:
    paths:
      - '.review-evaluation-full-corpus-v1-merge-trigger'

permissions:
  contents: read

concurrency:
  group: review-evaluation-full-corpus-v2-merge
  cancel-in-progress: false

jobs:
  merge-and-aggregate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: rev-eval-46255c55e8d1c5dc
      REVIEW_EVAL_SHARD_COUNT: '32'
      R2_BUCKET_NAME: melosignal-data
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: work/package-lock.json

      - name: Install Node dependencies
        working-directory: work
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify fresh Shadow-v2 production authorization
        working-directory: work
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),V='rev-eval-46255c55e8d1c5dc';
          const expected=['acting_performance','breath_vocalization','dialogue_writing','voice_quality'];
          const f=JSON.parse(fs.readFileSync(`data/research/review-evaluation-classifier/${V}/production-freeze-v2.json`,'utf8'));
          const a=JSON.parse(fs.readFileSync(`data/research/review-evaluation-classifier/${V}/production-authorization-v2.json`,'utf8'));
          if(f.status!=='review_evaluation_production_v2_frozen_before_new_disjoint_holdout'||f.production_scope!=='target_first_conservative'||f.mechanisms?.standalone_output!==false||(f.pairs?.selected_pair_keys||[]).length) throw new Error('target-first production-v2 freeze drift');
          if(JSON.stringify(f.targets?.selected_target_keys)!==JSON.stringify(expected)) throw new Error('target allowlist drift');
          if(a.status!=='review_evaluation_production_v2_authorized_after_fresh_disjoint_shadow_v2'||a.fresh_shadow_v2_passed!==true||a.strict_blind_claim!==true||a.no_post_holdout_tuning!==true||a.mechanism_output_enabled!==false||a.freeze_payload_sha256!==f.freeze_payload_sha256) throw new Error('production-v2 authorization/freeze mismatch');
          console.log({freeze:f.freeze_payload_sha256,authorization:a.status,targets:expected});
          NODE

      - name: Download all 32 production-v2 prediction shards and canonical inventory
        working-directory: work
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          shdir=.tmp/review-evaluation-full-corpus/${VERSION}/shards
          inv=.tmp/review-evaluation-inventory/${VERSION}
          mkdir -p "$shdir" "$inv"
          base=review-evaluation-full-corpus/${VERSION}/production-v2/shards
          for i in $(seq 0 31); do
            tag=$(printf '%02d' "$i")
            npx --yes wrangler@latest r2 object get "${R2_BUCKET_NAME}/${base}/shard-${tag}-predictions.jsonl.gz" --file "$shdir/shard-${tag}-predictions.jsonl.gz" --remote >/dev/null
            npx --yes wrangler@latest r2 object get "${R2_BUCKET_NAME}/${base}/shard-${tag}-prediction-manifest.json" --file "$shdir/shard-${tag}-prediction-manifest.json" --remote >/dev/null
          done
          npx --yes wrangler@latest r2 object get "${R2_BUCKET_NAME}/review-evaluation-full-corpus/${VERSION}/inventory/unique-evidence.jsonl.gz" --file "$inv/unique-evidence.jsonl.gz" --remote >/dev/null
          npx --yes wrangler@latest r2 object get "${R2_BUCKET_NAME}/review-evaluation-full-corpus/${VERSION}/inventory/evidence-occurrences.jsonl.gz" --file "$inv/evidence-occurrences.jsonl.gz" --remote >/dev/null

      - name: Verify inventory provenance
        working-directory: work
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),V='rev-eval-46255c55e8d1c5dc';
          const m=JSON.parse(fs.readFileSync(`data/research/review-evaluation-full-corpus/${V}/inventory/inventory-manifest.json`,'utf8'));
          const sha=p=>crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          if(sha(`.tmp/review-evaluation-inventory/${V}/unique-evidence.jsonl.gz`)!==m.artifacts.unique_evidence.sha256) throw new Error('unique evidence SHA drift');
          if(sha(`.tmp/review-evaluation-inventory/${V}/evidence-occurrences.jsonl.gz`)!==m.artifacts.evidence_occurrences.sha256) throw new Error('occurrence SHA drift');
          NODE

      - name: Merge and validate unique predictions
        working-directory: work
        run: |
          set -euo pipefail
          node --check scripts/merge-review-evaluation-full-corpus-shards-v1.mjs
          node scripts/merge-review-evaluation-full-corpus-shards-v1.mjs

      - name: Expand occurrence map and aggregate by work
        working-directory: work
        run: |
          set -euo pipefail
          node --check scripts/aggregate-review-evaluation-full-corpus-v1.mjs
          node scripts/aggregate-review-evaluation-full-corpus-v1.mjs

      - name: Upload merged production-v2 predictions and work aggregates to R2
        working-directory: work
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          dir=.tmp/review-evaluation-full-corpus/${VERSION}
          key=review-evaluation-full-corpus/${VERSION}/production-v2
          npx --yes wrangler@latest r2 object put "${R2_BUCKET_NAME}/${key}/unique-predictions-v2.jsonl.gz" --file "$dir/unique-predictions.jsonl.gz" --remote >/dev/null
          npx --yes wrangler@latest r2 object put "${R2_BUCKET_NAME}/${key}/work-aggregates-v2.jsonl.gz" --file "$dir/work-aggregates-v1.jsonl.gz" --remote >/dev/null

      - name: Commit compact production manifests to private source
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          prod=data/research/review-evaluation-full-corpus/${VERSION}/production
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$prod/prediction-merge-manifest-v1.json" "$prod/work-aggregate-manifest-v1.json"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: merge and aggregate full-corpus production v2" || exit 0
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin main
