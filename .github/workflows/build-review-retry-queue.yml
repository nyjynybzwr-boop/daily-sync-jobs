name: Build review retry queue

on:
  workflow_dispatch:
    inputs:
      segment:
        description: 'Review segment'
        required: true
        type: choice
        options:
          - otome-audio
          - bl-audio
          - otome-manga
          - bl-manga
          - male-audio
          - male-manga
          - girls-drama
        default: otome-audio
  push:
    paths:
      - '.github/workflows/build-review-retry-queue.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_BUCKET_NAME: melosignal-data
      REVIEW_SEGMENT: ${{ inputs.segment || 'otome-audio' }}
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download stored review chunks
        working-directory: work
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          dir=".tmp/reviews-analysis/${REVIEW_SEGMENT}"
          mkdir -p "$dir"
          node - <<'NODE' > .tmp/review-chunk-keys.txt
          const fs=require('fs');
          const segment=process.env.REVIEW_SEGMENT;
          const m=JSON.parse(fs.readFileSync(`data/reviews/manifests/${segment}.json`,'utf8'));
          const chunks=(m.chunks||[]).filter(c=>c.complete&&!c.stopped_reason).sort((a,b)=>Number(a.index)-Number(b.index));
          if(!chunks.length)throw new Error(`${segment}: no complete chunks`);
          for(const c of chunks)console.log(c.key);
          NODE
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            out="$dir/$(basename "$key")"
            npx --yes wrangler@latest r2 object get "${R2_BUCKET_NAME}/${key}" --file "$out" --remote >/dev/null
          done < .tmp/review-chunk-keys.txt

      - name: Build compact retry queue
        working-directory: work
        env:
          REVIEW_CHUNK_DIR: .tmp/reviews-analysis/${{ inputs.segment || 'otome-audio' }}
          REVIEW_RETRY_QUEUE: data/reviews/retry/${{ inputs.segment || 'otome-audio' }}.json
        run: node scripts/build-review-retry-queue.mjs

      - name: Verify queue contains no review text
        working-directory: work
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const segment=process.env.REVIEW_SEGMENT;
          const q=JSON.parse(fs.readFileSync(`data/reviews/retry/${segment}.json`,'utf8'));
          const forbidden=new Set(['review_text','member_review_id','reviews','text']);
          function scan(v,p='root'){
            if(Array.isArray(v)){v.forEach((x,i)=>scan(x,`${p}[${i}]`));return;}
            if(!v||typeof v!=='object')return;
            for(const [k,x] of Object.entries(v)){
              if(forbidden.has(k))throw new Error(`raw review field leaked: ${p}.${k}`);
              scan(x,`${p}.${k}`);
            }
          }
          scan(q);
          console.log({segment,retry_targets:q.retry_target_count,errors:q.review_error_occurrences,shortfalls:q.shortfall_occurrences,coverage:q.coverage});
          NODE

      - name: Commit retry queue to private source
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          file="data/reviews/retry/${REVIEW_SEGMENT}.json"
          git add "$file"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: ${REVIEW_SEGMENT} retry queue" || exit 0
          git pull --rebase origin main
          git push origin main
