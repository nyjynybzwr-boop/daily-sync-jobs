name: Male manga ranking sync

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/male-manga-ranking-sync.yml'
      - '.github/triggers/male-manga-ranking-now'
  schedule:
    - cron: '5 17 * * *'

concurrency:
  group: male-manga-ranking-sync
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: work
        run: |
          npm ci >/tmp/step.log 2>&1
          npm install --no-save devalue >>/tmp/step.log 2>&1

      - name: Collect and analyze male manga rankings
        working-directory: work
        run: |
          set -euo pipefail
          bash scripts/ci/run-l.sh

      - name: Push male manga ranking data
        working-directory: work
        run: bash scripts/ci/push.sh "data/manga/male/raw data/manga/male/labeled data/manga/male/reports data/manga/male/windows"
