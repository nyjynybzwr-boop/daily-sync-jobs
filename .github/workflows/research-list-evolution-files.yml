name: Research list evolution filenames

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-list-evolution-files.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List private research filenames via API only
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          curl -fsSL \
            -H "Authorization: Bearer ${SYNC_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${SOURCE_REPO}/contents/data/research/otome-audio-ranking-evolution-2023-2026" \
            | jq -r '.[] | select(.type=="file") | .name' \
            | sort
