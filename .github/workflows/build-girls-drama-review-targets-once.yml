name: Build girls-drama review targets once

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-girls-drama-review-targets-once.yml'

concurrency:
  group: build-girls-drama-review-targets
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enumerate commercial drama result grid safely
        working-directory: work
        run: |
          set -euo pipefail
          mkdir -p data/reviews/targets
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const headers={
            'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1',
            'Accept-Language':'ja-JP,ja;q=0.9',
            Accept:'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
          };
          const base='https://www.dlsite.com/girls-drama-touch/fsr/=/language/jp/sex_category%5B0%5D/female/work_category%5B0%5D/drama/order%5B0%5D/release_d/options_and_or/and/options%5B0%5D/JPN/per_page/30';
          const ids=[]; const seen=new Set(); let sourceTotal=null; const pages=[];

          function extractMainListingHtml(html){
            const openPattern=/<ul\b[^>]*class=(['"])([^'"]*)\1[^>]*>/gi;
            let open;
            while((open=openPattern.exec(html))){
              const classes=new Set(open[2].split(/\s+/).filter(Boolean));
              const isMain=classes.has('n_work_list')&&classes.has('type_grid')&&classes.has('type_horizontal')&&!classes.has('type_grid_min');
              if(!isMain)continue;
              const start=open.index;
              let depth=1;
              const ulPattern=/<\/?ul\b[^>]*>/gi;
              ulPattern.lastIndex=openPattern.lastIndex;
              let tag;
              while((tag=ulPattern.exec(html))){
                if(/^<\/ul\b/i.test(tag[0]))depth-=1; else depth+=1;
                if(depth===0)return html.slice(start,ulPattern.lastIndex);
              }
              return null;
            }
            return null;
          }

          function extractTotal(html){
            const text=String(html||'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/gi,' ').replace(/\s+/g,' ');
            const m=text.match(/([\d,]+)\s*件中\s*[\d,]+\s*[-−ー~〜]\s*[\d,]+\s*件目/)||text.match(/全\s*([\d,]+)\s*件/);
            return m?Number(m[1].replace(/,/g,'')):null;
          }

          function extractItems(listingHtml){
            const items=new Map();
            const linkPattern=/<a\b[^>]*href="([^"]*product_id\/((?:BJ|RJ|VJ|AJ)\d+)[^"]*)"[^>]*>([\s\S]{0,400}?)<\/a>/gi;
            let m;
            while((m=linkPattern.exec(listingHtml))){
              const id=m[2].toUpperCase();
              const title=m[3].replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
              if(!items.has(id)||title.length>items.get(id).title.length)items.set(id,{product_id:id,title});
            }
            return [...items.values()];
          }

          async function fetchPage(page){
            const url=`${base}/page/${page}/is_tl/1`;
            let lastError=null;
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const res=await fetch(url,{headers,redirect:'follow',signal:AbortSignal.timeout(30000)});
                const html=await res.text();
                if(res.status===403||res.status===429)throw new Error(`STOP_HTTP_${res.status} page=${page}`);
                if(res.status===404)return {status:404,html};
                if(!res.ok)throw new Error(`HTTP_${res.status} page=${page}`);
                if(/captcha|アクセスが集中|しばらく時間をおいて|アクセスを制限/i.test(html))throw new Error(`STOP_BLOCK_PAGE page=${page}`);
                return {status:res.status,html};
              }catch(error){
                const message=String(error?.message||error);
                if(message.startsWith('STOP_'))throw error;
                lastError=error;
                if(attempt<3)await sleep(attempt*5000);
              }
            }
            throw lastError;
          }

          for(let page=1;page<=100;page++){
            const {status,html}=await fetchPage(page);
            if(status===404){
              if(sourceTotal!==null&&ids.length===sourceTotal)break;
              throw new Error(`Unexpected 404 page=${page} unique=${ids.length} sourceTotal=${sourceTotal}`);
            }
            const observedTotal=extractTotal(html);
            if(observedTotal!==null){
              if(sourceTotal!==null&&sourceTotal!==observedTotal)console.warn(`source total changed ${sourceTotal} -> ${observedTotal}`);
              sourceTotal=observedTotal;
            }
            const listing=extractMainListingHtml(html);
            if(!listing)throw new Error(`Main result grid missing on page ${page}`);
            const items=extractItems(listing);
            if(items.length<1||items.length>30)throw new Error(`Unexpected main-grid item count ${items.length} page=${page}`);
            let added=0;
            for(const item of items){
              if(seen.has(item.product_id))continue;
              seen.add(item.product_id);
              ids.push(item);
              added+=1;
            }
            pages.push({page,count:items.length,new_count:added,unique:ids.length});
            console.log(`girls-drama page ${page}: grid=${items.length} new=${added} unique=${ids.length} sourceTotal=${sourceTotal}`);
            if(sourceTotal!==null){
              if(ids.length>sourceTotal)throw new Error(`Unique ids ${ids.length} exceeded source total ${sourceTotal}`);
              if(ids.length===sourceTotal)break;
            }
            await sleep(1000);
          }
          if(sourceTotal==null)throw new Error('Could not parse girls-drama total count');
          if(ids.length!==sourceTotal)throw new Error(`Unique result-grid ids ${ids.length} != source total ${sourceTotal}`);
          const targets=ids.map(item=>({product_id:item.product_id,expected_review_count:null,title:item.title||'',circle:'',market:'drama',media:'audio',api_base:'girls-drama'}));
          const file='data/reviews/targets/girls-drama.json';
          let generatedAt=new Date().toISOString();
          try{
            const old=JSON.parse(await fs.readFile(file,'utf8'));
            const signature=list=>list.map(x=>`${x.product_id}\u0000${x.expected_review_count??''}\u0000${x.api_base}`).join('\n');
            if(Number(old?.schema_version||0)>=2&&old?.generated_at&&Array.isArray(old?.targets)&&signature(old.targets)===signature(targets))generatedAt=old.generated_at;
          }catch{}
          const out={schema_version:2,generated_at:generatedAt,segment:'girls-drama',market:'drama',media:'audio',api_base:'girls-drama',source_work_count:ids.length,target_work_count:ids.length,known_zero_skipped_count:0,unknown_review_count_target_count:ids.length,expected_review_count_sum_known:0,review_count_known:false,pagination:pages,targets};
          await fs.writeFile(file,JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({sourceTotal,uniqueIds:ids.length,lastPage:pages.at(-1),generatedAt},null,2));
          NODE

      - name: Commit target manifest to private source
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/reviews/targets/girls-drama.json
          git commit -m '[CF-Pages-Skip] [skip actions] reviews: add girls-drama result-grid targets' || exit 0
          git pull --rebase origin main
          git push origin main
