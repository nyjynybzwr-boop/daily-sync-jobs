name: Compare product promise vs review play

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/compare-product-promise-review-play.yml'
      - '.review-promise-gap-trigger'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PILOT_DIR: data/research/review-evaluation-pilot/otome-audio-yearly-top30-2025
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare product promise with evaluated play targets
        working-directory: work
        env:
          REVIEW_EVAL_YEAR: '2025'
          REVIEW_EVAL_PILOT_DIR: ${{ env.PILOT_DIR }}
        run: node scripts/compare-product-promise-vs-review-play.mjs
      - name: Validate and commit
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          json="$PILOT_DIR/product-promise-vs-review-play.json"
          md="$PILOT_DIR/product-promise-vs-review-play.md"
          test -s "$json"; test -s "$md"
          node - "$json" <<'NODE'
          const fs=require('fs');const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!d.works?.length)throw new Error('no works compared');console.log(d.summary);
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$json" "$md"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: product promise vs evaluated play pilot" || exit 0
          git pull --rebase origin main
          git push origin main
