name: Deep dive Ainou Yu reviews once

on:
  push:
    paths:
      - '.github/triggers/deep-dive-ainou-yu-once'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deep-dive-ainou-yu-once
  cancel-in-progress: false

jobs:
  fetch-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch all official DLsite reviews for RJ01306051
        working-directory: work
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const PRODUCT_ID='RJ01306051';
          const targetDoc=JSON.parse(fs.readFileSync('data/reviews/targets/otome-audio.json','utf8'));
          const target=(targetDoc.targets||[]).find(x=>String(x.product_id||'').toUpperCase()===PRODUCT_ID);
          if(!target) throw new Error(`target not found: ${PRODUCT_ID}`);
          const apiBase=String(target.api_base||'girls');
          const limit=20;
          const headers={
            'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1',
            'Accept-Language':'ja-JP,ja;q=0.9',
            'Accept':'application/json,text/plain,*/*',
            'Referer':`https://www.dlsite.com/${apiBase}/work/=/product_id/${PRODUCT_ID}.html`,
          };
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const clean=v=>String(v??'').replace(/\s+/g,' ').trim();
          const sanitize=v=>String(v??'')
            .replace(/https?:\/\/\S+/gi,'[URL]')
            .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi,'[EMAIL]')
            .replace(/@[A-Za-z0-9_]{2,30}/g,'[HANDLE]')
            .replace(/\r\n?/g,'\n').trim();
          const reviews=[];
          const seen=new Set();
          let page=1;
          while(true){
            const url=`https://www.dlsite.com/${apiBase}/api/review?product_id=${encodeURIComponent(PRODUCT_ID)}&limit=${limit}&mix_pickup=false&page=${page}&order=regist_d&locale=ja_JP`;
            let json=null;
            for(let attempt=1;attempt<=3;attempt++){
              const res=await fetch(url,{headers,redirect:'follow',signal:AbortSignal.timeout(30000)});
              const body=await res.text();
              if(res.status===403||res.status===429) throw new Error(`DLsite blocked request HTTP ${res.status} page=${page}`);
              if(res.ok){
                json=JSON.parse(body);
                break;
              }
              if(attempt===3) throw new Error(`DLsite HTTP ${res.status} page=${page}`);
              await sleep(attempt*3000);
            }
            if(json?.is_success!==true) throw new Error(`DLsite API failure page=${page}`);
            const list=Array.isArray(json.review_list)?json.review_list:[];
            let added=0;
            for(const raw of list){
              const title=sanitize(raw.review_title||'');
              const text=sanitize(raw.review_text||'');
              if(!text) continue;
              const date=clean(raw.regist_date||raw.entry_date||'');
              const basis=`${PRODUCT_ID}\n${title}\n${text}\n${date}`;
              const ref=`rvw_${crypto.createHash('sha1').update(basis).digest('hex').slice(0,12)}`;
              if(seen.has(ref)) continue;
              seen.add(ref);
              reviews.push({
                review_ref:ref,
                title,
                text,
                date,
                rate_num:Number(raw.rate_num)||null,
                is_purchased:['1','true'].includes(String(raw.is_purchased??'').toLowerCase())||raw.is_purchased===true,
                good_review:Number(raw.good_review)||0,
                bad_review:Number(raw.bad_review)||0,
                recommend:clean(raw.recommend||''),
                spoiler:clean(raw.spoiler||''),
              });
              added++;
            }
            if(list.length<limit) break;
            if(added===0) throw new Error(`pagination repeated without new reviews page=${page}`);
            page++;
            if(page>100) throw new Error('pagination safety cap exceeded');
            await sleep(1200);
          }

          const ratings={};
          for(const r of reviews){ if(r.rate_num!=null) ratings[r.rate_num]=(ratings[r.rate_num]||0)+1; }
          const outDir='data/research/review-reading-packets/deep-dive-ainou-yu-direct';
          fs.mkdirSync(outDir,{recursive:true});
          const doc={
            schema_version:1,
            status:'official_dlsite_review_api_direct_reading_packet',
            product_id:PRODUCT_ID,
            title:target.title||'',
            circle:target.circle||'',
            api_base:apiBase,
            official_work_url:`https://www.dlsite.com/${apiBase}/work/=/product_id/${PRODUCT_ID}.html`,
            fetched_at:new Date().toISOString(),
            expected_review_count:target.expected_review_count==null?null:Number(target.expected_review_count),
            fetched_review_count:reviews.length,
            rating_distribution:ratings,
            source:'DLsite official review API',
            reviewer_identifiers_included:false,
            reviews,
          };
          fs.writeFileSync(`${outDir}/reviews.json`,JSON.stringify(doc,null,2)+'\n');
          let md=`# ${doc.title || PRODUCT_ID}\n\n`;
          md+=`- Product: ${PRODUCT_ID}\n- Circle: ${doc.circle}\n- Reviews fetched: ${reviews.length}\n- Expected at frozen target: ${doc.expected_review_count ?? 'unknown'}\n- Source: DLsite official review API\n\n`;
          reviews.forEach((r,i)=>{
            md+=`## Review ${i+1} (${r.review_ref})\n\n`;
            md+=`- Date: ${r.date || 'unknown'}\n- Rating: ${r.rate_num ?? 'unknown'}\n- Helpful: ${r.good_review}\n- Purchased: ${r.is_purchased}\n\n`;
            if(r.title) md+=`**${r.title}**\n\n`;
            md+=r.text.split('\n').map(line=>`> ${line}`).join('\n')+'\n\n';
          });
          fs.writeFileSync(`${outDir}/reviews.md`,md);
          console.log(JSON.stringify({product_id:PRODUCT_ID,title:doc.title,circle:doc.circle,reviews:reviews.length,expected:doc.expected_review_count,ratings},null,2));
          NODE

      - name: Commit private reading packet
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/review-reading-packets/deep-dive-ainou-yu-direct/reviews.json data/research/review-reading-packets/deep-dive-ainou-yu-direct/reviews.md
          if git diff --cached --quiet; then
            echo 'No reading packet changes.'
            exit 0
          fi
          git commit -m '[CF-Pages-Skip] [skip actions] research: capture Ainou Yu official reviews'
          git pull --rebase origin main
          git push origin HEAD:main
