name: Debug site build once

on:
  push:
    paths:
      - '.github/workflows/debug-site-build-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: work
        run: npm ci

      - name: Run Vercel build command
        working-directory: work
        run: |
          node scripts/check-web-syntax.mjs
          node scripts/build-dashboard-semantic-v53.mjs
          node scripts/attach-manga-dashboard.mjs
          node scripts/apply-melosignal-brand.mjs
          node scripts/inject-page-jump.mjs
          node scripts/inject-manga-media-switch.mjs
          node scripts/check-web-syntax.mjs --site
