name: Fit review evaluation char ngram v2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fit-review-evaluation-char-ngram-v2.yml'
      - '.review-evaluation-char-ngram-v2-trigger'

permissions:
  contents: read

concurrency:
  group: review-evaluation-char-ngram-v2
  cancel-in-progress: false

jobs:
  fit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install classifier dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Fit supervised character ngram classifier
        working-directory: work
        run: |
          set -euo pipefail
          python -m py_compile scripts/fit-review-evaluation-char-ngram-classifier-v2.py
          python scripts/fit-review-evaluation-char-ngram-classifier-v2.py

      - name: Verify zero-cost and sealed-shadow contract
        working-directory: work
        run: |
          set -euo pipefail
          b=data/research/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc
          node - "$b/char-ngram-classifier-model-v2.json" "$b/char-ngram-development-report-v2.json" <<'NODE'
          const fs=require('fs');const [mf,rf]=process.argv.slice(2);const m=JSON.parse(fs.readFileSync(mf)),r=JSON.parse(fs.readFileSync(rf));if(m.paid_api!==false||m.shadow_used!==false||r.shadow_v1_opened!==false)throw new Error('zero-cost/shadow seal violation');if(m.model_input_fields?.join(',')!=='evidence_text')throw new Error('model input drift');console.log({status:r.status,gates:r.gates,classification:r.validation.classification,target:r.validation.target_end_to_end,mechanism:r.validation.mechanism_end_to_end});
          NODE
          if grep -n -E 'shadow-calibration/.*/(human-gold|predictions)|shadow-predictions|human-gold' scripts/fit-review-evaluation-char-ngram-classifier-v2.py; then echo 'char classifier references sealed shadow labels' >&2; exit 1; fi

      - name: Commit char ngram development result
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          b=data/research/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$b/char-ngram-classifier-model-v2.json" "$b/char-ngram-development-report-v2.json"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: fit char ngram classifier v2" || exit 0
          git pull --rebase origin main
          git push origin main
