name: Freeze review evaluation production v1 before Shadow

on:
  workflow_dispatch:
  push:
    paths:
      - '.review-evaluation-production-v1-freeze-trigger'

permissions:
  contents: read

concurrency:
  group: review-evaluation-production-v1-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: rev-eval-46255c55e8d1c5dc
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Verify complete freeze prerequisites
        working-directory: work
        run: |
          set -euo pipefail
          node --check scripts/freeze-review-evaluation-production-v1.mjs
          node - <<'NODE'
          const fs=require('fs'),V='rev-eval-46255c55e8d1c5dc';
          const pair=JSON.parse(fs.readFileSync(`data/research/review-evaluation-classifier/${V}/direct-pair-development-report-v9.json`,'utf8'));
          const target=JSON.parse(fs.readFileSync(`data/research/review-evaluation-classifier/${V}/rbf-svm-development-report-v2.json`,'utf8'));
          if(pair.status!=='direct_pair_v9_pass_candidate_for_freeze'||pair.all_gates_passed!==true||!pair.freeze_candidate) throw new Error(`pair v9 not freezeable: ${pair.status}`);
          if(pair.shadow_v1_opened!==false||target.shadow_v1_opened!==false) throw new Error('Shadow seal violated before freeze');
          if(target.gates?.target_precision!==true||target.gates?.target_predictions!==true) throw new Error('target candidate gate drift');
          console.log({pair_status:pair.status,pair_selected:pair.freeze_candidate.selected_pair_keys,target_precision:target.development?.target_end_to_end?.micro_precision,target_predictions:target.development?.target_end_to_end?.predicted_assignments});
          NODE
          if grep -n -E 'shadow-calibration/.*/(human-gold|predictions)|shadow-predictions|human-gold' scripts/freeze-review-evaluation-production-v1.mjs; then
            echo 'production freeze generator references sealed Shadow label assets' >&2; exit 1
          fi

      - name: Generate complete production freeze
        working-directory: work
        run: node scripts/freeze-review-evaluation-production-v1.mjs

      - name: Verify freeze manifest
        working-directory: work
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs'),V='rev-eval-46255c55e8d1c5dc';
          const p=`data/research/review-evaluation-classifier/${V}/production-freeze-v1.json`;
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(x.status!=='review_evaluation_production_v1_frozen_before_shadow'||x.shadow_v1_opened!==false||x.immutable_after_shadow_open!==true||x.paid_api!==false) throw new Error('production freeze contract drift');
          if(!Object.keys(x.targets?.models||{}).length||!x.pairs?.selected_pair_keys?.length||!x.freeze_payload_sha256) throw new Error('production freeze incomplete');
          if(x.mechanisms?.standalone_output!==false) throw new Error('failed standalone mechanism path accidentally enabled');
          console.log({status:x.status,target_models:Object.keys(x.targets.models).length,active_targets:Object.values(x.targets.models).filter(v=>v.active_for_output).length,pairs:x.pairs.selected_pair_keys,freeze_payload_sha256:x.freeze_payload_sha256});
          NODE

      - name: Commit complete freeze to private source
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          out=data/research/review-evaluation-classifier/${VERSION}/production-freeze-v1.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$out"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: freeze production v1 before Shadow" || exit 0
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin main
