name: Freeze review evaluation direct pair v9 before Shadow

on:
  workflow_dispatch:
  push:
    paths:
      - '.review-evaluation-direct-pair-v9-freeze-trigger'

permissions:
  contents: read

concurrency:
  group: review-evaluation-direct-pair-v9-freeze
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: rev-eval-46255c55e8d1c5dc
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Verify freeze prerequisites
        working-directory: work
        run: |
          set -euo pipefail
          node --check scripts/freeze-review-evaluation-direct-pair-v9.mjs
          node - <<'NODE'
          const fs=require('fs');
          const V='rev-eval-46255c55e8d1c5dc';
          const p=`data/research/review-evaluation-classifier/${V}/direct-pair-development-report-v9.json`;
          if(!fs.existsSync(p)) throw new Error('v9 report missing');
          const r=JSON.parse(fs.readFileSync(p,'utf8'));
          if(r.status!=='direct_pair_v9_pass_candidate_for_freeze'||r.all_gates_passed!==true||!r.freeze_candidate) throw new Error(`v9 not freezeable: ${r.status}`);
          if(r.shadow_v1_opened!==false||r.paid_api!==false) throw new Error('v9 contract violation');
          console.log({status:r.status,selected:r.freeze_candidate.selected_pair_keys,aggregate:r.development?.selected_aggregate});
          NODE
          if grep -n -E 'shadow-calibration/.*/(human-gold|predictions)|shadow-predictions|human-gold' scripts/freeze-review-evaluation-direct-pair-v9.mjs; then
            echo 'freeze generator references sealed Shadow label assets' >&2; exit 1
          fi

      - name: Generate immutable pre-Shadow freeze manifest
        working-directory: work
        run: node scripts/freeze-review-evaluation-direct-pair-v9.mjs

      - name: Verify freeze manifest
        working-directory: work
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const V='rev-eval-46255c55e8d1c5dc';
          const p=`data/research/review-evaluation-classifier/${V}/production-freeze-direct-pair-v9.json`;
          const x=JSON.parse(fs.readFileSync(p,'utf8'));
          if(x.status!=='review_evaluation_direct_pair_v9_frozen_before_shadow'||x.shadow_v1_opened!==false||x.immutable_after_shadow_open!==true) throw new Error('freeze manifest contract drift');
          if(!Array.isArray(x.model?.selected_pair_keys)||!x.model.selected_pair_keys.length||!x.freeze_payload_sha256) throw new Error('freeze manifest incomplete');
          console.log({status:x.status,selected:x.model.selected_pair_keys,freeze_payload_sha256:x.freeze_payload_sha256});
          NODE

      - name: Commit freeze manifest to private source
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          out=data/research/review-evaluation-classifier/${VERSION}/production-freeze-direct-pair-v9.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$out"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: freeze direct-pair v9 before Shadow" || exit 0
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin main
