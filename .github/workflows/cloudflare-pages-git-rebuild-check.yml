name: Watch clean Git-integrated Pages rebuild

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloudflare-pages-git-rebuild-check.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD: https://dlsite-trend-radar.pages.dev
    steps:
      - uses: actions/checkout@v4

      - name: Poll production for hidden gems
        shell: bash
        run: |
          set +e
          found=false
          attempts=0
          for n in $(seq 1 30); do
            attempts="$n"
            echo "attempt $n/30"
            curl -LfsS --max-time 30 "$PROD/all.html?gitrebuild=$(date +%s)" -o /tmp/all.html
            if grep -Fq '隠れた名作' /tmp/all.html && grep -Fq 'hiddenGemsList' /tmp/all.html; then
              found=true
              break
            fi
            sleep 20
          done
          mkdir -p status
          cat > status/cloudflare-pages-git-rebuild-check.json <<JSON
          {
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "production": "$PROD",
            "hidden_gems_visible_in_static_html": $found,
            "attempts": $attempts
          }
          JSON
          cat status/cloudflare-pages-git-rebuild-check.json
          exit 0

      - name: Persist result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/cloudflare-pages-git-rebuild-check.json
          git commit -m 'status: Git-integrated Pages rebuild check'
          git push
