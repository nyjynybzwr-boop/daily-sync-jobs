name: Dispatch male catalog probes

on:
  push:
    paths:
      - '.github/workflows/dispatch-male-catalog-probes.yml'

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Dispatch private probe workflows
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
        run: |
          set -euo pipefail
          gh workflow run catalog-index-male.yml --repo "$SOURCE_REPO" -f max_pages=2 -f page_delay_ms=2000
          gh workflow run catalog-index-male-manga.yml --repo "$SOURCE_REPO" -f max_pages=2 -f page_delay_ms=2000
          sleep 6

          audio_run="$(gh run list --repo "$SOURCE_REPO" --workflow catalog-index-male.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')"
          manga_run="$(gh run list --repo "$SOURCE_REPO" --workflow catalog-index-male-manga.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId')"
          echo "audio_run=$audio_run" | tee -a "$GITHUB_ENV"
          echo "manga_run=$manga_run" | tee -a "$GITHUB_ENV"
          echo "Dispatched audio=$audio_run manga=$manga_run"

      - name: Wait for private probes
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
        run: |
          set +e
          gh run watch "$audio_run" --repo "$SOURCE_REPO" --exit-status
          audio_watch=$?
          gh run watch "$manga_run" --repo "$SOURCE_REPO" --exit-status
          manga_watch=$?
          echo "audio_watch=$audio_watch" >> "$GITHUB_ENV"
          echo "manga_watch=$manga_watch" >> "$GITHUB_ENV"
          exit 0

      - name: Read committed probe results
        env:
          GH_TOKEN_PRIVATE: ${{ secrets.SYNC_TOKEN }}
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
        run: |
          set -euo pipefail
          git clone --quiet --depth=1 "https://x-access-token:${GH_TOKEN_PRIVATE}@github.com/${SOURCE_REPO}.git" private-source
          node <<'NODE'
          const fs = require('fs');
          const cp = (p) => fs.existsSync(p) ? JSON.parse(fs.readFileSync(p,'utf8')) : null;
          const ids = (p) => {
            if (!fs.existsSync(p)) return null;
            const x = JSON.parse(fs.readFileSync(p,'utf8'));
            return Array.isArray(x) ? x.length : Object.keys(x).length;
          };
          const audio = cp('private-source/data/male/catalog/index/checkpoint.json');
          const manga = cp('private-source/data/male/manga/catalog/index/checkpoint.json');
          const out = {
            checked_at: new Date().toISOString(),
            audio_run: Number(process.env.audio_run || 0),
            manga_run: Number(process.env.manga_run || 0),
            audio_watch_exit: Number(process.env.audio_watch || 0),
            manga_watch_exit: Number(process.env.manga_watch || 0),
            audio: audio ? {
              source_total_count: audio.source_total_count ?? null,
              last_page: audio.last_page ?? null,
              done: Boolean(audio.done),
              stopped_reason: audio.stopped_reason ?? null,
              ids_collected: ids('private-source/data/male/catalog/index/ids.json')
            } : null,
            manga: manga ? {
              source_total_count: manga.source_total_count ?? null,
              last_page: manga.last_page ?? null,
              done: Boolean(manga.done),
              stopped_reason: manga.stopped_reason ?? null,
              ids_collected: ids('private-source/data/male/manga/catalog/index/ids.json')
            } : null
          };
          fs.mkdirSync('status',{recursive:true});
          fs.writeFileSync('status/male-catalog-probes.json', JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE

      - name: Publish probe status
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add status/male-catalog-probes.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'status: male catalog probes'
          git pull --rebase origin main
          git push origin main
