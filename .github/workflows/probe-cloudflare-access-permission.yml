name: Probe Cloudflare Access Permission

# Read-only / invalid-payload permission checks. This workflow never creates an Access app.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-cloudflare-access-permission.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Access read and write permissions without changes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Required Cloudflare secrets are missing."
            exit 1
          fi

          read_body="$(mktemp)"
          read_code="$(curl -sS -o "$read_body" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps?per_page=1")"
          echo "READ HTTP $read_code"
          jq '{success, errors: [.errors[]? | {code, message}], result_count: ((.result // []) | length)}' "$read_body"
          test "$read_code" = "200"

          # Deliberately invalid payload: required application fields are absent, so this cannot create an app.
          write_body="$(mktemp)"
          write_code="$(curl -sS -o "$write_body" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps")"
          echo "WRITE-PROBE HTTP $write_code"
          jq '{success, errors: [.errors[]? | {code, message}]}' "$write_body"
          if [ "$write_code" = "200" ] || [ "$write_code" = "201" ]; then
            echo "Unexpected success from deliberately invalid payload; refusing to continue."
            exit 2
          fi
