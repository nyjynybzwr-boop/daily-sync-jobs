name: Probe Cloudflare Access Permission

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-cloudflare-access-permission.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Access apps read permission (no changes)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Required Cloudflare secrets are missing."
            exit 1
          fi
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access/apps?per_page=1")"
          echo "HTTP $code"
          jq '{success, errors: [.errors[]? | {code, message}], result_count: ((.result // []) | length)}' "$body"
          test "$code" = "200"
