name: Cluster review play evaluation reasons

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cluster-review-play-evaluation-reasons.yml'
      - '.review-play-reason-trigger'

permissions:
  contents: read

jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PILOT_DIR: data/research/review-evaluation-pilot/otome-audio-yearly-top30-2025
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet sentence-transformers scikit-learn
      - name: Confirm semantic views
        working-directory: work
        run: test -s "$PILOT_DIR/semantic-views.jsonl"
      - name: Cluster reasons within each play target
        working-directory: work
        env:
          REVIEW_EVAL_PILOT_DIR: ${{ env.PILOT_DIR }}
          REVIEW_EVAL_EMBED_MODEL: intfloat/multilingual-e5-small
          REVIEW_PLAY_REASON_MIN_ROWS: '10'
          REVIEW_PLAY_REASON_MIN_CLUSTER: '4'
          REVIEW_PLAY_REASON_REPS: '8'
        run: python scripts/cluster-review-play-evaluation-reasons.py
      - name: Validate and commit
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          json="$PILOT_DIR/play-evaluation-reason-clusters.json"
          md="$PILOT_DIR/play-evaluation-reason-clusters.md"
          test -s "$json"; test -s "$md"
          python - "$json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          n=sum(a['cluster_count'] for a in d['anchor_results'])
          if n<2: raise SystemExit(f'too few reason clusters: {n}')
          print({'total_reason_clusters':n,'anchors':[(a['label'],a['cluster_count']) for a in d['anchor_results']]})
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$json" "$md"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: play-specific evaluation reason clusters" || exit 0
          git pull --rebase origin main
          git push origin main
