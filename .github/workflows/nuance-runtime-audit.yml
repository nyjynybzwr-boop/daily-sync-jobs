name: Nuance runtime dependency audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nuance-runtime-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install runtime with patched transitive image dependency
        working-directory: work
        run: |
          npm ci
          npm pkg set 'overrides.sharp=0.35.3'
          npm install --save @huggingface/transformers@3.8.1
          npm ls @huggingface/transformers sharp
      - name: Audit production dependencies
        working-directory: work
        run: npm audit --omit=dev
      - name: Smoke-test text embedding
        working-directory: work
        run: |
          node --input-type=module <<'NODE'
          import { pipeline } from '@huggingface/transformers';
          const extractor=await pipeline('feature-extraction','Xenova/multilingual-e5-small',{dtype:'q8'});
          const out=await extractor('query: 男が興奮する',{pooling:'mean',normalize:true});
          if(out.dims.at(-1)!==384) throw new Error(`unexpected dims ${out.dims}`);
          console.log(`text embedding ok dims=${out.dims.join('x')}`);
          await extractor.dispose?.();
          NODE
