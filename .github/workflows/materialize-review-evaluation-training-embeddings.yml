name: Materialize review evaluation training embeddings

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/materialize-review-evaluation-training-embeddings.yml'
      - '.review-evaluation-training-embeddings-trigger'

permissions:
  contents: read

concurrency:
  group: review-evaluation-training-embeddings
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: work/package-lock.json

      - name: Install dependencies
        working-directory: work
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Materialize local E5 training embeddings
        working-directory: work
        run: |
          set -euo pipefail
          node --check scripts/materialize-review-evaluation-training-embeddings.mjs
          node scripts/materialize-review-evaluation-training-embeddings.mjs
          test -s .tmp/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/training-embeddings.jsonl
          gzip -9 -c .tmp/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/training-embeddings.jsonl > .tmp/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/training-embeddings.jsonl.gz

      - name: Upload embedding cache to R2
        working-directory: work
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          f=.tmp/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/training-embeddings.jsonl.gz
          key=review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/training/training-embeddings.jsonl.gz
          npx --yes wrangler r2 object put "melosignal-data/${key}" --file "$f" --remote
          node - "$f" data/research/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/training-embedding-manifest.json <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const [f,mf]=process.argv.slice(2); const b=fs.readFileSync(f); const m=JSON.parse(fs.readFileSync(mf,'utf8'));
          m.r2.compressed_bytes=b.length; m.r2.compressed_sha256=crypto.createHash('sha256').update(b).digest('hex');
          fs.writeFileSync(mf,JSON.stringify(m,null,2)+'\n');
          NODE

      - name: Verify and commit compact embedding manifest
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          mf=data/research/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/training-embedding-manifest.json
          node - "$mf" <<'NODE'
          const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(m.status!=='local_training_embeddings_materialized'||m.rows!==2931||m.vector_dimension!==384) throw new Error('embedding manifest mismatch');
          if(m.model?.paid_api!==false||m.model_input_fields?.join(',')!=='evidence_text') throw new Error('embedding contract drift');
          if(!m.r2?.compressed_sha256||!m.r2?.compressed_bytes) throw new Error('missing R2 compressed provenance');
          console.log({status:m.status,rows:m.rows,split_counts:m.split_counts,dimension:m.vector_dimension,r2:m.r2});
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$mf"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: materialize classifier training embeddings" || exit 0
          git pull --rebase origin main
          git push origin main
