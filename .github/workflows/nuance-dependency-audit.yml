name: Nuance dependency audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nuance-dependency-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Transformers.js with patched sharp override
        working-directory: work
        run: |
          npm ci
          npm pkg set overrides.sharp=0.35.0
          npm install --save @huggingface/transformers@3.8.1
      - name: Require clean production audit
        working-directory: work
        run: npm audit --omit=dev
      - name: Smoke-test text embedding with override
        working-directory: work
        run: |
          node --input-type=module <<'NODE'
          import { pipeline } from '@huggingface/transformers';
          const extractor=await pipeline('feature-extraction','Xenova/multilingual-e5-small',{dtype:'q8'});
          const out=await extractor('query: 男が自分で自慰を見せつける',{pooling:'mean',normalize:true});
          const dims=out.dims.at(-1);
          if(dims!==384)throw new Error(`unexpected embedding dims: ${dims}`);
          console.log(`patched runtime embedding ok: dims=${dims}`);
          await extractor.dispose?.();
          NODE
