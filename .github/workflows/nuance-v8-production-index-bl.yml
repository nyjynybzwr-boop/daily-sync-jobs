name: Nuance v8 BL production index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nuance-v8-production-index-bl.yml'

concurrency:
  group: nuance-v8-bl-production-index
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and embedding runtime
        working-directory: work
        run: |
          npm ci
          npm install --no-save @huggingface/transformers@3.8.1

      - name: Run actor-target regression tests
        working-directory: work
        run: node scripts/test-nuance-v8-core.mjs

      - name: Materialize BL catalog
        working-directory: work
        run: git lfs pull --include="data/bl/catalog/full/details.json"

      - name: Build BL production index
        working-directory: work
        env:
          EMBED_BATCH: '64'
        run: node scripts/build-nuance-search-v8-index-bl.mjs

      - name: Validate BL index
        working-directory: work
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const meta=JSON.parse(fs.readFileSync('api/data/nuance-v8-bl-meta.json','utf8'));
          const bytes=fs.statSync('api/data/nuance-v8-bl-vectors.bin').size;
          if(meta.total_works<2000)throw new Error(`too few BL works: ${meta.total_works}`);
          if(meta.total_scenes<meta.total_works*2)throw new Error(`too few BL scenes: ${meta.total_scenes}`);
          if(bytes!==meta.total_scenes*meta.dimensions)throw new Error(`BL vector byte mismatch: ${bytes} vs ${meta.total_scenes*meta.dimensions}`);
          console.log(`BL index ok: works=${meta.total_works} scenes=${meta.total_scenes} dims=${meta.dimensions} bytes=${bytes}`);
          NODE

      - name: Push BL production index
        working-directory: work
        run: bash scripts/ci/push.sh "api/data/nuance-v8-bl-meta.json api/data/nuance-v8-bl-vectors.bin"
