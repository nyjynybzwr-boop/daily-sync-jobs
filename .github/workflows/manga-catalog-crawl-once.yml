name: Manga catalog clean recrawl once

on:
  push:
    paths:
      - '.github/workflows/manga-catalog-crawl-once.yml'
  workflow_dispatch:

concurrency:
  group: manga-catalog-crawl-once
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: work
        run: |
          npm ci
          npm install --no-save devalue

      - name: Materialize existing manga details
        working-directory: work
        run: git lfs pull --include="data/manga/catalog/full/details.json"

      - name: Reset corrupted manga index and keep only reusable MNG details
        working-directory: work
        run: |
          mkdir -p data/manga/catalog/index data/manga/catalog/full
          printf '{}\n' > data/manga/catalog/index/ids.json
          cat > data/manga/catalog/index/checkpoint.json <<'JSON'
          {
            "last_page": 0,
            "done": false,
            "stopped_reason": null,
            "consecutive_empty_pages": 0
          }
          JSON
          node - <<'NODE'
          const fs = require('fs');
          const file = 'data/manga/catalog/full/details.json';
          const all = JSON.parse(fs.readFileSync(file));
          const clean = {};
          for (const [id, row] of Object.entries(all)) {
            if (!row.excluded_work_type && !row.detail_error && row.work_type_value === 'MNG') clean[id] = row;
          }
          console.log(`Reusable valid MNG details: ${Object.keys(clean).length}/${Object.keys(all).length}`);
          fs.writeFileSync(file, JSON.stringify(clean, null, 2) + '\n');
          NODE

      - name: Rebuild manga listing index through Tokyo relay
        working-directory: work
        env:
          DLSITE_CATALOG_BASE: https://www.dlsite.com/girls-touch/works/type/=/work_type_category/comic
          DATA_ROOT: data/manga/catalog
          MAX_PAGES_PER_RUN: '60'
          PAGE_DELAY_MS: '2000'
        run: |
          set -euo pipefail
          for wave in $(seq 1 6); do
            echo "=== clean manga index wave $wave ==="
            # GitHub-hosted runners are outside Japan. Refresh a short-lived
            # GitHub OIDC token for every bounded listing wave, then route only
            # DLsite manga traffic through the hnd1 Vercel relay.
            source scripts/ci/dlsite-jp-relay-env.sh
            node scripts/collect-catalog-index.mjs
            DONE=$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('data/manga/catalog/index/checkpoint.json')).done ? 'true' : 'false')")
            COUNT=$(node -e "const fs=require('fs'); console.log(Object.keys(JSON.parse(fs.readFileSync('data/manga/catalog/index/ids.json'))).length)")
            PAGE=$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('data/manga/catalog/index/checkpoint.json')).last_page)")
            echo "index state: count=$COUNT last_page=$PAGE done=$DONE"
            if [ "$DONE" = "true" ]; then break; fi
          done
          node - <<'NODE'
          const fs = require('fs');
          const ids = JSON.parse(fs.readFileSync('data/manga/catalog/index/ids.json'));
          const cp = JSON.parse(fs.readFileSync('data/manga/catalog/index/checkpoint.json'));
          const count = Object.keys(ids).length;
          console.log('CLEAN_MANGA_INDEX_AUDIT ' + JSON.stringify({count,last_page:cp.last_page,done:cp.done,stopped_reason:cp.stopped_reason}));
          if (!cp.done) throw new Error('Manga listing did not reach its end within 6 waves');
          if (count < 7500 || count > 8500) throw new Error(`Manga index count ${count} is outside the expected Japan-visible range`);
          if (cp.last_page < 250) throw new Error(`Manga listing ended suspiciously early at page ${cp.last_page}`);
          NODE

      - name: Prune reusable details to the rebuilt index
        working-directory: work
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const ids = JSON.parse(fs.readFileSync('data/manga/catalog/index/ids.json'));
          const file = 'data/manga/catalog/full/details.json';
          const old = JSON.parse(fs.readFileSync(file));
          const keep = {};
          for (const [id, row] of Object.entries(old)) if (ids[id]) keep[id] = row;
          console.log(`Reusable details inside clean index: ${Object.keys(keep).length}/${Object.keys(ids).length}`);
          fs.writeFileSync(file, JSON.stringify(keep, null, 2) + '\n');
          NODE

      - name: Enrich every missing manga work through Tokyo relay
        working-directory: work
        env:
          BATCH_SIZE: '100'
          DETAIL_DELAY_MS: '800'
          DATA_ROOT: data/manga/catalog
          WORK_TYPE_FILTER: MNG
        run: |
          set -euo pipefail
          for batch in $(seq 1 12); do
            PROCESSED=$(node -e "const fs=require('fs'); console.log(Object.keys(JSON.parse(fs.readFileSync('data/manga/catalog/full/details.json'))).length)")
            TOTAL=$(node -e "const fs=require('fs'); console.log(Object.keys(JSON.parse(fs.readFileSync('data/manga/catalog/index/ids.json'))).length)")
            echo "detail state before batch $batch: processed=$PROCESSED indexed=$TOTAL"
            if [ "$PROCESSED" -ge "$TOTAL" ]; then break; fi
            # A detail batch can run for minutes, so refresh the short-lived
            # OIDC token before every 100-work batch instead of reusing one JWT.
            source scripts/ci/dlsite-jp-relay-env.sh
            node scripts/collect-catalog-details-batch.mjs
          done

      - name: Final clean manga catalog audit
        working-directory: work
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const ids = JSON.parse(fs.readFileSync('data/manga/catalog/index/ids.json'));
          const details = JSON.parse(fs.readFileSync('data/manga/catalog/full/details.json'));
          const checkpoint = JSON.parse(fs.readFileSync('data/manga/catalog/index/checkpoint.json'));
          const idSet = new Set(Object.keys(ids));
          const rows = Object.entries(details).filter(([id]) => idSet.has(id)).map(([,row]) => row);
          const stats = {
            indexed: idSet.size,
            processed: rows.length,
            manga: rows.filter(x => !x.excluded_work_type && x.work_type_value === 'MNG').length,
            excluded_non_mng: rows.filter(x => x.excluded_work_type).length,
            detail_errors: rows.filter(x => x.detail_error).length,
            last_page: checkpoint.last_page,
            done: checkpoint.done,
            stopped_reason: checkpoint.stopped_reason,
            screenshot_work_present: idSet.has('RJ01512512') && Boolean(details.RJ01512512),
          };
          console.log('FINAL_CLEAN_MANGA_AUDIT ' + JSON.stringify(stats));
          if (!stats.done) throw new Error('Listing crawl is not marked done');
          if (stats.indexed < 7500 || stats.indexed > 8500) throw new Error(`Unexpected Japan-visible indexed count ${stats.indexed}`);
          if (stats.processed !== stats.indexed) throw new Error(`Not all indexed works processed: ${stats.processed}/${stats.indexed}`);
          if (stats.detail_errors !== 0) throw new Error(`Detail errors remain: ${stats.detail_errors}`);
          if (stats.manga < 7500) throw new Error(`Too few verified manga works: ${stats.manga}`);
          if (stats.excluded_non_mng > 200) throw new Error(`Too many non-MNG results leaked into manga listing: ${stats.excluded_non_mng}`);
          if (!stats.screenshot_work_present) throw new Error('Known Japan-only manga RJ01512512 is still missing');
          NODE

      - name: Push clean manga catalog
        working-directory: work
        run: bash scripts/ci/push.sh "data/manga/catalog/index data/manga/catalog/full/details.json"
