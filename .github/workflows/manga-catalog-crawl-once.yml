name: Manga catalog crawl once

on:
  push:
    paths:
      - '.github/workflows/manga-catalog-crawl-once.yml'
  workflow_dispatch:

concurrency:
  group: manga-catalog-crawl-once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: work
        run: |
          npm ci
          npm install --no-save devalue

      - name: Materialize existing manga catalog
        working-directory: work
        run: git lfs pull --include="data/manga/catalog/full/details.json"

      - name: Continue manga catalog until end
        working-directory: work
        env:
          MAX_PAGES_PER_RUN: '60'
          BATCH_SIZE: '700'
          DETAIL_DELAY_MS: '800'
          DATA_ROOT: data/manga/catalog
          WORK_TYPE_FILTER: MNG
        run: |
          set -e
          for wave in $(seq 1 4); do
            echo "=== manga crawl wave $wave ==="
            bash scripts/ci/run-h.sh

            while true; do
              ENRICHED=$(node -e "const fs=require('fs'); console.log(Object.keys(JSON.parse(fs.readFileSync('data/manga/catalog/full/details.json'))).length)")
              TOTAL=$(node -e "const fs=require('fs'); console.log(Object.keys(JSON.parse(fs.readFileSync('data/manga/catalog/index/ids.json'))).length)")
              echo "wave $wave detail state: enriched=$ENRICHED indexed=$TOTAL"
              if [ "$ENRICHED" -ge "$TOTAL" ]; then break; fi
              node scripts/collect-catalog-details-batch.mjs
            done

            node - <<'NODE'
          const fs = require('fs');
          const ids = JSON.parse(fs.readFileSync('data/manga/catalog/index/ids.json'));
          const details = JSON.parse(fs.readFileSync('data/manga/catalog/full/details.json'));
          const checkpoint = JSON.parse(fs.readFileSync('data/manga/catalog/index/checkpoint.json'));
          const rows = Object.values(details);
          console.log('MANGA_AUDIT ' + JSON.stringify({
            indexed: Object.keys(ids).length,
            processed: rows.length,
            manga: rows.filter(x => !x.excluded_work_type && x.work_type_value === 'MNG').length,
            excluded_non_mng: rows.filter(x => x.excluded_work_type).length,
            detail_errors: rows.filter(x => x.detail_error).length,
            last_page: checkpoint.last_page,
            done: checkpoint.done,
            stopped_reason: checkpoint.stopped_reason,
          }));
          NODE

            bash scripts/ci/push.sh "data/manga/catalog/index data/manga/catalog/full/details.json"

            DONE=$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('data/manga/catalog/index/checkpoint.json')).done ? 'true' : 'false')")
            if [ "$DONE" = "true" ]; then
              echo "Manga listing fully walked."
              break
            fi
          done

      - name: Final manga catalog audit
        working-directory: work
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const ids = JSON.parse(fs.readFileSync('data/manga/catalog/index/ids.json'));
          const details = JSON.parse(fs.readFileSync('data/manga/catalog/full/details.json'));
          const checkpoint = JSON.parse(fs.readFileSync('data/manga/catalog/index/checkpoint.json'));
          const rows = Object.values(details);
          const stats = {
            indexed: Object.keys(ids).length,
            processed: rows.length,
            manga: rows.filter(x => !x.excluded_work_type && x.work_type_value === 'MNG').length,
            excluded_non_mng: rows.filter(x => x.excluded_work_type).length,
            detail_errors: rows.filter(x => x.detail_error).length,
            last_page: checkpoint.last_page,
            done: checkpoint.done,
            stopped_reason: checkpoint.stopped_reason,
          };
          console.log('FINAL_MANGA_AUDIT ' + JSON.stringify(stats));
          if (!stats.done || stats.processed < stats.indexed || stats.detail_errors !== 0) process.exit(1);
          NODE
