name: Manga catalog crawl once

on:
  push:
    paths:
      - '.github/workflows/manga-catalog-crawl-once.yml'
  workflow_dispatch:

concurrency:
  group: manga-catalog-crawl-once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          if ! git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work; then
            echo 'Source checkout failed.'
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: work
        run: |
          npm ci
          npm install --no-save devalue

      - name: Materialize existing manga catalog if present
        working-directory: work
        run: git lfs pull --include="data/manga/catalog/full/details.json" || true

      - name: Crawl next 60 manga listing pages and first detail batch
        working-directory: work
        env:
          MAX_PAGES_PER_RUN: '60'
          BATCH_SIZE: '700'
          DETAIL_DELAY_MS: '800'
        run: bash scripts/ci/run-h.sh

      - name: Finish detail backlog from this index crawl
        working-directory: work
        env:
          DATA_ROOT: data/manga/catalog
          WORK_TYPE_FILTER: MNG
          BATCH_SIZE: '700'
          DETAIL_DELAY_MS: '800'
        run: |
          for i in $(seq 1 12); do
            ENRICHED=$(node -e "const fs=require('fs'); const p='data/manga/catalog/full/details.json'; console.log(fs.existsSync(p)?Object.keys(JSON.parse(fs.readFileSync(p))).length:0)")
            TOTAL=$(node -e "const fs=require('fs'); const p='data/manga/catalog/index/ids.json'; console.log(fs.existsSync(p)?Object.keys(JSON.parse(fs.readFileSync(p))).length:0)")
            echo "before batch $i: enriched=$ENRICHED total=$TOTAL"
            if [ "$ENRICHED" -ge "$TOTAL" ]; then
              break
            fi
            node scripts/collect-catalog-details-batch.mjs
          done

      - name: Verify and audit manga catalog state
        working-directory: work
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const ids = JSON.parse(fs.readFileSync('data/manga/catalog/index/ids.json'));
          const details = JSON.parse(fs.readFileSync('data/manga/catalog/full/details.json'));
          const checkpoint = JSON.parse(fs.readFileSync('data/manga/catalog/index/checkpoint.json'));
          const rows = Object.values(details);
          const stats = {
            indexed: Object.keys(ids).length,
            processed: rows.length,
            manga: rows.filter(x => !x.excluded_work_type && x.work_type_value === 'MNG').length,
            excluded_non_mng: rows.filter(x => x.excluded_work_type).length,
            detail_errors: rows.filter(x => x.detail_error).length,
            last_page: checkpoint.last_page,
            done: checkpoint.done,
            stopped_reason: checkpoint.stopped_reason,
          };
          console.log('MANGA_AUDIT ' + JSON.stringify(stats));
          if (stats.indexed <= 0 || stats.processed < stats.indexed || stats.detail_errors !== 0) process.exit(1);
          NODE

      - name: Push manga catalog to private main
        working-directory: work
        run: bash scripts/ci/push.sh "data/manga/catalog/index data/manga/catalog/full/details.json"
