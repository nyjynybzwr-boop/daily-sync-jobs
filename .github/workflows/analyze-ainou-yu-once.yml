name: Analyze Ainou Yu reviews once

on:
  push:
    paths:
      - '.github/triggers/analyze-ainou-yu-once'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analyze-ainou-yu-once
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build review lexical audit and capture official page text
        working-directory: work
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const root='data/research/review-reading-packets/deep-dive-ainou-yu-direct';
          const p=`${root}/reviews.json`;
          const doc=JSON.parse(fs.readFileSync(p,'utf8'));
          const reviews=doc.reviews||[];
          const norm=v=>String(v??'').normalize('NFKC').toLowerCase();
          const specs={
            voice_acting:/恋津田|声優|cv|演技|声(?!がけ)|ボイス|声色|話し方|トーン|芝居|演者/iu,
            laugh_natural_delivery:/笑い方|笑い声|笑いこら|笑って|笑う|笑顔|自然な|ナチュラル/iu,
            story_script:/ストーリー|シナリオ|脚本|物語|展開|構成|オチ|ストーリ/iu,
            mystery_reveal:/謎|正体|真相|ネタバレ|ネタばら|答え合わせ|伏線|衝撃|驚き|どんでん|何者/iu,
            replay_value:/二周|2周|二度目|2度目|聴き返|聞き返|リピート|何度|周回|もう一度/iu,
            detective_investigation:/探偵|調査|尾行|依頼|盗聴|報告書/iu,
            character_charm_melo:/メロ|沼|魅力|惚れ|好きすぎ|愛し|刺さ|ときめ|ドキドキ/iu,
            gentle_sweet_affection:/優し|甘々|あまあま|甘やか|溺愛|愛され|相思相愛|好き.*好き|恋人|彼氏|大切|幸せ/iu,
            teasing_dominance:/意地悪|いじわる|からか|煽|あお|翻弄|逆らえ|主導|弄|いじめ|余裕|一枚上手/iu,
            gap_duality:/ギャップ|二面性|裏の顔|表の顔|爽やか.*不穏|優し.*意地悪|スパダリ|仕事でき|シゴデキ|有能/iu,
            sexual_interrogation:/尋問|えっち|エッチ|濡れ場|hシーン|本番|セックス|sex|責め|お仕置き|おしおき/iu,
            orgasm_imitation:/喘ぎ真似|喘ぎまね|喘ぎ.*真似|イク.*真似|絶頂.*真似/iu,
            kiss_lick_sound:/キス|リップ音|舐め|なめ|舌|唾液|水音|吐息|耳元|囁|ささや/iu,
            physical_size:/巨根|大きい|でかい|デカい|太い|サイズ|ちん/iu,
            smoking:/喫煙|煙草|タバコ|たばこ/iu,
            heroine:/ヒロイン|主人公|探偵見習|女の子/iu,
            bonus_track:/おまけ|bonus|track02|track 02|トラック02|トラック2|特典/iu,
            sequel_more:/続編|2作目|二作目|次回作|続き|おかわり|その後|もっと.*二人|もっと.*2人/iu,
            visual_art:/ジャケット|イラスト|絵|ビジュアル|見た目|顔|デザイン/iu,
            name_wordplay:/i know you|名前|ネーミング|愛脳.*意味/iu,
            audio_technical:/音質|効果音|se|bgm|距離感|立体音響|バイノーラル|左右|マイク/iu,
            predictable_reveal:/分かりやす|わかりやす|予想.*でき|予想通り|読めた|でしょうね|驚き.*な|衝撃.*な|バレバレ/iu,
            love_motivation_gap:/好き.*理由.*分から|好き.*理由.*わから|惹かれた.*きっかけ|惹かれた.*理由|なぜ.*好き|なんで.*好き|理由.*明かされ|置いてきぼり/iu,
            want_more_relationship:/もうちょっと.*二人|もうちょっと.*2人|もっと.*甘|もっと.*恋人|その後.*見|日常.*もっと|物足り|短い|短かった/iu,
            script_negative:/脚本.*惜|シナリオ.*惜|展開.*惜|ストーリー.*惜|脚本.*残念|シナリオ.*残念|ストーリー.*残念|内容.*置いてきぼり/iu,
          };
          const cats={};
          for(const [key,re] of Object.entries(specs)){
            const hits=[];
            for(const r of reviews){
              const text=norm(`${r.title||''}\n${r.text||''}`);
              if(re.test(text)) hits.push({review_ref:r.review_ref,rate_num:r.rate_num,title:r.title||'',good_review:r.good_review||0});
              re.lastIndex=0;
            }
            cats[key]={review_mentions:hits.length,share:Number((100*hits.length/reviews.length).toFixed(1)),hits:hits.slice(0,20)};
          }

          const lowRated=reviews.filter(r=>Number(r.rate_num||0)<50).map(r=>({review_ref:r.review_ref,rate_num:r.rate_num,title:r.title,text:r.text,date:r.date,good_review:r.good_review}));
          const seg=new Intl.Segmenter('ja',{granularity:'word'});
          const stop=new Set('これ それ あれ こと もの よう ため ところ とき さん ちゃん くん です ます でした ました して いる ある なる ない なく とても すごく めちゃくちゃ 本当 本当に 個人的 今回 作品 最高 良い よかった 良かった 好き 思う 思い 聴く 聞く 本編 トラック シーン 方 もう かな ので けど から まで だけ ほど そして でも という として かなり めっちゃ ほんと まじ すぎる すぎて すぎ'.split(/\s+/));
          const freq=new Map();
          for(const r of reviews){
            for(const x of seg.segment(norm(`${r.title||''} ${r.text||''}`))){
              const w=x.segment.trim();
              if(!x.isWordLike||w.length<2||stop.has(w)||/^\d+$/.test(w)) continue;
              freq.set(w,(freq.get(w)||0)+1);
            }
          }
          const top_tokens=[...freq].sort((a,b)=>b[1]-a[1]).slice(0,120).map(([token,count])=>({token,count}));

          let catalogRow=null;
          try{
            const cat=JSON.parse(fs.readFileSync('web/data/catalog/search-index.json','utf8'));
            catalogRow=(cat.works||[]).find(w=>String(w.product_id||'').toUpperCase()===doc.product_id)||null;
          }catch(e){ catalogRow={error:String(e)}; }

          let official={url:doc.official_work_url,status:null,title:null,description:null,text:null,error:null};
          try{
            const res=await fetch(doc.official_work_url,{headers:{
              'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1',
              'Accept-Language':'ja-JP,ja;q=0.9',
              'Cookie':'adultchecked=1',
            },redirect:'follow',signal:AbortSignal.timeout(30000)});
            const html=await res.text();
            official.status=res.status;
            const title=(html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)||[])[1]||'';
            const desc=(html.match(/<meta[^>]+name=["']description["'][^>]+content=["']([^"']*)["']/i)||html.match(/<meta[^>]+content=["']([^"']*)["'][^>]+name=["']description["']/i)||[])[1]||'';
            const body=html.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#160;/gi,' ').replace(/&amp;/gi,'&').replace(/&quot;/gi,'"').replace(/&#39;|&apos;/gi,"'").replace(/&lt;/gi,'<').replace(/&gt;/gi,'>').replace(/\s+/g,' ').trim();
            official.title=title.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
            official.description=desc;
            official.text=body.slice(0,50000);
          }catch(e){ official.error=String(e); }

          const out={schema_version:1,product_id:doc.product_id,title:doc.title,circle:doc.circle,review_count:reviews.length,rating_distribution:doc.rating_distribution,categories:cats,low_rated_reviews:lowRated,top_tokens,catalog_row:catalogRow,official_page:official};
          fs.writeFileSync(`${root}/analysis-audit.json`,JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({review_count:reviews.length,low_rated:lowRated.length,official_status:official.status,categories:Object.fromEntries(Object.entries(cats).map(([k,v])=>[k,v.review_mentions]))},null,2));
          NODE

      - name: Commit private analysis audit
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/review-reading-packets/deep-dive-ainou-yu-direct/analysis-audit.json
          git commit -m '[CF-Pages-Skip] [skip actions] research: audit Ainou Yu review themes' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
