name: Materialize male full R2 catalog into Git LFS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/materialize-male-r2-catalog.yml'

permissions:
  contents: read

concurrency:
  group: materialize-male-r2-catalog-v3
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      R2_BUCKET_NAME: melosignal-data
      AUDIO_DIR: .tmp/male-r2-materialize/audio
      MANGA_DIR: .tmp/male-r2-materialize/manga
      OUT: data/catalog/male/full/details.json
      SUMMARY: data/catalog/male/full/manifest.json

    steps:
      - name: Require credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID missing' >&2; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN missing' >&2; exit 1; }

      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
          cd work
          git lfs install --local

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify frozen male R2 progress
        working-directory: work
        run: |
          set -euo pipefail
          node - <<'NODE'
          const a=require('./data/male/r2/audio-progress.json');
          const m=require('./data/male/r2/manga-progress.json');
          if(a.processed!==61892||a.pending!==0||a.next_chunk!==124||a.stopped_reason) throw new Error(`unexpected audio progress ${JSON.stringify({processed:a.processed,pending:a.pending,next_chunk:a.next_chunk,stopped:a.stopped_reason})}`);
          if(m.processed!==129383||m.pending!==0||m.next_chunk!==259||m.stopped_reason) throw new Error(`unexpected manga progress ${JSON.stringify({processed:m.processed,pending:m.pending,next_chunk:m.next_chunk,stopped:m.stopped_reason})}`);
          console.log({audio:a.processed,audio_chunks:a.next_chunk,manga:m.processed,manga_chunks:m.next_chunk,total:a.processed+m.processed,progress_error_entries:(m.errors||[]).length});
          NODE

      - name: Prime Wrangler
        working-directory: work
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@latest --version

      - name: Download all frozen male audio and manga chunks in parallel
        working-directory: work
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$AUDIO_DIR" "$MANGA_DIR"
          download_chunk() {
            media="$1"; idx="$2"; dir="$3"
            padded="$(printf '%05d' "$idx")"
            key="male/${media}/raw/chunk-${padded}.json.gz"
            out="${dir}/chunk-${padded}.json.gz"
            for attempt in 1 2 3; do
              if npx --yes wrangler@latest r2 object get "${R2_BUCKET_NAME}/${key}" --file "$out" --remote >/dev/null; then
                test -s "$out" && return 0
              fi
              rm -f "$out"
              sleep $((attempt * 3))
            done
            echo "failed to download $key" >&2
            return 1
          }
          export -f download_chunk
          printf '%s\n' $(seq 0 123) | xargs -P 24 -n 1 bash -c 'download_chunk audio "$1" "$AUDIO_DIR"' _
          printf '%s\n' $(seq 0 258) | xargs -P 24 -n 1 bash -c 'download_chunk manga "$1" "$MANGA_DIR"' _
          audio_files=$(find "$AUDIO_DIR" -type f | wc -l)
          manga_files=$(find "$MANGA_DIR" -type f | wc -l)
          test "$audio_files" -eq 124
          test "$manga_files" -eq 259
          echo "audio files=$audio_files manga files=$manga_files"

      - name: Materialize ID-complete details map
        working-directory: work
        env:
          MALE_AUDIO_R2_RAW_DIR: ${{ env.AUDIO_DIR }}
          MALE_MANGA_R2_RAW_DIR: ${{ env.MANGA_DIR }}
          MALE_FULL_DETAILS_OUT: ${{ env.OUT }}
          MALE_FULL_DETAILS_SUMMARY: ${{ env.SUMMARY }}
        run: node scripts/materialize-male-r2-details.mjs

      - name: Verify materialized catalog and LFS rule without giant JSON parse
        working-directory: work
        run: |
          set -euo pipefail
          test -s "$OUT"; test -s "$SUMMARY"
          node --input-type=module - "$OUT" "$SUMMARY" <<'NODE'
          import fs from 'node:fs';
          import fsp from 'node:fs/promises';
          import readline from 'node:readline';
          const out=process.argv[2], summaryPath=process.argv[3];
          const s=JSON.parse(await fsp.readFile(summaryPath,'utf8'));
          if(s.counts?.audio!==61892||s.counts?.manga!==129383||s.counts?.total_unique!==191275) throw new Error(`summary mismatch ${JSON.stringify(s.counts)}`);
          if(s.counts?.detail_error_records!==s.detail_errors?.length) throw new Error(`detail error summary mismatch ${s.counts?.detail_error_records} != ${s.detail_errors?.length}`);
          const audioErrors=(s.detail_errors||[]).filter(x=>x.media==='audio');
          const mangaErrors=(s.detail_errors||[]).filter(x=>x.media==='manga');
          if(audioErrors.length!==0) throw new Error(`male audio source unexpectedly contains ${audioErrors.length} detail_error records`);
          if(mangaErrors.length!==s.counts.detail_error_records) throw new Error(`non-manga detail errors present: manga=${mangaErrors.length}, total=${s.counts.detail_error_records}`);
          let ids=0, placeholder=false;
          const rl=readline.createInterface({input:fs.createReadStream(out,{encoding:'utf8'}),crlfDelay:Infinity});
          for await (const line of rl) {
            const m=line.match(/^  "((?:RJ|VJ|BJ|AJ)\d+)": /);
            if(!m) continue;
            ids += 1;
            if(m[1]==='RJ248380' && line.includes('"detail_error":')) placeholder=true;
          }
          if(ids!==191275) throw new Error(`expected 191275 IDs, got ${ids}`);
          if(!placeholder) throw new Error('known RJ248380 source placeholder was not preserved');
          const stat=await fsp.stat(out);
          if(stat.size!==s.output_bytes) throw new Error(`output size mismatch ${stat.size} != ${s.output_bytes}`);
          console.log({ids,counts:s.counts,source_placeholders:{audio:audioErrors.length,manga:mangaErrors.length},output_bytes:s.output_bytes,output_gib:(s.output_bytes/1024/1024/1024).toFixed(3),placeholder});
          NODE
          grep -F 'data/catalog/male/full/details.json filter=lfs' .gitattributes >/dev/null
          git check-attr filter -- "$OUT"

      - name: Commit materialized catalog through LFS
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$OUT" "$SUMMARY"
          git diff --cached --stat
          git show ":$OUT" | grep -F 'version https://git-lfs.github.com/spec/v1' >/dev/null
          if git diff --cached --quiet; then echo 'no materialized catalog changes'; exit 0; fi
          git commit -m "[CF-Pages-Skip] [skip actions] male catalog: materialize complete R2 details"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo 'failed to push male materialized catalog after retries' >&2
          exit 1
