name: Finalize review evaluation rest75 and readiness

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/finalize-review-evaluation-readiness.yml'
      - '.review-evaluation-finalize-readiness-trigger'

permissions:
  contents: read

concurrency:
  group: review-evaluation-finalize-readiness
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOLDOUT_DIR: data/research/review-evaluation-holdout/otome-audio-rest75-pair-v1
      SPEC_DIR: data/research/review-evaluation-spec
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Finalize only when all 2425 human decisions exist
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail

          completed="$(node - <<'NODE'
          const fs=require('fs'), path=require('path');
          const dir=process.env.HOLDOUT_DIR;
          let completed=0, files=0;
          for(let i=1;i<=5;i++){
            const n=String(i).padStart(3,'0');
            const f=path.join(dir,`rest75-pair-holdout-decisions-batch-${n}.json`);
            if(!fs.existsSync(f)) continue;
            files++;
            const d=JSON.parse(fs.readFileSync(f,'utf8'));
            completed+=(d.decisions||[]).filter(x=>x&&x.classification).length;
          }
          console.error(JSON.stringify({decision_files:files,completed_rows:completed,expected:2425}));
          process.stdout.write(String(completed));
          NODE
          )"

          if [ "$completed" != "2425" ]; then
            echo "rest75 human review incomplete: ${completed}/2425; finalization intentionally skipped"
            exit 0
          fi

          node scripts/validate-review-evaluation-rest75-pair-holdout-decisions.mjs
          node scripts/build-review-evaluation-rest75-robustness-report.mjs
          node scripts/build-review-evaluation-rest75-new-candidate-review-packet.mjs

          if [ -s "$HOLDOUT_DIR/rest75-new-candidate-decisions.json" ]; then
            node scripts/validate-review-evaluation-rest75-new-candidate-decisions.mjs
          else
            echo "no completed rest75 new-candidate adjudication yet; readiness may intentionally remain NOT_READY"
          fi

          node scripts/build-review-evaluation-pair-confidence-registry.mjs
          node scripts/build-review-evaluation-production-pair-qualification.mjs
          node scripts/build-review-evaluation-production-pair-view-v2.mjs
          node scripts/validate-review-evaluation-production-pair-view-v2.mjs
          node scripts/build-effective-review-evaluation-target-vocabulary.mjs
          node scripts/build-review-evaluation-analysis-version-manifest.mjs

          set +e
          node scripts/check-review-evaluation-production-readiness.mjs
          readiness_rc=$?
          set -e
          node - <<'NODE'
          const fs=require('fs');
          const f='data/research/review-evaluation-spec/review-evaluation-production-readiness.json';
          const d=JSON.parse(fs.readFileSync(f,'utf8'));
          console.log(JSON.stringify({readiness:d.status,blockers:d.blockers||[]},null,2));
          NODE
          echo "readiness checker exit code: $readiness_rc"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$HOLDOUT_DIR" "$SPEC_DIR"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: finalize rest75 and production readiness" || exit 0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
