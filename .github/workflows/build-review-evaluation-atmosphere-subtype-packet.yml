name: Build review evaluation atmosphere subtype packet

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-review-evaluation-atmosphere-subtype-packet.yml'

permissions:
  contents: read

concurrency:
  group: review-evaluation-atmosphere-subtype-packet
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PILOT_DIR: data/research/review-evaluation-pilot/otome-audio-otome-audio-review-evaluation-semantic-pilot-v1
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm reviewed assignments and views
        working-directory: work
        run: |
          set -euo pipefail
          for f in review-evaluation-mechanism-assignments.jsonl semantic-views.jsonl atmosphere-subtype-decisions.json; do
            test -s "$PILOT_DIR/$f" || { echo "missing $PILOT_DIR/$f" >&2; exit 1; }
          done

      - name: Build atmosphere subtype discovery packet
        working-directory: work
        env:
          REVIEW_EVAL_PILOT_DIR: ${{ env.PILOT_DIR }}
        run: node scripts/build-review-evaluation-atmosphere-subtype-packet.mjs

      - name: Validate packet
        working-directory: work
        run: |
          set -euo pipefail
          for f in atmosphere-subtype-discovery-packet.json atmosphere-subtype-discovery-packet.md atmosphere-subtype-decisions.template.json; do
            test -s "$PILOT_DIR/$f" || { echo "missing $PILOT_DIR/$f" >&2; exit 1; }
          done
          node - "$PILOT_DIR/atmosphere-subtype-discovery-packet.json" <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const s=d.summary||{};
          if((s.atmosphere_evidence||0)<1) throw new Error('no atmosphere evidence');
          if((s.atmosphere_unique_works||0)<2) throw new Error('atmosphere evidence not cross-work');
          if((s.craft_boundary_evidence||0)<1) throw new Error('no craft boundary evidence');
          console.log(s);
          NODE

      - name: Validate reviewed atmosphere decisions
        working-directory: work
        env:
          REVIEW_EVAL_PILOT_DIR: ${{ env.PILOT_DIR }}
        run: node scripts/validate-review-evaluation-atmosphere-subtype-decisions.mjs

      - name: Apply reviewed atmosphere decisions
        working-directory: work
        env:
          REVIEW_EVAL_PILOT_DIR: ${{ env.PILOT_DIR }}
        run: node scripts/apply-review-evaluation-atmosphere-subtype-decisions.mjs

      - name: Commit atmosphere packet and resolutions
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PILOT_DIR/atmosphere-subtype-discovery-packet.json" \
                  "$PILOT_DIR/atmosphere-subtype-discovery-packet.md" \
                  "$PILOT_DIR/atmosphere-subtype-decisions.template.json" \
                  "$PILOT_DIR/atmosphere-subtype-resolutions.jsonl" \
                  "$PILOT_DIR/atmosphere-subtype-resolution-summary.json"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: atmosphere subtype reviewed resolutions" || exit 0
          git pull --rebase origin main
          git push origin main
