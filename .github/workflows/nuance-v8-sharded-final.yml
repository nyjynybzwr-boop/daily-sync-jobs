name: Nuance v8 sharded final

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nuance-v8-sharded-final.yml'

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.pin.outputs.sha }}
    steps:
      - name: Pin current private main
        id: pin
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          sha=$(git ls-remote "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" refs/heads/main | awk '{print $1}')
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinned private source: $sha"

  shard:
    needs: pin
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SOURCE_SHA: ${{ needs.pin.outputs.source_sha }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --quiet --no-checkout "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
          cd work
          git checkout --quiet --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install safe runtime
        working-directory: work
        run: npm ci

      - name: Materialize otome catalog
        working-directory: work
        run: git lfs pull --include="data/catalog/full/details.json"

      - name: Embed shard
        working-directory: work
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: '8'
          EMBED_BATCH: '256'
          SOURCE_SHA: ${{ needs.pin.outputs.source_sha }}
        run: node scripts/build-nuance-v8-shard-final.mjs

      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: nuance-v8-shard-${{ matrix.shard }}
          path: work/artifacts/nuance-v8-shards/
          if-no-files-found: error
          retention-days: 1

  finalize:
    needs: [pin, shard]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SOURCE_SHA: ${{ needs.pin.outputs.source_sha }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --quiet --no-checkout "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
          cd work
          git checkout --quiet --detach "$SOURCE_SHA"
          git switch -c production-final

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate runtime and regressions
        working-directory: work
        run: |
          npm ci
          npm audit --omit=dev
          npm test

      - name: Materialize otome catalog
        working-directory: work
        run: git lfs pull --include="data/catalog/full/details.json"

      - name: Download all shards
        uses: actions/download-artifact@v4
        with:
          pattern: nuance-v8-shard-*
          path: work/artifacts/nuance-v8-shards
          merge-multiple: true

      - name: Finalize signed-int8 production index
        working-directory: work
        env:
          SHARD_COUNT: '8'
        run: node scripts/finalize-nuance-v8-shards-final.mjs

      - name: Enforce production gates
        working-directory: work
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('analysis/nuance-search-v8-production-eval.json','utf8'));
          const byId=new Map(p.cases.map(x=>[x.id,x]));
          const gates=[
            ['gold-rj01066791-show-masturbation',413],
            ['gold-rj01200426-plain-self-touch',12],
            ['gold-rj01093983-passive-touch',24],
            ['gold-rj01093983-active-partner-touch',7],
          ];
          for(const [id,max] of gates){
            const row=byId.get(id);
            if(!row||!Number.isInteger(row.rank)||row.rank>max)throw new Error(`gate failed: ${id} rank=${row?.rank} max=${max}`);
            console.log(`gate ok: ${id} #${row.rank} <= #${max}`);
          }
          const meta=JSON.parse(fs.readFileSync('api/data/nuance-v8-meta.json','utf8'));
          const bytes=fs.statSync('api/data/nuance-v8-vectors.bin').size;
          if(meta.total_works<13000)throw new Error(`too few works: ${meta.total_works}`);
          if(meta.total_scenes<meta.total_works*2)throw new Error(`too few scenes: ${meta.total_scenes}`);
          if(bytes!==meta.total_scenes*meta.dimensions)throw new Error(`vector byte mismatch: ${bytes} vs ${meta.total_scenes*meta.dimensions}`);
          console.log(`final index ok: works=${meta.total_works} scenes=${meta.total_scenes} dims=${meta.dimensions} bytes=${bytes}`);
          NODE

      - name: Push final production index
        working-directory: work
        run: bash scripts/ci/push.sh "api/data/nuance-v8-meta.json api/data/nuance-v8-vectors.bin analysis/nuance-search-v8-production-eval.json"
