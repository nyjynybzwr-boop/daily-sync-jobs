name: Validate review evaluation target-first UI build

on:
  workflow_dispatch:
  push:
    paths:
      - '.review-evaluation-work-detail-ui-validate-trigger'
      - '.github/workflows/validate-review-evaluation-work-detail-ui.yml'

permissions:
  contents: read

concurrency:
  group: review-evaluation-work-detail-ui-validate
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: work/package-lock.json

      - name: Install dependencies
        working-directory: work
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run full static build without deploy
        working-directory: work
        run: npm run build:site

      - name: Verify target-first review evaluation assets and gating
        working-directory: work
        run: |
          set -euo pipefail
          grep -q 'review-evaluation-work-detail.css' web/index.html
          grep -q 'review-evaluation-work-detail.js' web/index.html
          test -s web/review-evaluation-work-detail.css
          test -s web/review-evaluation-work-detail.js
          test -s web/review-evaluation.html
          test -s web/review-evaluation.css
          test -s web/review-evaluation.js
          node --check web/review-evaluation-work-detail.js
          node --check web/review-evaluation.js
          node --check scripts/wire-review-evaluation-work-detail.mjs
          node --check scripts/wire-review-evaluation-dashboard.mjs
          node --check scripts/build-review-evaluation-market-summary-v2.mjs
          if [ -s web/data/review-evaluation/market-summary-v2.json ]; then
            grep -q 'id="reviewEvaluationLink"' web/index.html
          else
            ! grep -q 'id="reviewEvaluationLink"' web/index.html
          fi
          if [ -d site ]; then
            grep -q 'review-evaluation-work-detail.css' site/index.html
            grep -q 'review-evaluation-work-detail.js' site/index.html
            test -s site/review-evaluation-work-detail.css
            test -s site/review-evaluation-work-detail.js
            test -s site/review-evaluation.html
            test -s site/review-evaluation.css
            test -s site/review-evaluation.js
            if [ -s site/data/review-evaluation/market-summary-v2.json ]; then
              grep -q 'id="reviewEvaluationLink"' site/index.html
            else
              ! grep -q 'id="reviewEvaluationLink"' site/index.html
            fi
          fi
          echo 'review-evaluation target-first UI build validation passed'
