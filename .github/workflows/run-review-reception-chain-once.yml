name: Materialize classifier-ready reception corpus

on:
  push:
    paths:
      - '.github/workflows/run-review-reception-chain-once.yml'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone permitted training inputs
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          AUTH_URL="https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git"
          git clone --quiet --filter=blob:none --depth=1 --no-checkout --branch main --single-branch "$AUTH_URL" work
          cd work
          git sparse-checkout init --no-cone
          git sparse-checkout set '/scripts/' '/data/research/review-reception-profile/' '/data/research/review-evaluation-training/rev-eval-46255c55e8d1c5dc/' '/data/research/review-evaluation-spec/effective-target-mapping-vocabulary-v1.json'
          git checkout --quiet main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build classifier-ready corpus
        working-directory: work
        run: |
          set -euo pipefail
          node --check scripts/build-review-reception-classifier-ready-training-corpus.mjs
          node scripts/build-review-reception-classifier-ready-training-corpus.mjs

      - name: Push classifier-ready corpus
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT external runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/review-reception-profile/permitted-classifier-ready-corpus-v1.json
          git commit -m "[skip actions] [CF-Pages-Skip] research: materialize permitted classifier-ready reception corpus"
          git fetch --quiet origin main
          git rebase origin/main
          git push origin HEAD:main
