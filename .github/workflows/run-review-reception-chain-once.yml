name: Fix review reception replay import side effect

on:
  push:
    paths:
      - '.github/workflows/run-review-reception-chain-once.yml'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone only review-reception inputs
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          AUTH_URL="https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git"
          git clone --quiet --filter=blob:none --depth=1 --no-checkout --branch main --single-branch "$AUTH_URL" work
          cd work
          git sparse-checkout init --no-cone
          git sparse-checkout set '/scripts/' '/data/research/review-reception-profile/evidence-recall-audit-v1/'
          git checkout --quiet main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Patch direct-run guard and validate
        working-directory: work
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/replay-review-reception-recall-from-frozen-packet.mjs')
          s = p.read_text(encoding='utf-8')
          if "import { pathToFileURL } from 'node:url';" not in s:
              s = s.replace("import crypto from 'node:crypto';\n", "import crypto from 'node:crypto';\nimport { pathToFileURL } from 'node:url';\n", 1)
          old = "if (process.argv.includes('--self-test')) {\n  await selfTest();\n} else {"
          new = "const isDirectRun = Boolean(process.argv[1]) && import.meta.url === pathToFileURL(path.resolve(process.argv[1])).href;\n\nif (isDirectRun && process.argv.includes('--self-test')) {\n  await selfTest();\n} else if (isDirectRun) {"
          if old not in s:
              raise SystemExit('expected direct-run block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          node --check scripts/replay-review-reception-recall-from-frozen-packet.mjs
          node scripts/replay-review-reception-recall-from-frozen-packet.mjs --self-test

          TARGET=data/research/review-reception-profile/evidence-recall-audit-v1/recall-gate-replay-v1.json
          BEFORE="$(sha256sum "$TARGET" | awk '{print $1}')"
          node --input-type=module -e "await import('./scripts/replay-review-reception-recall-from-frozen-packet.mjs'); console.log('import completed without direct execution')"
          AFTER="$(sha256sum "$TARGET" | awk '{print $1}')"
          test "$BEFORE" = "$AFTER"

      - name: Push private fix
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT external runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/replay-review-reception-recall-from-frozen-packet.mjs
          git commit -m "[skip actions] [CF-Pages-Skip] reviews: prevent replay import side effects"
          git fetch --quiet origin main
          git rebase origin/main
          git push origin HEAD:main
