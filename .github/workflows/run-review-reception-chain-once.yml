name: Evaluate threshold-free reception baseline

on:
  push:
    paths:
      - '.github/workflows/run-review-reception-chain-once.yml'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone permitted reception inputs
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          AUTH_URL="https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git"
          git clone --quiet --filter=blob:none --depth=1 --no-checkout --branch main --single-branch "$AUTH_URL" work
          cd work
          git sparse-checkout init --no-cone
          git sparse-checkout set '/scripts/' '/data/research/review-reception-profile/'
          git checkout --quiet main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install baseline dependency
        run: python -m pip install --quiet scikit-learn==1.7.2

      - name: Evaluate development baseline
        working-directory: work
        run: |
          set -euo pipefail
          python -m py_compile scripts/evaluate-review-reception-char-ngram-baseline.py
          python scripts/evaluate-review-reception-char-ngram-baseline.py

      - name: Push development report
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT external runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/review-reception-profile/char-ngram-baseline-dev-report-v1.json
          git commit -m "[skip actions] [CF-Pages-Skip] research: evaluate five-axis char-ngram dev baseline"
          git fetch --quiet origin main
          git rebase origin/main
          git push origin HEAD:main
