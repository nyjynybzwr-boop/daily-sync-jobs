name: Compare E5 reception baseline

on:
  push:
    paths:
      - '.github/workflows/run-review-reception-chain-once.yml'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone permitted reception inputs
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          AUTH_URL="https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git"
          git clone --quiet --filter=blob:none --depth=1 --no-checkout --branch main --single-branch "$AUTH_URL" work
          cd work
          git sparse-checkout init --no-cone
          git sparse-checkout set '/scripts/' '/data/research/review-reception-profile/'
          git checkout --quiet main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install development dependencies
        working-directory: work
        run: |
          npm install --no-save @huggingface/transformers@3.8.1 >/tmp/npm.log 2>&1 || (cat /tmp/npm.log; exit 1)
          python -m pip install --quiet scikit-learn==1.7.2

      - name: Build transient E5 embeddings and evaluate
        working-directory: work
        env:
          REVIEW_RECEPTION_E5_EMBEDDINGS_JSON: /tmp/review-reception-e5-embeddings.json
          REVIEW_RECEPTION_E5_BATCH: '32'
        run: |
          set -euo pipefail
          node --check scripts/build-review-reception-e5-dev-embeddings.mjs
          python -m py_compile scripts/evaluate-review-reception-e5-logistic-baseline.py
          node scripts/build-review-reception-e5-dev-embeddings.mjs
          python scripts/evaluate-review-reception-e5-logistic-baseline.py
          rm -f /tmp/review-reception-e5-embeddings.json

      - name: Push E5 development report
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT external runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore package.json package-lock.json 2>/dev/null || true
          rm -rf node_modules
          git add data/research/review-reception-profile/e5-logistic-baseline-dev-report-v1.json
          git commit -m "[skip actions] [CF-Pages-Skip] research: evaluate five-axis E5 logistic dev baseline"
          git fetch --quiet origin main
          git rebase origin/main
          git push origin HEAD:main
