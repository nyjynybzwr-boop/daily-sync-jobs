name: Freeze five-axis reception train-dev split

on:
  push:
    paths:
      - '.github/workflows/run-review-reception-chain-once.yml'

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone permitted reception inputs
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          AUTH_URL="https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git"
          git clone --quiet --filter=blob:none --depth=1 --no-checkout --branch main --single-branch "$AUTH_URL" work
          cd work
          git sparse-checkout init --no-cone
          git sparse-checkout set '/scripts/' '/data/research/review-reception-profile/'
          git checkout --quiet main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and validate train-dev manifest
        working-directory: work
        run: |
          set -euo pipefail
          node --check scripts/build-review-reception-permitted-train-dev-manifest.mjs
          node scripts/build-review-reception-permitted-train-dev-manifest.mjs

      - name: Push frozen manifest
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT external runner'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/review-reception-profile/permitted-five-axis-train-dev-manifest-v1.json
          git commit -m "[skip actions] [CF-Pages-Skip] research: freeze permitted five-axis reception train-dev manifest"
          git fetch --quiet origin main
          git rebase origin/main
          git push origin HEAD:main
