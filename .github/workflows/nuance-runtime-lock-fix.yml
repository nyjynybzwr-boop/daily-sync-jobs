name: Nuance runtime lock fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nuance-runtime-lock-fix.yml'

concurrency:
  group: nuance-runtime-lock-fix
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Write safe production runtime lock
        working-directory: work
        run: |
          npm ci
          npm pkg set 'overrides.sharp=0.35.3'
          npm install --save @huggingface/transformers@3.8.1
          npm audit --omit=dev
          node scripts/test-nuance-v8-core.mjs
          npm ls @huggingface/transformers sharp
      - name: Push package files
        working-directory: work
        run: bash scripts/ci/push.sh "package.json package-lock.json"
