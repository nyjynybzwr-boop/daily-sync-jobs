name: Diagnose Pages dashboard

on:
  push:
    paths:
      - '.github/workflows/diagnose-pages-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production endpoints
        shell: bash
        run: |
          set -uo pipefail
          for path in / /data/dashboard.json /data/catalog/search-index.json /data/catalog/summary.json; do
            url="https://dlsite-trend-radar.pages.dev${path}"
            safe=$(echo "$path" | tr '/.' '__')
            [ "$path" = "/" ] && safe=root
            echo "===== $path ====="
            curl -sS -D "/tmp/${safe}.headers" -o "/tmp/${safe}.body" --max-time 120 "$url" || echo "CURL_EXIT=$?"
            head -n 30 "/tmp/${safe}.headers" || true
            echo "BYTES=$(wc -c < /tmp/${safe}.body 2>/dev/null || echo 0)"
            echo "FIRST_200_BYTES:"
            head -c 200 "/tmp/${safe}.body" 2>/dev/null || true
            echo
          done
