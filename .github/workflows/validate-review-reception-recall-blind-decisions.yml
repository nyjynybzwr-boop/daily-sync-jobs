name: Validate review reception recall blind decisions

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/validate-review-reception-recall-blind-decisions.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate frozen blind decisions rows 0001-0015 without extractor trace
        working-directory: work
        run: node scripts/validate-review-reception-recall-blind-decisions.mjs

      - name: Validate frozen blind decisions rows 0016-0030 without extractor trace
        working-directory: work
        env:
          REVIEW_RECEPTION_RECALL_DECISIONS_JSON: data/research/review-reception-profile/evidence-recall-audit-v1/annotation-decisions/blind-decisions-chatgpt-0016-0030.json
        run: node scripts/validate-review-reception-recall-blind-decisions.mjs
