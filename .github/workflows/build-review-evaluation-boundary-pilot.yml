name: Build review evaluation boundary pilot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-review-evaluation-boundary-pilot.yml'
      - '.review-evaluation-boundary-trigger'

permissions:
  contents: read

concurrency:
  group: review-evaluation-boundary-pilot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_BUCKET_NAME: melosignal-data
      REVIEW_SEGMENT: otome-audio
      REVIEW_BOUNDARY_YEARS: '2023,2024,2025,2026'
      REVIEW_BOUNDARY_MAX_PER_YEAR: '60'
      REVIEW_BOUNDARY_MAX_PER_WORK: '3'
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download frozen otome-audio review chunks from R2
        working-directory: work
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          dir=".tmp/reviews-evaluation/${REVIEW_SEGMENT}"
          mkdir -p "$dir"
          node - <<'NODE' > .tmp/review-boundary-chunk-keys.txt
          const fs=require('fs');
          const segment=process.env.REVIEW_SEGMENT;
          const m=JSON.parse(fs.readFileSync(`data/reviews/manifests/${segment}.json`,'utf8'));
          if(Number(m.processed_target_works||0)<Number(m.source_target_works||0)) throw new Error(`${segment}: crawl incomplete`);
          for(const c of (m.chunks||[]).filter(c=>c.complete&&!c.stopped_reason).sort((a,b)=>Number(a.index)-Number(b.index))) console.log(c.key);
          NODE
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            out="$dir/$(basename "$key")"
            ok=0
            for attempt in 1 2 3; do
              if npx --yes wrangler@latest r2 object get "${R2_BUCKET_NAME}/${key}" --file "$out" --remote >/dev/null; then ok=1; break; fi
              sleep $((attempt * 5))
            done
            [ "$ok" -eq 1 ] || { echo "failed $key" >&2; exit 1; }
          done < .tmp/review-boundary-chunk-keys.txt

      - name: Build rest75 low-rating Gold boundary pool
        working-directory: work
        env:
          REVIEW_CHUNK_DIR: .tmp/reviews-evaluation/otome-audio
          REVIEW_BOUNDARY_OUT: data/research/review-evaluation-boundary-pilot
        run: node scripts/build-review-evaluation-boundary-pilot.mjs

      - name: Verify boundary pool
        working-directory: work
        run: |
          set -euo pipefail
          base="data/research/review-evaluation-boundary-pilot/otome-audio-rest75-low-rating-2023-2024-2025-2026"
          test -s "$base.json"
          test -s "$base.md"
          node - "$base.json" <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(Number(d.selected_count||0)<100) throw new Error(`boundary sample too small: ${d.selected_count}`);
          const years={}; for(const r of d.reviews||[]) years[r.year]=(years[r.year]||0)+1;
          console.log({candidates:d.candidate_count,selected:d.selected_count,years});
          NODE
          if grep -R -E -n 'https?://|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' "$base.md" "$base.json"; then
            echo 'privacy verifier failed' >&2; exit 1
          fi

      - name: Commit boundary pool
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          root=data/research/review-evaluation-boundary-pilot
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$root"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: rest75 low-rating boundary pilot" || exit 0
          git pull --rebase origin main
          git push origin main
