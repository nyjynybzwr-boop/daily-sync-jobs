# one-off PR trigger for research
name: Girls drama touch + texture pilot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/girls-drama-touch-texture-pilot.yml'
  pull_request:
    paths:
      - '.github/workflows/girls-drama-touch-texture-pilot.yml'

permissions:
  contents: write

concurrency:
  group: girls-drama-touch-texture-pilot
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone private source with LFS catalogs
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
          cd work
          git lfs pull --include='data/catalog/full/details.json,data/manga/catalog/full/details.json'
          test "$(head -c 7 data/catalog/full/details.json)" != 'version' || { echo 'audio LFS pointer not hydrated' >&2; exit 1; }
          test "$(head -c 7 data/manga/catalog/full/details.json)" != 'version' || { echo 'manga LFS pointer not hydrated' >&2; exit 1; }
      - name: Install source dependencies
        working-directory: work
        run: |
          npm ci
          npm install --no-save devalue
      - name: Probe girls-drama-touch listing and BJ detail
        working-directory: work
        run: |
          mkdir -p data/research
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import { fetchDlsiteProductPlain } from './scripts/lib/dlsite-fetch-detail.mjs';
          const headers={'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1','Accept-Language':'ja-JP,ja;q=0.9',Accept:'text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'};
          const candidates=[
            'https://www.dlsite.com/girls-drama-touch/works/type/=/work_type_category/audio/page/1',
            'https://www.dlsite.com/girls-drama-touch/works/type/=/work_type_category/drama/page/1',
            'https://www.dlsite.com/girls-drama-touch/works/page/1',
            'https://www.dlsite.com/girls-drama-touch/fsr/=/language/jp/sex_category%5B0%5D/female/work_category%5B0%5D/drama/order%5B0%5D/release_d/options_and_or/and/options%5B0%5D/JPN/per_page/30/page/1/is_tl/1'
          ];
          const clean=s=>String(s||'').replace(/<[^>]+>/g,' ').replace(/&nbsp;/gi,' ').replace(/\s+/g,' ');
          const out={checked_at:new Date().toISOString(),listings:[],detail:null};
          for(const url of candidates){
            const row={url,status:null,bytes:0,source_total_count:null,main_grid:false,product_ids:[],error:null};
            try{
              const res=await fetch(url,{headers,redirect:'follow'}); row.status=res.status;
              const html=await res.text(); row.bytes=Buffer.byteLength(html);
              row.main_grid=/class=(['"])[^'"]*\bn_work_list\b[^'"]*\btype_grid\b[^'"]*\btype_horizontal\b[^'"]*\1/i.test(html);
              const m=clean(html).match(/([\d,]+)\s*件中\s*[\d,]+\s*[-−ー]\s*[\d,]+\s*件目/); if(m)row.source_total_count=Number(m[1].replace(/,/g,''));
              row.product_ids=[...new Set([...html.matchAll(/product_id\/(BJ\d+|RJ\d+|VJ\d+|AJ\d+)/gi)].map(x=>x[1].toUpperCase()))].slice(0,50);
            }catch(e){row.error=String(e?.message||e)}
            out.listings.push(row);
          }
          try{
            const d=await fetchDlsiteProductPlain({product_id:'BJ02431592',url:'https://www.dlsite.com/girls-drama-touch/work/=/product_id/BJ02431592.html',title:'嘘つきコインランドリー'},{timeoutMs:30000});
            out.detail={ok:true,product_id:d.product_id,title:d.title,circle:d.circle,work_type_value:d.work_type_value,work_type_name:d.work_type_name,release_date:d.release_date,sales_count:d.sales_count,price:d.price,rating:d.rating,review_count:d.review_count,voice_actors:d.voice_actors,tags:d.tags,tracks_count:Array.isArray(d.tracks)?d.tracks.length:null,description_chars:String(d.description||'').length,description_long_chars:String(d.description_long||'').length,detail_parser_version:d.detail_parser_version,detail_error:d.detail_error||null};
          }catch(e){out.detail={ok:false,error:String(e?.message||e)}}
          await fs.writeFile('data/research/girls-drama-touch-probe.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE
      - name: Run plot-independent texture pilots
        working-directory: work
        run: |
          node scripts/analyze-literary-texture-pilot.mjs
          node scripts/analyze-literary-texture-pilot-v2.mjs
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drama-touch-texture-research-v2
          path: |
            work/data/research/girls-drama-touch-probe.json
            work/analysis/literary-texture-pilot.json
            work/analysis/literary-texture-pilot-v2.json
          if-no-files-found: warn
          retention-days: 2
