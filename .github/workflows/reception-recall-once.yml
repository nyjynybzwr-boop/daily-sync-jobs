name: One-shot reception recall replay

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/reception-recall-once.yml'
  workflow_dispatch:

concurrency:
  group: reception-recall-replay-once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/nyjynybzwr-boop/dlsite-trend-radar.git" work
          cd work
          printf 'source_head=%s\n' "$(git rev-parse HEAD)"
          test -f data/research/review-reception-profile/evidence-recall-audit-v1/blind-full-review-annotation-packet-v1.json
          test -f data/research/review-reception-profile/evidence-recall-audit-v1/blind-full-review-annotation-decisions-v1.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Repair and persist replay harness
        working-directory: work
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/replay-review-reception-recall-from-frozen-packet.mjs')
          s = p.read_text()

          old_test = """  assert(units.length === 2, 'newline/period split mismatch');\n  assert(units[0].survives_existing_candidate_gate === false && units[0].drop_reason === 'short_lt6', 'short gate mismatch');\n  assert(units[1].survives_existing_candidate_gate === true, 'positive cue gate mismatch');"""
          new_test = """  assert(units.length === 3, 'newline/period split mismatch');\n  assert(units[0].survives_existing_candidate_gate === false && units[0].drop_reason === 'short_lt6', 'short gate mismatch');\n  assert(units[1].survives_existing_candidate_gate === false && units[1].drop_reason === 'short_lt6' && units[2].survives_existing_candidate_gate === true, 'period/newline boundary gate mismatch');"""
          if old_test in s:
              s = s.replace(old_test, new_test, 1)
          elif new_test not in s:
              raise SystemExit('self-test block is neither known-old nor known-current')

          old_span = "  const span = normalize(spanText);"
          new_span = "  const span = normalize(sanitizeText(spanText).replace(/\\n+/g, '。'));"
          if old_span in s:
              s = s.replace(old_span, new_span, 1)
          elif new_span not in s:
              raise SystemExit('span normalization site is neither known-old nor known-current')

          old_width = "  for (let width = 2; width <= MAX_ADJACENT_UNITS; width += 1) {"
          new_width = "  for (let width = 2; width <= units.length; width += 1) {"
          if old_width in s:
              s = s.replace(old_width, new_width, 1)
          elif new_width not in s:
              raise SystemExit('adjacent-window site is neither known-old nor known-current')

          old_err = "errors.push(`${id} signal ${signalIndex + 1}: span cannot be mapped by direct or adjacent-unit replay`);"
          new_err = "errors.push(`${id} signal ${signalIndex + 1}: span cannot be mapped by direct or adjacent-unit replay: ${JSON.stringify(spanText)}`);"
          if old_err in s:
              s = s.replace(old_err, new_err, 1)
          elif new_err not in s:
              raise SystemExit('unmapped-span error site is neither known-old nor known-current')

          marker = "  const cross = buildUnits('聴いているこちらも\\n我慢の限界になりました。');"
          regression = """  const newlineSpanUnits = buildUnits('途中から形勢逆転。\\n彼氏くんに襲われてしまうヒロインちゃんです。');\n  assert(mapSignal(newlineSpanUnits, '途中から形勢逆転。\\n彼氏くんに襲われてしまうヒロインちゃんです。'), 'newline-bearing gold span mapping mismatch');\n  const longSpanText = 'しかし、そのあとのやっていることは普通にやばい。怖い。入籍までしますか?普通。怖いです。怖かった。それが良いのですが。';\n  assert(mapSignal(buildUnits(longSpanText), longSpanText), 'long multi-unit gold span mapping mismatch');\n"""
          if 'newline-bearing gold span mapping mismatch' not in s:
              if marker not in s:
                  raise SystemExit('self-test insertion marker missing')
              s = s.replace(marker, regression + marker, 1)

          p.write_text(s)
          PY
          node --check scripts/replay-review-reception-recall-from-frozen-packet.mjs
          node scripts/replay-review-reception-recall-from-frozen-packet.mjs --self-test
          if ! git diff --quiet -- scripts/replay-review-reception-recall-from-frozen-packet.mjs; then
            bash scripts/ci/push.sh "scripts/replay-review-reception-recall-from-frozen-packet.mjs" "[skip actions] [CF-Pages-Skip] research: repair frozen-span recall replay mapping"
          fi

      - name: Run frozen-packet gate replay
        working-directory: work
        run: |
          set -o pipefail
          node scripts/replay-review-reception-recall-from-frozen-packet.mjs 2>&1 | tee ../reception-replay.log

      - name: Upload replay diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reception-replay-diagnostic
          path: reception-replay.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Validate replay structure and arithmetic
        working-directory: work
        run: |
          set -euo pipefail
          node scripts/validate-review-reception-recall-gate-replay.mjs --self-test
          node scripts/validate-review-reception-recall-gate-replay.mjs

      - name: Bind replay to frozen 320-row gold
        working-directory: work
        run: node scripts/validate-review-reception-recall-gate-replay-source-binding.mjs

      - name: Push replay result to private source
        working-directory: work
        run: |
          set -euo pipefail
          bash scripts/ci/push.sh "data/research/review-reception-profile/evidence-recall-audit-v1/recall-gate-replay-v1.json" "[skip actions] [CF-Pages-Skip] research: materialize frozen-packet reception recall replay"
