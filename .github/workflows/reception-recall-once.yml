name: One-shot reception recall replay

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/reception-recall-once.yml'
  workflow_dispatch:

concurrency:
  group: reception-recall-replay-once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/nyjynybzwr-boop/dlsite-trend-radar.git" work
          cd work
          printf 'source_head=%s\n' "$(git rev-parse HEAD)"
          test -f data/research/review-reception-profile/evidence-recall-audit-v1/blind-full-review-annotation-packet-v1.json
          test -f data/research/review-reception-profile/evidence-recall-audit-v1/blind-full-review-annotation-decisions-v1.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Correct and persist stale replay self-test
        working-directory: work
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/replay-review-reception-recall-from-frozen-packet.mjs')
          s = p.read_text()
          old = """  assert(units.length === 2, 'newline/period split mismatch');\n  assert(units[0].survives_existing_candidate_gate === false && units[0].drop_reason === 'short_lt6', 'short gate mismatch');\n  assert(units[1].survives_existing_candidate_gate === true, 'positive cue gate mismatch');"""
          new = """  assert(units.length === 3, 'newline/period split mismatch');\n  assert(units[0].survives_existing_candidate_gate === false && units[0].drop_reason === 'short_lt6', 'short gate mismatch');\n  assert(units[1].survives_existing_candidate_gate === false && units[1].drop_reason === 'short_lt6' && units[2].survives_existing_candidate_gate === true, 'period/newline boundary gate mismatch');"""
          if old not in s:
              raise SystemExit('stale self-test block not found exactly; refusing broad edit')
          p.write_text(s.replace(old, new, 1))
          PY
          node scripts/replay-review-reception-recall-from-frozen-packet.mjs --self-test
          bash scripts/ci/push.sh "scripts/replay-review-reception-recall-from-frozen-packet.mjs" "[skip actions] [CF-Pages-Skip] research: align recall replay self-test with frozen splitter"

      - name: Run frozen-packet gate replay
        working-directory: work
        run: node scripts/replay-review-reception-recall-from-frozen-packet.mjs

      - name: Validate replay structure and arithmetic
        working-directory: work
        run: |
          set -euo pipefail
          node scripts/validate-review-reception-recall-gate-replay.mjs --self-test
          node scripts/validate-review-reception-recall-gate-replay.mjs

      - name: Bind replay to frozen 320-row gold
        working-directory: work
        run: node scripts/validate-review-reception-recall-gate-replay-source-binding.mjs

      - name: Push replay result to private source
        working-directory: work
        run: |
          set -euo pipefail
          bash scripts/ci/push.sh "data/research/review-reception-profile/evidence-recall-audit-v1/recall-gate-replay-v1.json" "[skip actions] [CF-Pages-Skip] research: materialize frozen-packet reception recall replay"
