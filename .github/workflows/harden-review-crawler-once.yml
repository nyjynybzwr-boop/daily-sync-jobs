name: Harden review crawler once

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/harden-review-crawler-once.yml'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - name: Patch crawler safely
        working-directory: work
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/crawl-reviews-r2-chunk.mjs')
          s=p.read_text()
          old="""      const body = await res.text();
      if (res.status === 403 || res.status === 429) throw new Error(`STOP_HTTP_${res.status} ${target.product_id} page=${page}`);
      if (/アクセスが集中|しばらく時間をおいて|不正なアクセス|Access Denied|Too Many Requests/i.test(body)) {
        throw new Error(`STOP_BLOCK_PAGE ${target.product_id} page=${page}`);
      }
      if (!res.ok) {
        if (res.status >= 500 && attempt < 3) {
          lastError = new Error(`HTTP_${res.status}`);
          await sleep(attempt * 5000);
          continue;
        }
        throw new Error(`HTTP_${res.status}`);
      }
      let json;
      try { json = JSON.parse(body); }
      catch { throw new Error(`INVALID_JSON ${body.slice(0,120)}`); }
"""
          new="""      const body = await res.text();
      if (res.status === 403 || res.status === 429) throw new Error(`STOP_HTTP_${res.status} ${target.product_id} page=${page}`);
      if (!res.ok) {
        if (res.status >= 500 && attempt < 3) {
          lastError = new Error(`HTTP_${res.status}`);
          await sleep(attempt * 5000);
          continue;
        }
        throw new Error(`HTTP_${res.status}`);
      }
      let json;
      try { json = JSON.parse(body); }
      catch {
        if (/アクセスが集中|しばらく時間をおいて|不正なアクセス|Access Denied|Too Many Requests/i.test(body)) {
          throw new Error(`STOP_BLOCK_PAGE ${target.product_id} page=${page}`);
        }
        throw new Error(`INVALID_JSON ${body.slice(0,120)}`);
      }
"""
          if old not in s: raise SystemExit('fetch block patch anchor missing')
          s=s.replace(old,new,1)
          old2="""    const expected = Number(target.expected_review_count || 0);
    const delta = got.reviews.length - expected;
    if (delta !== 0) discrepancies.push({ product_id: target.product_id, expected, fetched: got.reviews.length, delta });
"""
          new2="""    const expectedKnown = target.expected_review_count !== null && target.expected_review_count !== undefined;
    const expected = expectedKnown ? Number(target.expected_review_count || 0) : null;
    const delta = expectedKnown ? got.reviews.length - expected : null;
    if (expectedKnown && delta !== 0) discrepancies.push({ product_id: target.product_id, expected, fetched: got.reviews.length, delta });
"""
          if old2 not in s: raise SystemExit('expected-count patch anchor missing')
          s=s.replace(old2,new2,1)
          s=s.replace("expected_review_count: Number(target.expected_review_count || 0),","expected_review_count: target.expected_review_count == null ? null : Number(target.expected_review_count || 0),",1)
          s=s.replace("is_purchased: String(r.is_purchased ?? '') === '1' || r.is_purchased === true,","is_purchased: ['1','true'].includes(String(r.is_purchased ?? '').toLowerCase()) || r.is_purchased === true,",1)
          s=s.replace("expected_review_count_sum: Number(targetDoc.expected_review_count_sum || 0),\n  chunk_size:","expected_review_count_sum: targetDoc.expected_review_count_sum == null ? null : Number(targetDoc.expected_review_count_sum || 0),\n  review_count_known: targetDoc.review_count_known !== false,\n  chunk_size:",1)
          s=s.replace("expected_review_count_sum: Number(targetDoc.expected_review_count_sum || 0),\n  processed_target_works:","expected_review_count_sum: targetDoc.expected_review_count_sum == null ? null : Number(targetDoc.expected_review_count_sum || 0),\n  review_count_known: targetDoc.review_count_known !== false,\n  processed_target_works:",1)
          p.write_text(s)
          PY
          node --check scripts/crawl-reviews-r2-chunk.mjs
          grep -q 'expectedKnown' scripts/crawl-reviews-r2-chunk.mjs
          grep -q 'STOP_BLOCK_PAGE' scripts/crawl-reviews-r2-chunk.mjs
      - name: Commit patch
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/crawl-reviews-r2-chunk.mjs
          git commit -m '[CF-Pages-Skip] [skip actions] reviews: harden block and unknown-count handling' || exit 0
          git pull --rebase origin main
          git push origin main
