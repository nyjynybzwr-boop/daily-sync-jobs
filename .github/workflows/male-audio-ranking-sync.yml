name: Male audio ranking sync

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/male-audio-ranking-sync.yml'
      - '.github/triggers/male-audio-ranking-now'
  schedule:
    # 03:20 JST. Staggered away from the other DLsite collectors so the
    # conservative per-request throttle does not compete across runners.
    - cron: '20 18 * * *'

concurrency:
  group: male-audio-ranking-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout runner repo
        uses: actions/checkout@v4

      - name: Checkout source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: work
        run: |
          npm ci >/tmp/step.log 2>&1
          npm install --no-save devalue >>/tmp/step.log 2>&1

      - name: Collect and analyze male audio rankings
        id: collect
        working-directory: work
        env:
          NODE_OPTIONS: '--import=./scripts/lib/dlsite-request-throttle.mjs'
        run: |
          set -o pipefail
          mkdir -p ../status
          bash scripts/ci/run-k.sh 2>&1 | tee ../status/male-audio-last.log

      - name: Push male audio ranking data
        working-directory: work
        run: bash scripts/ci/push.sh "data/male/raw data/male/labeled data/male/reports data/male/windows"

      - name: Save diagnostic log
        if: always()
        run: |
          mkdir -p status
          {
            echo
            echo "---"
            echo "finished_at=$(date -u +%FT%TZ)"
            echo "source_head=$(git -C work rev-parse HEAD 2>/dev/null || echo unavailable)"
            echo "job_status=${{ job.status }}"
          } >> status/male-audio-last.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/male-audio-last.log
          git commit -m 'Record male audio ranking sync result' || exit 0
          git pull --rebase origin main
          git push
