name: Review API probe once

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/review-api-probe-once.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe review endpoints
        run: |
          set -euo pipefail
          mkdir -p status
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const H={
            'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1',
            'Accept-Language':'ja-JP,ja;q=0.9',
            Accept:'application/json,text/plain,*/*',
            Referer:'https://www.dlsite.com/'
          };
          const tests=[
            {key:'bl-main-p1',base:'bl',id:'RJ01498915',limit:30,page:1},
            {key:'bl-main-p2',base:'bl',id:'RJ01498915',limit:30,page:2},
            {key:'bl-touch-p1',base:'bl-touch',id:'RJ01498915',limit:30,page:1},
            {key:'girls-p1',base:'girls',id:'RJ01690068',limit:30,page:1},
            {key:'girls-touch-p1',base:'girls-touch',id:'RJ01690068',limit:30,page:1},
            {key:'girls-drama-p1',base:'girls-drama',id:'BJ02431592',limit:30,page:1},
            {key:'girls-drama-touch-p1',base:'girls-drama-touch',id:'BJ02431592',limit:30,page:1},
            {key:'maniax-p1',base:'maniax',id:'RJ01690975',limit:30,page:1},
            {key:'maniax-touch-p1',base:'maniax-touch',id:'RJ01690975',limit:30,page:1}
          ];
          const out={checked_at:new Date().toISOString(),tests:[]};
          for(const t of tests){
            const url=`https://www.dlsite.com/${t.base}/api/review?product_id=${t.id}&limit=${t.limit}&mix_pickup=true&page=${t.page}&order=regist_d&locale=ja_JP`;
            const row={...t,url,status:null,content_type:null,is_success:null,count:null,review_ids:[],review_text_chars:[],sample_titles:[],sample_texts:[],error:null};
            try{
              const res=await fetch(url,{headers:{...H,Referer:`https://www.dlsite.com/${t.base}/work/=/product_id/${t.id}.html`},redirect:'follow'});
              row.status=res.status; row.content_type=res.headers.get('content-type');
              const body=await res.text();
              let j;
              try{j=JSON.parse(body)}catch{row.error=`non-json: ${body.slice(0,180)}`; out.tests.push(row); continue}
              row.is_success=Boolean(j?.is_success);
              const list=Array.isArray(j?.review_list)?j.review_list:[];
              row.count=list.length;
              row.review_ids=list.map(x=>x.member_review_id||null);
              row.review_text_chars=list.map(x=>String(x.review_text||'').length);
              row.sample_titles=list.slice(0,3).map(x=>x.review_title||'');
              row.sample_texts=list.slice(0,3).map(x=>String(x.review_text||'').slice(0,120));
              if(j?.error_msg) row.error=String(j.error_msg);
            }catch(e){row.error=String(e?.message||e)}
            out.tests.push(row);
          }
          await fs.writeFile('status/review-api-probe.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE
      - name: Persist probe
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add status/review-api-probe.json
          git commit -m 'status: review API probe' || exit 0
          git pull --rebase origin main
          git push origin main
