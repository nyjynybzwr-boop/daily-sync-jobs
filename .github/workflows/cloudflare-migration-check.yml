name: Cloudflare migration build check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloudflare-migration-check.yml'

concurrency:
  group: cloudflare-migration-build-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        working-directory: work
        run: npm ci

      - name: Check Cloudflare migration scripts
        working-directory: work
        run: |
          node --check functions/api/nuance-search.js
          node --check scripts/index-cloudflare-nuance.mjs
          node --check scripts/eval-cloudflare-nuance-http.mjs
          node --check scripts/build-hot-search-words.mjs
          node --check scripts/build-bl-manga-catalog-web.mjs
          node --check scripts/attach-manga-dashboard.mjs
          node --check web/media-switch.js
          node --check web/all-fetch-cache.js
          node --check web/all-market-switch.js
          node --check cloudflare/workers/dlsite-relay/src/index.js

      - name: Build full site
        working-directory: work
        run: npm run build:site

      - name: Verify hot search payload
        working-directory: work
        run: |
          test -s site/data/hot-search-words.json
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('site/data/hot-search-words.json','utf8'));for(const m of ['otome','bl'])for(const k of ['play','voice_actor','relationship']){if(!p.markets?.[m]?.[k]?.label)throw new Error(m+' '+k+' missing')}console.log(JSON.stringify(p.markets,null,2))"
          ! grep -q 'homeCommandExamples' site/home-reframe.js
          ! grep -q 'すぐ調べる' site/all-detail.js
          grep -q '今話題のワード' site/all-detail.js

      - name: Verify BL manga catalog
        working-directory: work
        run: |
          set -euo pipefail
          test -s site/data/catalog/manga/bl/summary.json
          test -s site/data/catalog/manga/bl/search-index.json
          test -s site/data/catalog/manga/bl/similar-works.json
          test -s site/data/catalog/manga/bl/build-meta.json
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const summary = JSON.parse(fs.readFileSync('site/data/catalog/manga/bl/summary.json', 'utf8'));
          const index = JSON.parse(fs.readFileSync('site/data/catalog/manga/bl/search-index.json', 'utf8'));
          const meta = JSON.parse(fs.readFileSync('site/data/catalog/manga/bl/build-meta.json', 'utf8'));
          const progress = JSON.parse(fs.readFileSync('data/manga/bl/catalog/index/progress.json', 'utf8'));
          const dashboard = JSON.parse(fs.readFileSync('site/data/dashboard.json', 'utf8'));
          const expected = progress.confirmed_manga_works;
          if (!Number.isInteger(expected) || expected < 10000) throw new Error(`Unexpected confirmed BL manga count: ${expected}`);
          if (progress.pending !== 0 || progress.detail_errors !== 0 || progress.unconfirmed_work_type !== 0) throw new Error(`BL manga source processing incomplete: ${JSON.stringify(progress)}`);
          if (summary.total_works !== expected || index.total_works !== expected || meta.confirmed_manga_works !== expected) {
            throw new Error(`BL manga count mismatch: progress=${expected}, summary=${summary.total_works}, search=${index.total_works}, meta=${meta.confirmed_manga_works}`);
          }
          if (meta.source_entries_processed !== progress.indexed) throw new Error('BL manga source count mismatch');
          if (meta.excluded_non_manga !== progress.excluded_non_manga) throw new Error('BL manga excluded count mismatch');
          if (!dashboard.media?.comic?.bl) throw new Error('BL manga ranking dataset missing from dashboard');
          const bytes = fs.statSync('site/data/catalog/manga/bl/search-index.json').size;
          if (bytes >= 25 * 1024 * 1024) throw new Error(`BL manga search index exceeds Pages 25 MiB limit: ${bytes}`);
          console.log(`BL manga verified: ${expected} confirmed MNG works; excluded=${progress.excluded_non_manga}; search-index=${(bytes/1024/1024).toFixed(1)} MiB`);
          NODE
          grep -q "data/catalog/manga/bl" site/all-fetch-cache.js

      - name: Bundle Pages Functions
        working-directory: work
        run: npx --yes wrangler@latest pages functions build functions --outfile=/tmp/melosignal-pages-worker.js

      - name: Verify bundle
        run: |
          test -s /tmp/melosignal-pages-worker.js
          wc -c /tmp/melosignal-pages-worker.js

      - name: Record successful BL manga site build
        working-directory: work
        run: |
          set -euo pipefail
          SOURCE_SHA=$(git rev-parse HEAD)
          mkdir -p analysis
          SOURCE_SHA="$SOURCE_SHA" node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const summary = JSON.parse(fs.readFileSync('site/data/catalog/manga/bl/summary.json', 'utf8'));
          const meta = JSON.parse(fs.readFileSync('site/data/catalog/manga/bl/build-meta.json', 'utf8'));
          const indexPath = 'site/data/catalog/manga/bl/search-index.json';
          const marker = {
            checked_at: new Date().toISOString(),
            checked_source_sha: process.env.SOURCE_SHA,
            status: 'success',
            bl_manga_total_works: summary.total_works,
            excluded_non_manga: meta.excluded_non_manga,
            search_index_bytes: fs.statSync(indexPath).size,
            dashboard_bl_comic: true,
            pages_function_bundle: true,
          };
          fs.writeFileSync('analysis/bl-manga-site-build-check.json', JSON.stringify(marker, null, 2) + '\n');
          console.log(JSON.stringify(marker));
          NODE
          bash scripts/ci/push.sh "analysis/bl-manga-site-build-check.json"
