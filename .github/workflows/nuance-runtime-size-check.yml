name: Nuance runtime size check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nuance-runtime-size-check.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install safe Transformers runtime
        working-directory: work
        run: |
          npm ci
          npm pkg set 'overrides.sharp=0.35.3'
          npm install --no-save @huggingface/transformers@3.8.1
      - name: Report runtime sizes
        working-directory: work
        run: |
          echo '--- total node_modules ---'
          du -sh node_modules
          echo '--- key packages ---'
          du -sh node_modules/@huggingface/transformers node_modules/onnxruntime-node node_modules/onnxruntime-web node_modules/sharp node_modules/@img 2>/dev/null || true
          echo '--- onnx linux x64 ---'
          find node_modules/onnxruntime-node/bin/napi-v3/linux/x64 -type f -printf '%s %p\n' 2>/dev/null | sort -nr
          echo '--- all onnx web wasm/mjs ---'
          find node_modules/onnxruntime-web -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -25
          echo '--- safe runtime audit ---'
          npm audit --omit=dev
