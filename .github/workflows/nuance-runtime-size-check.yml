name: Nuance runtime size check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nuance-runtime-size-check.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install safe Transformers runtime
        working-directory: work
        run: |
          npm ci
          npm pkg set 'overrides.sharp=0.35.3'
          npm install --no-save @huggingface/transformers@3.8.1
      - name: Verify Node text pipeline without web runtime
        working-directory: work
        run: |
          rm -rf node_modules/onnxruntime-web
          node --input-type=module <<'NODE'
          import { pipeline } from '@huggingface/transformers';
          const p=await pipeline('feature-extraction','Xenova/multilingual-e5-small',{dtype:'q8'});
          const out=await p('query: 男が興奮する',{pooling:'mean',normalize:true});
          if(out.dims.at(-1)!==384)throw new Error(`bad dims ${out.dims}`);
          console.log(`without onnxruntime-web: ok ${out.dims.join('x')}`);
          await p.dispose?.();
          NODE
      - name: Verify text pipeline without image runtime
        working-directory: work
        run: |
          rm -rf node_modules/sharp node_modules/@img
          node --input-type=module <<'NODE'
          import { pipeline } from '@huggingface/transformers';
          const p=await pipeline('feature-extraction','Xenova/multilingual-e5-small',{dtype:'q8'});
          const out=await p('query: 男が興奮する',{pooling:'mean',normalize:true});
          if(out.dims.at(-1)!==384)throw new Error(`bad dims ${out.dims}`);
          console.log(`without web/sharp/@img: ok ${out.dims.join('x')}`);
          await p.dispose?.();
          NODE
      - name: Report remaining runtime size
        working-directory: work
        run: |
          rm -f node_modules/onnxruntime-node/bin/napi-v3/linux/x64/libonnxruntime_providers_cuda.so
          rm -f node_modules/onnxruntime-node/bin/napi-v3/linux/x64/libonnxruntime_providers_tensorrt.so
          rm -rf node_modules/onnxruntime-node/bin/napi-v3/darwin node_modules/onnxruntime-node/bin/napi-v3/win32 node_modules/onnxruntime-node/bin/napi-v3/linux/arm64
          du -sh node_modules
          du -sh node_modules/@huggingface/transformers node_modules/onnxruntime-node 2>/dev/null || true
