name: Fix BL role target split

on:
  push:
    paths:
      - '.github/workflows/fix-bl-role-target-split.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Clone private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: git clone --quiet --depth=1 "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Install dependencies
        working-directory: work
        run: npm ci

      - name: Repair BL split labels with full diagnostics
        id: repair
        continue-on-error: true
        env:
          DLSITE_BASE: bl-touch
          DATA_ROOT: data/bl
          SOURCE_TAG: dlsite-bl-touch
        run: |
          set -o pipefail
          (
            set -euo pipefail
            echo '=== PATCH ==='
            cd work
            python ../scripts/apply-bl-role-target-split-v4.py

            echo '=== TEST ==='
            npm test

            echo '=== REBUILD DAILY/WINDOW/YEARLY ==='
            node scripts/analyze-trends.mjs
            node scripts/analyze-window-rankings.mjs
            node scripts/analyze-yearly.mjs

            echo '=== AUDIT TOP30 ==='
            node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { detectLabels } from './scripts/lib/analysis-core.mjs';

          const dir = 'data/bl/raw';
          const latest = fs.readdirSync(dir).filter((x) => x.endsWith('.json')).sort().at(-1);
          const raw = JSON.parse(fs.readFileSync(path.join(dir, latest), 'utf8'));
          const items = Array.isArray(raw) ? raw : (raw.items || raw.works || raw.ranking || raw.products || []);
          const bases = ['乳首責め', 'アナル責め', 'フェラ'];
          const counts = Object.fromEntries(bases.map((base) => [base, { 受け: 0, 攻め: 0, 受け攻め不明: 0, bare: 0, total: 0 }]));

          for (const item of items.slice(0, 30)) {
            const labels = detectLabels(item).map((x) => x.label);
            for (const base of bases) {
              for (const role of ['受け', '攻め', '受け攻め不明']) {
                if (labels.includes(`${base}(${role})`)) {
                  counts[base][role] += 1;
                  counts[base].total += 1;
                }
              }
              if (labels.includes(base)) counts[base].bare += 1;
            }
          }

          const out = {
            checked_at: new Date().toISOString(),
            source: latest,
            top_n: Math.min(30, items.length),
            counts,
          };
          fs.mkdirSync('../status', { recursive: true });
          fs.writeFileSync('../status/bl-role-target-split.json', JSON.stringify(out, null, 2) + '\n');
          console.log(JSON.stringify(out, null, 2));

          for (const [base, row] of Object.entries(counts)) {
            if (row.bare !== 0) throw new Error(`${base}: bare label remains in Top30`);
          }
          NODE

            echo '=== BUILD SITE ==='
            npm run build:site

            echo '=== COMMIT PRIVATE ==='
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add scripts/lib/analysis-core.mjs config/label-taxonomy.json scripts/test-label-regression.mjs data/bl
            if ! git diff --cached --quiet; then
              git commit -m 'Fix BL play labels to uke seme unknown split'
            fi
            for i in 1 2 3 4 5; do
              if git pull --rebase origin main && git push origin main; then
                echo '=== PRIVATE PUSH OK ==='
                exit 0
              fi
              sleep $((i * 5))
            done
            exit 1
          ) 2>&1 | tee /tmp/bl-role-target-split.log

      - name: Publish audit and diagnostic
        if: always()
        env:
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
        run: |
          set -euo pipefail
          mkdir -p status
          if [ ! -f status/bl-role-target-split.json ]; then
            printf '{"status":"failed_before_audit"}\n' > status/bl-role-target-split.json
          fi
          printf 'outcome=%s\n--- log ---\n' "$REPAIR_OUTCOME" > status/bl-role-target-split-diagnostic.txt
          cat /tmp/bl-role-target-split.log >> status/bl-role-target-split-diagnostic.txt 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add status/bl-role-target-split.json status/bl-role-target-split-diagnostic.txt
          git commit -m 'status: BL role target split diagnostic' || exit 0
          git pull --rebase origin main
          git push origin main
