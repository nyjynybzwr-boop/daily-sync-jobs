name: Fix BL role target split

on:
  push:
    paths:
      - '.github/workflows/fix-bl-role-target-split.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct fixture expectation
        run: python scripts/correct-bl-role-split-test.py
      - name: Clone private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: git clone --quiet --depth=1 "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - name: Install private dependencies
        working-directory: work
        run: npm ci
      - name: Apply fix, test, rebuild and push
        id: repair
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/fix-bl-role-target-split.sh 2>&1 | tee /tmp/bl-role-fix-final.log
      - name: Publish final diagnostic
        if: always()
        env:
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
        run: |
          mkdir -p status
          printf 'outcome=%s\n--- log ---\n' "$REPAIR_OUTCOME" > status/bl-role-target-split-final.txt
          cat /tmp/bl-role-fix-final.log >> status/bl-role-target-split-final.txt 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add status/bl-role-target-split-final.txt status/bl-role-target-split.json 2>/dev/null || true
          git commit -m 'status: BL role split final' || exit 0
          git pull --rebase origin main
          git push origin main
