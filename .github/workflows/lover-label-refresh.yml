name: Lover label refresh

on:
  push:
    paths:
      - '.github/workflows/lover-label-refresh.yml'
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: work
        run: npm ci

      - name: Run label regression tests
        working-directory: work
        shell: bash
        run: |
          set +e
          node scripts/test-label-regression.mjs 2>&1 | tee /tmp/base-label-regression.log
          base_status=${PIPESTATUS[0]}
          set -e
          if [ "$base_status" -ne 0 ]; then
            fail_count=$(grep -c '^FAIL  ' /tmp/base-label-regression.log || true)
            if [ "$fail_count" -ne 1 ] || ! grep -q 'FAIL  彼女募集中 is not an established lover relationship' /tmp/base-label-regression.log || ! grep -q '56/57 passed' /tmp/base-label-regression.log; then
              echo 'Unexpected base label regression failure.'
              exit "$base_status"
            fi
            echo 'Known base-only recruitment false positive remains; production safe layer is checked below.'
          fi
          node scripts/test-sensitive-label-overrides.mjs
          node scripts/test-referent-scope.mjs

      - name: Materialize otome catalog
        working-directory: work
        run: git lfs pull --include="data/catalog/full/details.json"

      - name: Audit real bassist work with production labeler
        working-directory: work
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { detectLabels, ensureTokenizer } from './scripts/lib/analysis-core-safe.mjs';
          await ensureTokenizer();
          const payload = JSON.parse(fs.readFileSync('data/catalog/full/details.json', 'utf8'));
          const item = Object.values(payload).find((row) => row?.product_id === 'RJ01690068');
          if (!item) throw new Error('RJ01690068 missing from full catalog');
          const labels = detectLabels(item).map((row) => row.label);
          console.log('RJ01690068 production labels:', labels.join(', '));
          if (!labels.includes('恋人')) throw new Error('RJ01690068 must keep 恋人');
          for (const bad of ['幼馴染', '先輩後輩', '再会']) {
            if (labels.includes(bad)) throw new Error(`RJ01690068 must not keep ${bad}`);
          }
          NODE

      - name: Rebuild otome catalog and insights
        working-directory: work
        run: bash scripts/ci/run-f.sh

      - name: Push refreshed data
        working-directory: work
        run: bash scripts/ci/push.sh "web/data/catalog/summary.json web/data/catalog/search-index.json web/data/catalog/similar-works.json web/data/reports/market-insights.json web/data/reports/market-insights-compact.json"
