name: Build review evaluation target mapping packet

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-review-evaluation-target-mapping-packet.yml'
      - '.review-evaluation-target-mapping-trigger'

permissions:
  contents: read

concurrency:
  group: review-evaluation-target-mapping-packet
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PILOT_DIR: data/research/review-evaluation-pilot/otome-audio-otome-audio-review-evaluation-semantic-pilot-v1
      TAXONOMY_FILE: data/research/review-evaluation-spec/shared-mechanism-taxonomy-v1.json
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build canonical evidence decision view
        working-directory: work
        env:
          REVIEW_EVAL_PILOT_DIR: ${{ env.PILOT_DIR }}
          REVIEW_MECHANISM_TAXONOMY_JSON: ${{ env.TAXONOMY_FILE }}
        run: node scripts/build-canonical-review-evaluation-evidence-decisions.mjs

      - name: Build target mapping packet
        working-directory: work
        env:
          REVIEW_EVAL_PILOT_DIR: ${{ env.PILOT_DIR }}
          REVIEW_MECHANISM_TAXONOMY_JSON: ${{ env.TAXONOMY_FILE }}
        run: node scripts/build-review-evaluation-target-mapping-packet.mjs

      - name: Validate target mapping packet
        working-directory: work
        run: |
          set -euo pipefail
          for f in \
            canonical-review-evaluation-evidence-decisions.jsonl \
            canonical-review-evaluation-evidence-decisions-summary.json \
            target-mapping-packet.json \
            target-mapping-packet.md; do
            test -s "$PILOT_DIR/$f" || { echo "missing $f" >&2; exit 1; }
          done
          node - "$PILOT_DIR/canonical-review-evaluation-evidence-decisions-summary.json" "$PILOT_DIR/target-mapping-packet.json" <<'NODE'
          const fs=require('fs');
          const canonical=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const p=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          if(canonical.status!=='canonical_derived_view_preserves_source_review_history') throw new Error(`unexpected canonical status ${canonical.status}`);
          if((canonical.output_counts?.rows??0)<800) throw new Error(`too few canonical evidence decisions: ${canonical.output_counts?.rows}`);
          if(Object.keys(canonical.mechanism_counts||{}).length!==15) throw new Error(`expected all 15 mechanisms in canonical view, got ${Object.keys(canonical.mechanism_counts||{}).length}`);
          if(p.schema_version!==2||p.status!=='human_review_target_mapping_packet_not_taxonomy') throw new Error(`unexpected packet ${p.schema_version}/${p.status}`);
          if(p.mechanism_source_mode!=='canonical_evidence_decision_view') throw new Error(`packet did not use canonical evidence view: ${p.mechanism_source_mode}`);
          if(p.candidate_registry_status!=='candidate_registry_not_canonical') throw new Error(`unexpected registry status ${p.candidate_registry_status}`);
          if(p.source_counts?.evidence_rows!==7223) throw new Error(`expected 7223 evidence rows, got ${p.source_counts?.evidence_rows}`);
          if((p.summary?.general_target_cluster_candidates??0)<70) throw new Error(`too few semantic target candidates: ${p.summary?.general_target_cluster_candidates}`);
          if((p.summary?.play_target_seed_count??0)<16) throw new Error(`too few play seeds: ${p.summary?.play_target_seed_count}`);
          if(p.summary?.strict_play_target_rows!==629) throw new Error(`expected 629 strict play rows, got ${p.summary?.strict_play_target_rows}`);
          if((p.summary?.candidate_registry_family_count??0)<10||(p.summary?.candidate_registry_target_count??0)<50) throw new Error(`candidate registry unexpectedly small: ${p.summary?.candidate_registry_family_count}/${p.summary?.candidate_registry_target_count}`);
          if(!Array.isArray(p.general_target_candidates)||p.general_target_candidates.length!==p.summary.general_target_cluster_candidates) throw new Error('general target candidate count mismatch');
          if(!p.general_target_candidates.some(c=>(c.target_review_flags||[]).includes('texture_sound_overlap_review'))) throw new Error('expected at least one texture/sound overlap review flag');
          if(!Array.isArray(p.target_design_contract)||p.target_design_contract.length<8) throw new Error('target design contract missing');
          console.log({canonical_rows:canonical.output_counts.rows,canonical_mechanisms:Object.keys(canonical.mechanism_counts||{}).length,general:p.summary.general_target_cluster_candidates,quality:p.summary.quality_status_counts,flags:p.summary.target_review_flag_counts,play_seeds:p.summary.play_target_seed_count,strict_play_rows:p.summary.strict_play_target_rows,registry:[p.summary.candidate_registry_family_count,p.summary.candidate_registry_target_count]});
          NODE

      - name: Commit target mapping outputs
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            "$PILOT_DIR/canonical-review-evaluation-evidence-decisions.jsonl" \
            "$PILOT_DIR/canonical-review-evaluation-evidence-decisions-summary.json" \
            "$PILOT_DIR/target-mapping-packet.json" \
            "$PILOT_DIR/target-mapping-packet.md"
          if git diff --cached --quiet; then
            echo 'no target mapping changes to commit'
            exit 0
          fi
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: target mapping packet"
          for attempt in 1 2 3 4 5 6; do
            echo "push attempt $attempt"
            git fetch origin main
            git rebase origin/main
            if git push origin main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo 'failed to push target mapping outputs after retries' >&2
          exit 1
