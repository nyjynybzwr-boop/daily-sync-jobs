name: Male ranking sync

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/male-ranking-sync.yml'
  schedule:
    - cron: '20 16 * * *'

concurrency:
  group: sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: work
        run: npm ci >/tmp/step.log 2>&1

      - name: Collect and analyze male audio rankings
        working-directory: work
        run: bash scripts/ci/run-k.sh

      - name: Collect and analyze male manga rankings
        working-directory: work
        run: bash scripts/ci/run-l.sh

      - name: Push male ranking snapshots and analysis
        working-directory: work
        run: bash scripts/ci/push.sh "data/male/raw data/male/labeled data/male/reports data/male/windows data/manga/male/raw data/manga/male/labeled data/manga/male/reports data/manga/male/windows"
