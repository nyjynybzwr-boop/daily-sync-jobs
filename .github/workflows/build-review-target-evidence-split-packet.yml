name: Build review target evidence split packet

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-review-target-evidence-split-packet.yml'

permissions:
  contents: read

concurrency:
  group: build-review-target-evidence-split-packet
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build target evidence split packet
        working-directory: work
        run: node scripts/build-review-evaluation-target-evidence-split-packet.mjs

      - name: Build cluster-preserving review batches
        working-directory: work
        run: node scripts/build-review-evaluation-target-evidence-review-batches.mjs

      - name: Verify packet and batches
        working-directory: work
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const base='data/research/review-evaluation-pilot/otome-audio-otome-audio-review-evaluation-semantic-pilot-v1';
          const s=JSON.parse(fs.readFileSync(`${base}/target-evidence-split-packet-summary.json`,'utf8'));
          const t=JSON.parse(fs.readFileSync(`${base}/target-evidence-split-decisions.template.json`,'utf8'));
          const i=JSON.parse(fs.readFileSync(`${base}/target-evidence-review-batches/index.json`,'utf8'));
          if(s.unresolved_clusters!==15) throw new Error(`expected 15 unresolved clusters, got ${s.unresolved_clusters}`);
          if(!s.assignment_rows||!s.unique_evidence) throw new Error(`empty split packet ${JSON.stringify(s)}`);
          if(t.decisions.length!==s.assignment_rows) throw new Error(`template mismatch ${t.decisions.length} != ${s.assignment_rows}`);
          if(i.total_rows!==s.assignment_rows||i.total_clusters!==15||i.batch_count!==5) throw new Error(`batch index mismatch ${JSON.stringify(i)}`);
          if(i.batches.some(b=>!b.row_count)) throw new Error('empty review batch');
          console.log({summary:s,batches:i.batches});
          NODE

      - name: Finalize reviewed target evidence when all five decision batches exist
        working-directory: work
        run: |
          set -euo pipefail
          base='data/research/review-evaluation-pilot/otome-audio-otome-audio-review-evaluation-semantic-pilot-v1/target-evidence-review-batches'
          for n in 001 002 003 004 005; do
            if [ ! -f "$base/target-evidence-decisions-batch-$n.json" ]; then
              echo "reviewed target evidence batches incomplete; packet generation only"
              exit 0
            fi
          done
          node scripts/finalize-review-evaluation-target-evidence-decisions.mjs
          node scripts/build-canonical-review-evaluation-target-evidence-view.mjs
          node scripts/build-review-evaluation-work-target-mechanism-view.mjs

      - name: Verify final target views when present
        working-directory: work
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const base='data/research/review-evaluation-pilot/otome-audio-otome-audio-review-evaluation-semantic-pilot-v1';
          const p=`${base}/target-evidence-decisions-summary.json`;
          if(!fs.existsSync(p)){ console.log('final target decisions not present yet; skip final verification'); process.exit(0); }
          const d=JSON.parse(fs.readFileSync(p,'utf8'));
          const t=JSON.parse(fs.readFileSync(`${base}/canonical-review-evaluation-target-evidence-summary.json`,'utf8'));
          const w=JSON.parse(fs.readFileSync(`${base}/work-target-mechanism-summary.json`,'utf8'));
          if(!d.complete||d.decision_rows!==221||d.unique_evidence!==221) throw new Error(`target decisions incomplete ${JSON.stringify(d)}`);
          if(t.output_counts.with_any_target<=0||t.output_counts.with_exact_target<=0) throw new Error(`canonical target view empty ${JSON.stringify(t.output_counts)}`);
          if(w.output_counts.works<=0||w.output_counts.fact_rows<=0) throw new Error(`work view empty ${JSON.stringify(w.output_counts)}`);
          console.log(JSON.stringify({decisions:d,canonical_target:t.output_counts,work_view:w.output_counts},null,2));
          NODE

      - name: Commit packet, review batches, and final views
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          base='data/research/review-evaluation-pilot/otome-audio-otome-audio-review-evaluation-semantic-pilot-v1'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            "$base/target-evidence-split-packet.json" \
            "$base/target-evidence-split-packet.jsonl" \
            "$base/target-evidence-split-decisions.template.json" \
            "$base/target-evidence-split-packet-summary.json" \
            "$base/target-evidence-review-batches"
          for f in \
            target-evidence-decisions.json \
            target-evidence-decisions.jsonl \
            target-evidence-decisions-summary.json \
            canonical-review-evaluation-target-evidence.jsonl \
            canonical-review-evaluation-target-evidence-summary.json \
            review-evaluation-facts.jsonl \
            work-target-mechanism-summary.jsonl \
            work-target-mechanism-summary.json; do
            [ -f "$base/$f" ] && git add "$base/$f"
          done
          if git diff --cached --quiet; then echo 'no target evidence changes'; exit 0; fi
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: finalize target evidence and work view"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'failed to push target evidence outputs after retries' >&2
          exit 1
