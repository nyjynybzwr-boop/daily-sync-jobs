name: Export review reading packet

on:
  workflow_dispatch:
    inputs:
      segment:
        description: 'Review segment'
        required: true
        type: choice
        options:
          - otome-audio
          - bl-audio
          - otome-manga
          - bl-manga
          - male-audio
          - male-manga
          - girls-drama
        default: otome-audio
      packet_name:
        description: 'Packet directory name'
        required: true
        default: 'otome-audio-2023-2026-hit-balanced'
      years:
        description: 'Comma-separated release years'
        required: true
        default: '2023,2024,2025,2026'
      works_per_stratum:
        description: 'Works per year / stratum'
        required: true
        default: '4'
      reviews_per_work:
        description: 'Reviews sampled per work'
        required: true
        default: '8'
      work_ids:
        description: 'Optional comma-separated product ids; overrides cohort selection'
        required: false
        default: ''
  push:
    paths:
      - '.github/workflows/export-review-reading-packet.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_BUCKET_NAME: melosignal-data
      REVIEW_SEGMENT: ${{ inputs.segment || 'otome-audio' }}
      REVIEW_PACKET_NAME: ${{ inputs.packet_name || 'otome-audio-2023-2026-hit-balanced' }}
      REVIEW_YEARS: ${{ inputs.years || '2023,2024,2025,2026' }}
      REVIEW_WORKS_PER_STRATUM: ${{ inputs.works_per_stratum || '4' }}
      REVIEW_REVIEWS_PER_WORK: ${{ inputs.reviews_per_work || '8' }}
      REVIEW_WORK_IDS: ${{ inputs.work_ids || '' }}
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download frozen review chunks from R2
        working-directory: work
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          dir=".tmp/reviews-reading/${REVIEW_SEGMENT}"
          mkdir -p "$dir"
          node - <<'NODE' > .tmp/review-reading-chunk-keys.txt
          const fs=require('fs');
          const segment=process.env.REVIEW_SEGMENT;
          const m=JSON.parse(fs.readFileSync(`data/reviews/manifests/${segment}.json`,'utf8'));
          if(Number(m.processed_target_works||0)<Number(m.source_target_works||0)){
            throw new Error(`${segment}: review crawl incomplete ${m.processed_target_works}/${m.source_target_works}`);
          }
          const chunks=(m.chunks||[]).filter(c=>c.complete&&!c.stopped_reason).sort((a,b)=>Number(a.index)-Number(b.index));
          if(!chunks.length)throw new Error(`${segment}: no complete chunks`);
          for(const c of chunks)console.log(c.key);
          NODE
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            out="$dir/$(basename "$key")"
            echo "download $key"
            ok=0
            for attempt in 1 2 3; do
              if npx --yes wrangler@latest r2 object get "${R2_BUCKET_NAME}/${key}" --file "$out" --remote >/dev/null; then ok=1; break; fi
              sleep $((attempt * 5))
            done
            [ "$ok" -eq 1 ] || { echo "failed to download $key" >&2; exit 1; }
          done < .tmp/review-reading-chunk-keys.txt

      - name: Build anonymized reading packet
        working-directory: work
        env:
          REVIEW_CHUNK_DIR: .tmp/reviews-reading/${{ inputs.segment || 'otome-audio' }}
        run: node scripts/export-review-reading-packet.mjs

      - name: Verify packet privacy guardrails
        working-directory: work
        run: |
          set -euo pipefail
          dir="data/research/review-reading-packets/${REVIEW_PACKET_NAME}"
          test -f "$dir/manifest.json"
          ! grep -R -E 'member_review_id|review_id["`:]|https?://|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' "$dir" --exclude='manifest.json' || { echo 'privacy guard failed' >&2; exit 1; }
          node - <<'NODE'
          const fs=require('fs');
          const p=`data/research/review-reading-packets/${process.env.REVIEW_PACKET_NAME}/manifest.json`;
          const m=JSON.parse(fs.readFileSync(p,'utf8'));
          if(!m.private_research_only) throw new Error('private_research_only missing');
          if(!m.selected_work_count||!m.selected_review_count) throw new Error('empty packet');
          console.log({works:m.selected_work_count,reviews:m.selected_review_count,files:m.files});
          NODE

      - name: Commit reading packet to private source
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          dir="data/research/review-reading-packets/${REVIEW_PACKET_NAME}"
          git add "$dir"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: add reading packet ${REVIEW_PACKET_NAME}" || exit 0
          git pull --rebase origin main
          git push origin main
