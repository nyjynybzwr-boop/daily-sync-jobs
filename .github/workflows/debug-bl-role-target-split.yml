name: Debug BL role target split

on:
  push:
    paths:
      - '.github/triggers/bl-role-target-split-debug-v1'

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clone private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: git clone --quiet --depth=1 "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - name: Install private dependencies
        working-directory: work
        run: npm ci
      - name: Run repair with captured output
        id: repair
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/fix-bl-role-target-split.sh 2>&1 | tee /tmp/bl-role-fix.log
      - name: Publish diagnostic log
        if: always()
        env:
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
        run: |
          mkdir -p status
          {
            echo "outcome=$REPAIR_OUTCOME"
            echo "--- log ---"
            cat /tmp/bl-role-fix.log 2>/dev/null || true
          } > status/bl-role-target-split-debug.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add status/bl-role-target-split-debug.txt
          git commit -m 'status: BL role split diagnostic' || exit 0
          git pull --rebase origin main
          git push origin main
