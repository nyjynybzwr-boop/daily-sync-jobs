name: Market insights semantic pair cleanup once

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/market-insights-semantic-filter-once.yml'

concurrency:
  group: market-insights-semantic-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Remove semantically redundant pairs
        working-directory: work
        run: |
          set -euo pipefail
          node scripts/filter-market-insight-pairs.mjs --market=otome
          node scripts/filter-market-insight-pairs.mjs --market=bl

      - name: Regression checks
        working-directory: work
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const bl=JSON.parse(fs.readFileSync('web/data/reports/bl/market-insights-compact.json','utf8'));
          const bad=[['兄','弟'],['しつけ','調教'],['ショタ','少年']];
          for(const [a,b] of bad){
            if(bl.notable_pairs.some(x=>(x.label_a===a&&x.label_b===b)||(x.label_a===b&&x.label_b===a))) throw new Error(`still present: ${a} x ${b}`);
          }
          if(!bl.notable_pairs.length) throw new Error('BL notable pairs empty');
          console.log('BL top pairs after cleanup:', bl.notable_pairs.slice(0,10).map(x=>`${x.label_a} × ${x.label_b}`).join(' / '));
          NODE

      - name: Push cleaned static insight data
        working-directory: work
        run: |
          set -euo pipefail
          bash scripts/ci/push.sh "web/data/reports/market-insights.json web/data/reports/market-insights-compact.json web/data/reports/bl/market-insights.json web/data/reports/bl/market-insights-compact.json"
