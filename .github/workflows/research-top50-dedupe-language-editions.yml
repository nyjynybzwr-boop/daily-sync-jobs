name: Research Top50 language dedupe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-top50-dedupe-language-editions.yml'
      - 'scripts/research-patch-top50-dedupe.py'
      - 'scripts/research-validate-top50-dedupe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correct-2026:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Clone private research repo
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --depth=1 "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" "$RUNNER_TEMP/source"

      - name: Patch and persist collector
        run: |
          cd "$RUNNER_TEMP/source"
          python "$GITHUB_WORKSPACE/scripts/research-patch-top50-dedupe.py"
          node --check scripts/backfill-release-year-sales-top50.mjs
          git config user.name research-sync-bot
          git config user.email research-sync-bot@users.noreply.github.com
          git add scripts/backfill-release-year-sales-top50.mjs
          git commit -m "research: dedupe language editions in release-year Top50" || true
          git pull --rebase origin main
          git push origin main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          cd "$RUNNER_TEMP/source"
          npm ci
          npm install --no-save playwright devalue
          npx playwright install --with-deps chromium

      - name: Recollect 2026
        env:
          YEARS: '2026'
          TARGET_COUNT: '50'
          RANKING_SCAN_LIMIT: '200'
          MAX_RANKING_PAGES: '10'
          RANKING_MAX_ATTEMPTS: '4'
          DETAIL_DELAY_MS: '800'
          PAGE_DELAY_MS: '1000'
          DETAIL_MAX_ATTEMPTS: '4'
          DETAIL_RETRY_DELAY_MS: '1500'
          AS_OF_DATE: '2026-08-29'
        run: |
          cd "$RUNNER_TEMP/source"
          DATA_ROOT="$RUNNER_TEMP/corrected" node scripts/backfill-release-year-sales-top50.mjs

      - name: Validate and persist corrected 2026 raw
        run: |
          cd "$RUNNER_TEMP/source"
          CORRECTED="$RUNNER_TEMP/corrected/raw/2026-current.json" python "$GITHUB_WORKSPACE/scripts/research-validate-top50-dedupe.py"
          cp "$RUNNER_TEMP/corrected/raw/2026-current.json" data/research/otome-audio-release-year-sales-top50/raw/2026-current.json
          git add data/research/otome-audio-release-year-sales-top50/raw/2026-current.json
          git commit -m "research: correct 2026 Top50 to work-level cohort"
          git pull --rebase origin main
          git push origin main

      - name: Upload corrected cohort
        uses: actions/upload-artifact@v4
        with:
          name: corrected-release-year-top50-2026
          path: ${{ runner.temp }}/corrected
          retention-days: 2
