name: Cross market production build

on:
  push:
    paths:
      - '.github/workflows/cross-market-build.yml'
  workflow_dispatch:
  schedule:
    - cron: '25 20 * * *'

concurrency:
  group: cross-market-production-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: work
        run: npm ci

      - name: Materialize audio and manga catalogs
        working-directory: work
        run: git lfs pull --include="data/catalog/full/details.json,data/manga/catalog/full/details.json"

      - name: Build lead lag signals
        working-directory: work
        run: node scripts/run-cross-leadlag.mjs

      - name: Validate production signals
        working-directory: work
        run: |
          node - <<'NODE'
          const x=require('./data/cross/otome-leadlag.json');
          if(x.schema_version!==2) throw new Error('unexpected lead/lag schema');
          if((x.coverage?.analyzed_labels||0)<50) throw new Error('too few analyzed labels');
          if((x.coverage?.directional_signals||0)<1) throw new Error('no directional signals');
          const all=[...(x.directions?.audio_to_comic||[]),...(x.directions?.comic_to_audio||[])];
          if(all.some(r=>!['high','medium'].includes(r.confidence))) throw new Error('unpublished confidence band leaked');
          if(all.some(r=>!(r.event_total>=6))) throw new Error('weak event count leaked');
          if(all.some(r=>r.confidence==='high' && Math.min(r.audio_works||0,r.comic_works||0)<50)) throw new Error('high confidence lacks sample support');
          console.log(JSON.stringify({period:x.period,coverage:x.coverage,status_counts:x.status_counts,next:{audio_to_comic:x.next_wave.audio_to_comic.map(r=>r.label),comic_to_audio:x.next_wave.comic_to_audio.map(r=>r.label)}},null,2));
          NODE

      - name: Verify site build with merged signals
        working-directory: work
        run: npm run build:site

      - name: Push lead lag data to private main
        working-directory: work
        run: bash scripts/ci/push.sh "data/cross/otome-leadlag.json"
