name: Nuance v8 finalize existing shard run

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nuance-v8-finalize-shard-run.yml'

concurrency:
  group: nuance-v8-finalize-existing-shards
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SHARD_RUN_ID: '31999655302'
      SOURCE_SHA: '6c6d6553cae3fd4604979f9db310d7834274f695'
    steps:
      - name: Wait for all eight shard artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SHARD_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name | startswith("nuance-v8-shard-"))] | length')
            echo "shard artifacts: ${count}/8"
            if [ "$count" -ge 8 ]; then exit 0; fi
            sleep 10
          done
          echo 'Timed out waiting for shard artifacts' >&2
          exit 1
      - name: Checkout latest private main
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - name: Verify pinned source is an ancestor
        working-directory: work
        run: git merge-base --is-ancestor "$SOURCE_SHA" HEAD
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install safe runtime and run regressions
        working-directory: work
        run: |
          npm ci
          npm audit --omit=dev
          npm test
      - name: Materialize otome catalog
        working-directory: work
        run: git lfs pull --include="data/catalog/full/details.json"
      - name: Download all shard artifacts from source run
        uses: actions/download-artifact@v4
        with:
          pattern: nuance-v8-shard-*
          path: work/artifacts/nuance-v8-shards
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: 31999655302
      - name: Finalize exact production bytes and evaluate
        working-directory: work
        env:
          SHARD_COUNT: '8'
        run: node scripts/finalize-nuance-v8-shards-final.mjs
      - name: Enforce signed-int8 parity and integrity gates
        working-directory: work
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ref=JSON.parse(fs.readFileSync('analysis/nuance-search-v8-eval.json','utf8'));
          const prod=JSON.parse(fs.readFileSync('analysis/nuance-search-v8-production-eval.json','utf8'));
          const refById=new Map(ref.cases.map(x=>[x.id,x]));
          for(const row of prod.cases){
            const baseline=refById.get(row.id);
            if(!baseline||!Number.isInteger(baseline.rerank_rank))throw new Error(`missing float baseline: ${row.id}`);
            const maxRank=Math.max(20,baseline.rerank_rank*4);
            if(!Number.isInteger(row.rank)||row.rank>maxRank)throw new Error(`parity gate failed: ${row.id} prod=#${row.rank} float=#${baseline.rerank_rank} max=#${maxRank}`);
            console.log(`parity ok: ${row.id} prod=#${row.rank} float=#${baseline.rerank_rank}`);
          }
          if(prod.metrics.top10_rate<0.6)throw new Error(`top10 too low: ${prod.metrics.top10_rate}`);
          if(prod.metrics.top50_rate<0.9)throw new Error(`top50 too low: ${prod.metrics.top50_rate}`);
          if(prod.metrics.top200_rate<1)throw new Error(`top200 must be 1: ${prod.metrics.top200_rate}`);
          const meta=JSON.parse(fs.readFileSync('api/data/nuance-v8-meta.json','utf8'));
          const bytes=fs.statSync('api/data/nuance-v8-vectors.bin').size;
          if(meta.source_sha!==process.env.SOURCE_SHA)throw new Error(`source SHA mismatch: ${meta.source_sha}`);
          if(meta.total_works<13000)throw new Error(`too few works: ${meta.total_works}`);
          if(meta.total_scenes<meta.total_works*2)throw new Error(`too few scenes: ${meta.total_scenes}`);
          if(bytes!==meta.total_scenes*meta.dimensions)throw new Error(`vector byte mismatch: ${bytes}`);
          console.log(`quality ok: ${JSON.stringify(prod.metrics)}`);
          console.log(`index ok: works=${meta.total_works} scenes=${meta.total_scenes} dims=${meta.dimensions} bytes=${bytes}`);
          NODE
      - name: Preserve validated outputs
        uses: actions/upload-artifact@v4
        with:
          name: nuance-v8-final-validated
          path: |
            work/api/data/nuance-v8-meta.json
            work/api/data/nuance-v8-vectors.bin
            work/analysis/nuance-search-v8-production-eval.json
          retention-days: 1
      - name: Push validated index to latest private main
        working-directory: work
        run: bash scripts/ci/push.sh "api/data/nuance-v8-meta.json api/data/nuance-v8-vectors.bin analysis/nuance-search-v8-production-eval.json"
