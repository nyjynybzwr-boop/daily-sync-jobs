name: Nuance v8 Vercel runtime check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nuance-v8-vercel-runtime-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe production nuance API
        run: |
          node --input-type=module <<'NODE'
          const production='https://dlsite-trend-radar.vercel.app';
          const root=await fetch(production,{redirect:'follow',signal:AbortSignal.timeout(30000)});
          console.log(`production root -> ${root.status} final=${root.url}`);
          if(!root.ok)throw new Error(`production root HTTP ${root.status}`);

          async function api(q,market){
            const u=new URL('/api/nuance-search',production);
            u.searchParams.set('q',q);u.searchParams.set('market',market);
            const t=Date.now();
            const r=await fetch(u,{redirect:'follow',signal:AbortSignal.timeout(90000)});
            const text=await r.text();
            console.log(`${market} production -> ${r.status} ${Date.now()-t}ms final=${r.url}`);
            if(!r.ok)throw new Error(`${market} live HTTP ${r.status}: ${text.slice(0,800)}`);
            let p;try{p=JSON.parse(text);}catch{throw new Error(`${market} response was not JSON: ${text.slice(0,300)}`);}
            if(!Array.isArray(p.results)||p.results.length!==30)throw new Error(`${market} bad result count ${p.results?.length}`);
            console.log(`${market} live ok works=${p.total_works} results=${p.results.length} top=${p.results[0]?.product_id}`);
            return p;
          }
          const otome=await api('男が目の前でオナニーを見せつけて、だんだん我慢できなくなって襲ってくる','otome');
          if(otome.total_works<13000)throw new Error(`live otome works too low ${otome.total_works}`);
          const gold=otome.results.find(x=>x.product_id==='RJ01066791');
          if(!gold||gold.rank>20)throw new Error(`live otome gold regressed: ${gold?.rank}`);
          console.log(`live otome gold RJ01066791 #${gold.rank}`);
          const bl=await api('相手に触られて男が余裕をなくして喘ぐ','bl');
          if(bl.total_works<2000)throw new Error(`live BL works too low ${bl.total_works}`);
          NODE
