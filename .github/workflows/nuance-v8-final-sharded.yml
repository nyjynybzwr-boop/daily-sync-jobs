name: Nuance v8 weekly production indexes

on:
  workflow_dispatch:
  schedule:
    # Sunday 03:30 JST (Saturday 18:30 UTC)
    - cron: '30 18 * * 6'

concurrency:
  group: nuance-v8-weekly-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Pin private main
        id: source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          sha=$(git ls-remote "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" refs/heads/main | cut -f1)
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinned private source: $sha"

  validate:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout pinned source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --quiet "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
          cd work && git checkout --quiet --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source once
        working-directory: work
        run: |
          npm ci
          npm audit --omit=dev
          npm test
          node scripts/check-web-syntax.mjs

  shard:
    needs: [prepare, validate]
    strategy:
      fail-fast: true
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pinned source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --quiet "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
          cd work && git checkout --quiet --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build shard
        working-directory: work
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: '8'
          EMBED_BATCH: '256'
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          npm ci
          git lfs pull --include="data/catalog/full/details.json"
          node scripts/build-nuance-v8-shard-final.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: nuance-v8-shard-${{ matrix.shard }}
          path: work/artifacts/nuance-v8-shards/
          if-no-files-found: error
          retention-days: 1

  bl:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pinned source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --quiet "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
          cd work && git checkout --quiet --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify BL index
        working-directory: work
        env:
          EMBED_BATCH: '256'
        run: |
          npm ci
          git lfs pull --include="data/bl/catalog/full/details.json"
          node scripts/build-nuance-search-v8-index-bl-final.mjs
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('api/data/nuance-v8-bl-meta.json','utf8'));
          const bytes=fs.statSync('api/data/nuance-v8-bl-vectors.bin').size;
          if(m.total_works<2000||m.total_scenes<m.total_works*2||bytes!==m.total_scenes*m.dimensions)throw new Error('BL index integrity failed');
          console.log(`BL index ok: works=${m.total_works} scenes=${m.total_scenes}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: nuance-v8-bl-index
          path: |
            work/api/data/nuance-v8-bl-meta.json
            work/api/data/nuance-v8-bl-vectors.bin
          if-no-files-found: error
          retention-days: 1

  finalize:
    needs: [prepare, validate, shard, bl]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          git clone --quiet "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
          cd work && git checkout --quiet --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare finalizer
        working-directory: work
        run: |
          npm ci
          npm audit --omit=dev
          git lfs pull --include="data/catalog/full/details.json"
      - uses: actions/download-artifact@v4
        with:
          pattern: nuance-v8-shard-*
          path: work/artifacts/nuance-v8-shards
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: nuance-v8-bl-index
          path: work/api/data
      - name: Finalize and evaluate
        working-directory: work
        env:
          SHARD_COUNT: '8'
        run: node scripts/finalize-nuance-v8-shards-final.mjs
      - name: Quality gates
        working-directory: work
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const ref=JSON.parse(fs.readFileSync('analysis/nuance-search-v8-eval.json','utf8'));
          const prod=JSON.parse(fs.readFileSync('analysis/nuance-search-v8-production-eval.json','utf8'));
          const refById=new Map(ref.cases.map(x=>[x.id,x]));
          for(const row of prod.cases){
            const base=refById.get(row.id);
            if(!base||!Number.isInteger(base.rerank_rank))throw new Error(`missing float baseline: ${row.id}`);
            const max=Math.max(20,base.rerank_rank*4);
            if(!Number.isInteger(row.rank)||row.rank>max)throw new Error(`parity failed: ${row.id} #${row.rank} > #${max}`);
          }
          const gates=[
            ['gold-rj01066791-show-masturbation',20],
            ['gold-rj01200426-plain-self-touch',15],
            ['gold-rj01093983-passive-touch',24],
            ['gold-rj01093983-active-partner-touch',7],
          ];
          const byId=new Map(prod.cases.map(x=>[x.id,x]));
          for(const [id,max] of gates){
            const row=byId.get(id);
            if(!row||!Number.isInteger(row.rank)||row.rank>max)throw new Error(`required gate failed: ${id} #${row?.rank} > #${max}`);
            console.log(`gate ok: ${id} #${row.rank} <= #${max}`);
          }
          if(prod.metrics.top10_rate<0.6||prod.metrics.top50_rate<0.9||prod.metrics.top200_rate<1)throw new Error(`aggregate quality failed: ${JSON.stringify(prod.metrics)}`);
          const m=JSON.parse(fs.readFileSync('api/data/nuance-v8-meta.json','utf8'));
          const bytes=fs.statSync('api/data/nuance-v8-vectors.bin').size;
          if(m.source_sha!==process.env.SOURCE_SHA||m.total_works<13000||m.total_scenes<m.total_works*2||bytes!==m.total_scenes*m.dimensions)throw new Error('otome integrity failed');
          const bl=JSON.parse(fs.readFileSync('api/data/nuance-v8-bl-meta.json','utf8'));
          const blBytes=fs.statSync('api/data/nuance-v8-bl-vectors.bin').size;
          if(bl.total_works<2000||bl.total_scenes<bl.total_works*2||blBytes!==bl.total_scenes*bl.dimensions)throw new Error('BL integrity failed');
          console.log(`quality ok: top10=${prod.metrics.top10_rate} top50=${prod.metrics.top50_rate} top200=${prod.metrics.top200_rate}`);
          NODE
      - name: Preserve validated outputs and rebase to latest main
        working-directory: work
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          mkdir -p /tmp/nuance/api/data /tmp/nuance/analysis
          cp api/data/nuance-v8-meta.json api/data/nuance-v8-vectors.bin api/data/nuance-v8-bl-meta.json api/data/nuance-v8-bl-vectors.bin /tmp/nuance/api/data/
          cp analysis/nuance-search-v8-production-eval.json /tmp/nuance/analysis/
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git checkout --quiet -B main origin/main
          cp /tmp/nuance/api/data/* api/data/
          cp /tmp/nuance/analysis/* analysis/
          npm ci
          npm audit --omit=dev
          npm test
          node scripts/check-web-syntax.mjs
          node --check api/nuance-search.js
          node --check web/all-nuance-search.js
      - name: Smoke-test latest API
        working-directory: work
        run: |
          node --input-type=module <<'NODE'
          import handler from './api/nuance-search.js';
          async function call(q,market){
            let statusCode=200,payload=null;
            const req={method:'GET',query:{q,market}};
            const res={status(c){statusCode=c;return this;},setHeader(){return this;},json(x){payload=x;return this;}};
            await handler(req,res);
            if(statusCode!==200||!Array.isArray(payload?.results)||payload.results.length<10)throw new Error(`${market} API smoke failed`);
            return payload;
          }
          const otome=await call('女の子にちんぽを触られて、男が余裕をなくして喘いでしまう','otome');
          const passiveRank=otome.results.findIndex(x=>x.product_id==='RJ01093983')+1;
          if(!passiveRank||passiveRank>24)throw new Error(`otome smoke failed: RJ01093983 rank=${passiveRank||'missing'}`);
          console.log(`otome passive-touch smoke: RJ01093983 #${passiveRank}`);
          const bl=await call('男が相手の反応に釣られて余裕をなくして喘ぐ','bl');
          if(Number(bl.total_works)<2000)throw new Error('BL smoke catalog too small');
          console.log('weekly production API smoke passed');
          NODE
      - name: Push validated indexes
        working-directory: work
        run: bash scripts/ci/push.sh "api/data/nuance-v8-meta.json api/data/nuance-v8-vectors.bin api/data/nuance-v8-bl-meta.json api/data/nuance-v8-bl-vectors.bin analysis/nuance-search-v8-production-eval.json"
