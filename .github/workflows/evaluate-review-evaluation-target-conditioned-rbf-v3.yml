name: Evaluate review evaluation target-conditioned RBF v3

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/evaluate-review-evaluation-target-conditioned-rbf-v3.yml'
      - '.review-evaluation-target-conditioned-rbf-v3-trigger'

permissions:
  contents: read

concurrency:
  group: review-evaluation-target-conditioned-rbf-v3
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install classifier dependencies
        run: python -m pip install --disable-pip-version-check numpy scikit-learn

      - name: Download frozen v2 E5 embeddings
        working-directory: work
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          d=.tmp/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/v2
          mkdir -p "$d"
          key=review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/training-v2/training-embeddings-v2.jsonl.gz
          npx --yes wrangler@latest r2 object get "melosignal-data/${key}" --file "$d/training-embeddings-v2.jsonl.gz" --remote >/dev/null
          gzip -dc "$d/training-embeddings-v2.jsonl.gz" > "$d/training-embeddings-v2.jsonl"
          node - <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const b='data/research/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc';
          const m=JSON.parse(fs.readFileSync(`${b}/training-embedding-manifest-v2.json`));
          const f='.tmp/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/v2/training-embeddings-v2.jsonl.gz';
          const sha=crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          if(m.rows!==3528||m.vector_dimension!==384||m.r2?.compressed_sha256!==sha)throw new Error('v2 embedding provenance mismatch');
          if(m.model?.paid_api!==false)throw new Error('paid embedding forbidden');
          console.log({rows:m.rows,dimension:m.vector_dimension,sha});
          NODE

      - name: Evaluate target-conditioned RBF
        working-directory: work
        run: |
          set -euo pipefail
          python -m py_compile scripts/evaluate-review-evaluation-target-conditioned-rbf-v3.py
          python scripts/evaluate-review-evaluation-target-conditioned-rbf-v3.py

      - name: Verify sealed shadow contract
        working-directory: work
        run: |
          set -euo pipefail
          r=data/research/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/target-conditioned-rbf-development-report-v3.json
          node - "$r" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2]));
          if(r.shadow_v1_opened!==false)throw new Error('shadow seal violated');
          if(r.paid_api!==false)throw new Error('paid API contract violated');
          console.log({status:r.status,selected:r.development.selected_aggregate,gates:r.gates});
          NODE
          if grep -n -E 'shadow-calibration/.*/(human-gold|predictions)|shadow-predictions|human-gold' scripts/evaluate-review-evaluation-target-conditioned-rbf-v3.py; then
            echo 'v3 evaluator references sealed shadow labels' >&2
            exit 1
          fi

      - name: Commit v3 development report
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          r=data/research/review-evaluation-classifier/rev-eval-46255c55e8d1c5dc/target-conditioned-rbf-development-report-v3.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$r"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: evaluate target-conditioned RBF v3" || exit 0
          git pull --rebase origin main
          git push origin main
