name: Review R2 safe continuous

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build review target manifests once
      - Build girls-drama review targets once
    types:
      - completed

concurrency:
  group: review-r2-safe-continuous
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  crawl:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_BUCKET_NAME: melosignal-data
      REVIEW_CHUNK_SIZE: '100'
      REVIEW_DELAY_MS: '1000'
      REVIEW_R2_MAX_BYTES: '5368709120'

    steps:
      - name: Require credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check all seven frozen v2 target manifests are ready
        id: targets
        working-directory: work
        run: |
          set -euo pipefail
          segments=(otome-audio bl-audio otome-manga bl-manga male-audio male-manga girls-drama)
          ready=1
          for segment in "${segments[@]}"; do
            f="data/reviews/targets/${segment}.json"
            if [ ! -s "$f" ]; then
              echo "Target not ready yet: $f"
              ready=0
              continue
            fi
            version="$(node -e "const t=require('./${f}');process.stdout.write(String(Number(t.schema_version||0)))")"
            if [ "$version" -lt 2 ]; then
              echo "Target is still pre-v2 and must not be crawled: $segment schema=$version"
              ready=0
            fi
          done
          if [ "$ready" -ne 1 ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node - <<'NODE'
          const fs=require('fs');
          const segments=['otome-audio','bl-audio','otome-manga','bl-manga','male-audio','male-manga','girls-drama'];
          for(const segment of segments){
            const t=JSON.parse(fs.readFileSync(`data/reviews/targets/${segment}.json`,'utf8'));
            if(!Array.isArray(t.targets))throw new Error(`${segment}: targets missing`);
            if(!t.generated_at)throw new Error(`${segment}: generated_at missing; cannot freeze snapshot`);
            console.log(segment,{schema:t.schema_version,source:t.source_work_count,targets:t.targets.length,unknown:t.unknown_review_count_target_count??0,generated_at:t.generated_at});
          }
          NODE
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Crawl serially and persist every completed chunk
        if: steps.targets.outputs.ready == 'true'
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail

          retry() {
            local attempt=1 max=3
            until "$@"; do
              if [ "$attempt" -ge "$max" ]; then
                echo "Command failed after $attempt attempts: $*" >&2
                return 1
              fi
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }

          # The very first production run is a 100-work pilot. Once that pilot
          # is persisted and validated, later runs process six 100-work chunks.
          initial=1
          for segment in otome-audio bl-audio otome-manga bl-manga male-audio male-manga girls-drama; do
            if [ -s "data/reviews/progress/${segment}.json" ]; then initial=0; break; fi
          done
          if [ "$initial" -eq 1 ]; then budget=1; else budget=6; fi
          echo "review run chunk budget=$budget initial=$initial"

          for batch in $(seq 1 "$budget"); do
            choice="$(node - <<'NODE'
          const fs=require('fs');
          const segments=['otome-audio','bl-audio','otome-manga','bl-manga','male-audio','male-manga','girls-drama'];
          const size=100;
          for(const segment of segments){
            const t=JSON.parse(fs.readFileSync(`data/reviews/targets/${segment}.json`,'utf8'));
            const pfile=`data/reviews/progress/${segment}.json`;
            const p=fs.existsSync(pfile)?JSON.parse(fs.readFileSync(pfile,'utf8')):null;
            if(p?.stopped_reason)throw new Error(`${segment}: stopped_reason=${p.stopped_reason}`);
            if(p?.target_generated_at && p.target_generated_at!==t.generated_at)throw new Error(`${segment}: target snapshot changed after crawl started`);
            const next=Number(p?.next_chunk||0);
            if(next*size<t.targets.length){
              process.stdout.write(`${segment}|${next}|${t.targets.length}`);
              process.exit(0);
            }
          }
          process.stdout.write('DONE');
          NODE
            )"
            if [ "$choice" = 'DONE' ]; then
              echo 'All review target segments complete.'
              break
            fi
            IFS='|' read -r segment chunk_index total <<< "$choice"
            echo "=== review batch $batch/$budget segment=$segment chunk=$chunk_index targets=$total ==="

            set +e
            REVIEW_SEGMENT="$segment" REVIEW_CHUNK_INDEX="$chunk_index" REVIEW_CHUNK_SIZE="$REVIEW_CHUNK_SIZE" REVIEW_DELAY_MS="$REVIEW_DELAY_MS" REVIEW_R2_MAX_BYTES="$REVIEW_R2_MAX_BYTES" node scripts/crawl-reviews-r2-chunk.mjs
            crawler_rc=$?
            set -e

            padded="$(printf '%05d' "$chunk_index")"
            chunk=".tmp/reviews/${segment}/chunk-${padded}.json.gz"
            progress="data/reviews/progress/${segment}.json"
            manifest="data/reviews/manifests/${segment}.json"
            test -s "$chunk"
            test -s "$progress"
            test -s "$manifest"

            retry npx --yes wrangler@latest r2 object put "${R2_BUCKET_NAME}/reviews/${segment}/raw/chunk-${padded}.json.gz" --file "$chunk" --remote
            retry npx --yes wrangler@latest r2 object put "${R2_BUCKET_NAME}/reviews/${segment}/manifest.json" --file "$manifest" --remote
            retry bash scripts/ci/push.sh "$progress $manifest" "[CF-Pages-Skip] [skip actions] reviews ${segment} R2 progress"

            node - <<NODE
          const p=require('./${progress}');
          const c=p.last_chunk||{};
          const attempted=Number(c.attempted_target_works||0);
          const errors=Number(c.error_count||0);
          if(c.stopped_reason||p.stopped_reason)throw new Error(`review safety stop: ${c.stopped_reason||p.stopped_reason}`);
          if(!c.complete)throw new Error(`review chunk incomplete: ${segment}/${chunk_index}`);
          if(attempted>=20 && errors/attempted>=0.20)throw new Error(`systemic review API failure: ${errors}/${attempted}`);
          if(errors)console.warn(`continuing past ${errors} per-work review error(s)`);
          if(Number(c.discrepancy_count||0))console.warn(`review-count snapshot discrepancies: ${c.discrepancy_count}`);
          console.log({segment:p.segment,processed:p.processed_target_works,pending:p.pending_target_works,fetched_reviews:p.fetched_reviews,api_requests:p.api_requests,errors,discrepancies:c.discrepancy_count||0,stored_bytes:p.stored_bytes,target_generated_at:p.target_generated_at});
          NODE

            if [ "$crawler_rc" -ne 0 ]; then
              echo "Crawler exited $crawler_rc after progress was safely persisted." >&2
              exit "$crawler_rc"
            fi
          done

      - name: Continue until every review target is done
        if: steps.targets.outputs.ready == 'true'
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          state="$(node - <<'NODE'
          const fs=require('fs');
          const segments=['otome-audio','bl-audio','otome-manga','bl-manga','male-audio','male-manga','girls-drama'];
          const size=100;
          let pending=0;
          for(const segment of segments){
            const t=JSON.parse(fs.readFileSync(`data/reviews/targets/${segment}.json`,'utf8'));
            const pfile=`data/reviews/progress/${segment}.json`;
            const p=fs.existsSync(pfile)?JSON.parse(fs.readFileSync(pfile,'utf8')):null;
            if(p?.stopped_reason){console.log(`STOP|${segment}|${p.stopped_reason}`);process.exit(0)}
            if(p?.target_generated_at && p.target_generated_at!==t.generated_at){console.log(`STOP|${segment}|target snapshot changed`);process.exit(0)}
            const next=Number(p?.next_chunk||0);
            if(next*size<t.targets.length)pending++;
          }
          console.log(pending?`PENDING|${pending}`:'DONE|0');
          NODE
          )"
          echo "review continuation state=$state"
          case "$state" in
            STOP\|*) echo 'Not chaining after an explicit safety stop or snapshot change.' ;;
            PENDING\|*) gh workflow run review-r2-safe-continuous.yml --repo "$GITHUB_REPOSITORY" ;;
            DONE\|*) echo 'All review targets complete.' ;;
            *) echo "Unexpected continuation state: $state" >&2; exit 2 ;;
          esac
