name: Review evaluation mixed decision batches

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/review-evaluation-mixed-decision-batches.yml'

permissions:
  contents: read

concurrency:
  group: review-evaluation-mixed-decision-batches
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PILOT_DIR: data/research/review-evaluation-pilot/otome-audio-otome-audio-review-evaluation-semantic-pilot-v1
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate all decision batches
        working-directory: work
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=("$PILOT_DIR"/mixed-evidence-split-decisions.batch-*.json)
          test ${#files[@]} -gt 0 || { echo 'no decision batches' >&2; exit 1; }
          for f in "${files[@]}"; do
            echo "validating $f"
            REVIEW_MIXED_SPLIT_BATCH_JSON="$f" REVIEW_EVAL_PILOT_DIR="$PILOT_DIR" node scripts/validate-review-evaluation-mixed-split-decision-batch.mjs
          done

      - name: Merge reviewed batches
        working-directory: work
        env:
          REVIEW_EVAL_PILOT_DIR: ${{ env.PILOT_DIR }}
        run: node scripts/merge-review-evaluation-mixed-split-decision-batches.mjs

      - name: Apply duplicate reconciliation overrides
        working-directory: work
        env:
          REVIEW_EVAL_PILOT_DIR: ${{ env.PILOT_DIR }}
        run: |
          set -euo pipefail
          if test -s "$PILOT_DIR/mixed-evidence-split-decisions.json" && test -s "$PILOT_DIR/mixed-evidence-split-decision-overrides.json"; then
            node scripts/apply-review-evaluation-mixed-decision-overrides.mjs
          fi

      - name: Audit duplicate evidence decisions
        working-directory: work
        env:
          REVIEW_EVAL_PILOT_DIR: ${{ env.PILOT_DIR }}
        run: |
          set -euo pipefail
          if test -s "$PILOT_DIR/mixed-evidence-split-decisions.json"; then
            node scripts/audit-review-evaluation-duplicate-evidence-decisions.mjs
          else
            echo 'final mixed decisions not complete yet; skipping duplicate audit'
          fi

      - name: Summarize canonical evidence mechanisms
        working-directory: work
        env:
          REVIEW_EVAL_PILOT_DIR: ${{ env.PILOT_DIR }}
        run: |
          set -euo pipefail
          if test -s "$PILOT_DIR/mixed-evidence-decisions-by-evidence.json"; then
            node scripts/summarize-review-evaluation-canonical-evidence.mjs
          fi

      - name: Build provisional mechanism promotion packet
        working-directory: work
        env:
          REVIEW_EVAL_PILOT_DIR: ${{ env.PILOT_DIR }}
        run: |
          set -euo pipefail
          if test -s "$PILOT_DIR/mixed-evidence-decisions-by-evidence.json"; then
            node scripts/build-review-evaluation-provisional-mechanism-promotion-packet.mjs
          fi

      - name: Build full provisional axis audit packet
        working-directory: work
        env:
          REVIEW_EVAL_PILOT_DIR: ${{ env.PILOT_DIR }}
        run: |
          set -euo pipefail
          if test -s "$PILOT_DIR/mixed-evidence-decisions-by-evidence.json"; then
            node scripts/build-review-evaluation-provisional-axis-audit-packet.mjs
          fi

      - name: Commit coverage and reviewed decisions
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$PILOT_DIR/mixed-evidence-split-batch-coverage.json" \
                  "$PILOT_DIR/mixed-evidence-split-decisions.partial.json"
          for f in \
            mixed-evidence-split-decisions.json \
            mixed-evidence-duplicate-audit.json \
            mixed-evidence-duplicate-audit.md \
            mixed-evidence-decisions-by-evidence.json \
            mixed-evidence-canonical-summary.json \
            mixed-evidence-canonical-summary.md \
            provisional-mechanism-promotion-packet.json \
            provisional-mechanism-promotion-packet.md \
            provisional-axis-audit-packet.json \
            provisional-axis-audit-packet.md \
            provisional-axis-audit-decisions.template.json; do
            if test -f "$PILOT_DIR/$f"; then git add "$PILOT_DIR/$f"; fi
          done
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: canonical mixed evidence decisions" || exit 0
          git pull --rebase origin main
          git push origin main
