name: Transformers web runtime Node probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transformers-web-node-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: work
        run: npm ci
      - name: Probe injected web/WASM build under Node
        working-directory: work
        run: |
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import {pathToFileURL} from 'node:url';
          const ort=await import('onnxruntime-web');
          globalThis[Symbol.for('onnxruntime')]=ort;
          const mod=await import(pathToFileURL(path.resolve('node_modules/@huggingface/transformers/dist/transformers.web.js')).href);
          const {pipeline,env}=mod;
          env.allowLocalModels=false;
          env.useBrowserCache=false;
          console.log('web import ok', typeof pipeline, typeof ort.InferenceSession?.create);
          const t=Date.now();
          const extractor=await pipeline('feature-extraction','Xenova/multilingual-e5-small',{dtype:'q8'});
          console.log('pipeline loaded',Date.now()-t);
          const tensor=await extractor('query: 男が興奮して喘ぐ',{pooling:'mean',normalize:true});
          console.log('embedding ok',tensor.dims, tensor.data.length, Date.now()-t);
          if(tensor.data.length!==384)throw new Error(`unexpected embedding dim ${tensor.data.length}`);
          NODE
