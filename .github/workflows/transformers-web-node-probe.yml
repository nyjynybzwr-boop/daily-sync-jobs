name: ONNX native runtime file probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transformers-web-node-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: work
        run: npm ci
      - name: Inspect ONNX native files and linkage
        working-directory: work
        run: |
          echo '--- onnxruntime-node files ---'
          find node_modules/onnxruntime-node/bin -type f -printf '%p %s bytes\n' | sort
          echo '--- disk usage ---'
          du -ah node_modules/onnxruntime-node/bin | sort -h | tail -30
          echo '--- binding linkage ---'
          binding=$(find node_modules/onnxruntime-node/bin -name 'onnxruntime_binding.node' | head -1)
          test -n "$binding"
          echo "binding=$binding"
          ldd "$binding" || true
          echo '--- direct imports ---'
          node --input-type=module <<'NODE'
          for(const name of ['onnxruntime-node','@huggingface/transformers','sharp']){
            const t=Date.now();
            try{const m=await import(name);console.log(name,'OK',Date.now()-t,typeof m.InferenceSession?.create,typeof m.pipeline,typeof m.default);}
            catch(e){console.log(name,'FAIL',e.code,e.message);process.exitCode=1;}
          }
          NODE
