name: Refresh production dashboard in R2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-production-dashboard-r2.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_BUCKET_NAME: melosignal-data
      PROD_BASE: https://dlsite-trend-radar.pages.dev
    steps:
      - name: Require credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID missing' >&2; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN missing' >&2; exit 1; }

      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: work
        run: npm ci

      - name: Build latest dashboard
        working-directory: work
        run: npm run build:site

      - name: Verify obvious garbage is gone but valid candidate remains
        working-directory: work
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const p='site/data/dashboard.json';
          const raw=fs.readFileSync(p,'utf8');
          const forbidden=['秘密','見えた','プレイ傾向','＜応募方法＞','＜応募〆切＞'];
          const still=forbidden.filter(w=>raw.includes(w));
          if(still.length) throw new Error('garbage still present in built dashboard: '+still.join(', '));
          if(!raw.includes('マン汁指摘')) throw new Error('expected valid candidate マン汁指摘 is missing');
          const j=JSON.parse(raw);
          console.log({generated_at:j.generated_at,bytes:fs.statSync(p).size,valid_candidate:'マン汁指摘',removed:forbidden});
          NODE

      - name: Upload dashboard to R2
        working-directory: work
        run: |
          set -euo pipefail
          npx --yes wrangler@latest r2 object put "${R2_BUCKET_NAME}/data/dashboard.json" --file site/data/dashboard.json --remote

      - name: Verify production now serves refreshed dashboard
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 18); do
            echo "production verify attempt $attempt/18"
            if curl -LfsS --max-time 60 "$PROD_BASE/data/dashboard.json?refresh=$(date +%s)" -o /tmp/prod-dashboard.json; then
              if node - <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync('/tmp/prod-dashboard.json','utf8');
          const forbidden=['秘密','見えた','プレイ傾向','＜応募方法＞','＜応募〆切＞'];
          const still=forbidden.filter(w=>raw.includes(w));
          if(still.length){ console.error({still}); process.exit(2); }
          if(!raw.includes('マン汁指摘')){ console.error('マン汁指摘 missing'); process.exit(3); }
          const j=JSON.parse(raw);
          console.log({generated_at:j.generated_at,verified:true});
          NODE
              then ok=1; break; fi
            fi
            sleep 10
          done
          test "$ok" = 1

      - name: Record verified production state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" statusrepo
          cd statusrepo
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p status
          PROD_JSON=/tmp/prod-dashboard.json node - <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync(process.env.PROD_JSON,'utf8');
          const j=JSON.parse(raw);
          const words=['マン汁指摘','秘密','見えた','プレイ傾向','＜応募方法＞','＜応募〆切＞'];
          const out={
            checked_at:new Date().toISOString(),
            production:'https://dlsite-trend-radar.pages.dev',
            dashboard_generated_at:j.generated_at||null,
            word_presence:Object.fromEntries(words.map(w=>[w,raw.includes(w)])),
            verified:true
          };
          fs.writeFileSync('status/production-dashboard-refresh.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE
          git add status/production-dashboard-refresh.json
          git commit -m 'status: production dashboard refresh'
          git push origin main
