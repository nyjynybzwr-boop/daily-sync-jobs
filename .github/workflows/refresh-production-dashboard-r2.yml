name: Refresh production dashboard in R2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-production-dashboard-r2.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_BUCKET_NAME: melosignal-data
      PROD_BASE: https://dlsite-trend-radar.pages.dev

    steps:
      - name: Require credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: work
        run: npm ci

      - name: Reanalyse all four markets from raw data
        working-directory: work
        run: |
          set -euo pipefail
          for root in data data/bl data/manga data/manga/bl; do
            echo "=== analyze $root ==="
            DATA_ROOT="$root" node scripts/analyze-trends.mjs
          done

      - name: Verify regenerated reports contain no confirmed garbage
        working-directory: work
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const specs={
            otome_audio:{path:'data/reports/latest.json',reject:['秘密','見えた','プレイ傾向','＜応募方法＞','＜応募〆切＞','プレイ属性','精液']},
            bl_audio:{path:'data/bl/reports/latest.json',reject:['秘密','見えた','プレイ傾向','＜応募方法＞','＜応募〆切＞']},
            otome_manga:{path:'data/manga/reports/latest.json',reject:['秘密','見えた','プレイ傾向','＜応募方法＞','＜応募〆切＞','プレイ','白棒修正','白線修正','黒線修正','本文','実在の人物','+他','＋他','作者X','イラストや漫画','表紙デザイン','両方あります','キャラ紹介など','歳。入社3年目','一方']},
            bl_manga:{path:'data/manga/bl/reports/latest.json',reject:['秘密','見えた','プレイ傾向','＜応募方法＞','＜応募〆切＞','憂瓏']},
          };
          function buckets(report){
            const promoted=[...(report.auto_candidates?.tags||[]),...(report.auto_candidates?.phrases||[])];
            const promotedLabels=new Set(promoted.map(x=>x.label));
            const pending=[...(report.pending_candidates?.tags||[]),...(report.pending_candidates?.phrases||[])].filter(x=>!promotedLabels.has(x.label));
            const pendingLabels=new Set(pending.map(x=>x.label));
            const today=[...(report.emerging_tags||[]),...(report.emerging_phrases||[])].filter(x=>!promotedLabels.has(x.label)&&!pendingLabels.has(x.label));
            return {promoted:promoted.map(x=>x.label),watching:[...pending,...today].map(x=>x.label)};
          }
          const out={};
          for(const [name,s] of Object.entries(specs)){
            const report=JSON.parse(fs.readFileSync(s.path,'utf8'));
            const b=buckets(report);
            const all=[...b.promoted,...b.watching];
            const bad=s.reject.filter(x=>all.includes(x));
            if(bad.length) throw new Error(`${name}: confirmed garbage remains after reanalysis: ${bad.join(', ')}`);
            out[name]=b;
          }
          fs.writeFileSync('/tmp/four-market-clean.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE

      - name: Persist regenerated reports to private source
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/reports data/bl/reports data/manga/reports data/manga/bl/reports
          if git diff --cached --quiet; then
            echo 'No report changes to push.'
          else
            git commit -m '[CF-Pages-Skip] [skip actions] regenerate clean word candidates'
            git pull --rebase origin main
            git push origin main
          fi

      - name: Build dashboard from cleaned reports
        working-directory: work
        run: npm run build:site

      - name: Verify built dashboard promoted and watching buckets
        working-directory: work
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('node:fs');
          const j=JSON.parse(fs.readFileSync('site/data/dashboard.json','utf8'));
          const reports={
            otome_audio:j.media?.audio?.otome?.daily?.report || j.markets?.otome?.daily?.report,
            bl_audio:j.media?.audio?.bl?.daily?.report || j.markets?.bl?.daily?.report,
            otome_manga:j.media?.comic?.otome?.daily?.report,
            bl_manga:j.media?.comic?.bl?.daily?.report,
          };
          const reject={
            otome_audio:['秘密','見えた','プレイ傾向','＜応募方法＞','＜応募〆切＞','プレイ属性','精液'],
            bl_audio:['秘密','見えた','プレイ傾向','＜応募方法＞','＜応募〆切＞'],
            otome_manga:['秘密','見えた','プレイ傾向','＜応募方法＞','＜応募〆切＞','プレイ','白棒修正','白線修正','黒線修正','本文','実在の人物','+他','＋他','作者X','イラストや漫画','表紙デザイン','両方あります','キャラ紹介など','歳。入社3年目','一方'],
            bl_manga:['秘密','見えた','プレイ傾向','＜応募方法＞','＜応募〆切＞','憂瓏'],
          };
          function buckets(report){
            if(!report) throw new Error('report missing');
            const promoted=[...(report.auto_candidates?.tags||[]),...(report.auto_candidates?.phrases||[])];
            const pset=new Set(promoted.map(x=>x.label));
            const pending=[...(report.pending_candidates?.tags||[]),...(report.pending_candidates?.phrases||[])].filter(x=>!pset.has(x.label));
            const qset=new Set(pending.map(x=>x.label));
            const today=[...(report.emerging_tags||[]),...(report.emerging_phrases||[])].filter(x=>!pset.has(x.label)&&!qset.has(x.label));
            return {promoted:promoted.map(x=>x.label),watching:[...pending,...today].map(x=>x.label)};
          }
          for(const [name,report] of Object.entries(reports)){
            const b=buckets(report);
            const bad=reject[name].filter(x=>[...b.promoted,...b.watching].includes(x));
            if(bad.length) throw new Error(`${name}: built dashboard still contains ${bad.join(', ')}`);
          }
          NODE

      - name: Upload cleaned dashboard to R2
        working-directory: work
        run: |
          set -euo pipefail
          npx --yes wrangler@latest r2 object put "${R2_BUCKET_NAME}/data/dashboard.json" --file site/data/dashboard.json --remote

      - name: Verify production directly
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 18); do
            curl -LfsS --max-time 90 "$PROD_BASE/data/dashboard.json?verify=$(date +%s)-$attempt" -o /tmp/prod.json || true
            if node - <<'NODE'
          const fs=require('node:fs');
          const j=JSON.parse(fs.readFileSync('/tmp/prod.json','utf8'));
          const reports={
            otome_audio:j.media?.audio?.otome?.daily?.report || j.markets?.otome?.daily?.report,
            bl_audio:j.media?.audio?.bl?.daily?.report || j.markets?.bl?.daily?.report,
            otome_manga:j.media?.comic?.otome?.daily?.report,
            bl_manga:j.media?.comic?.bl?.daily?.report,
          };
          const reject={
            otome_audio:['秘密','見えた','プレイ傾向','＜応募方法＞','＜応募〆切＞','プレイ属性','精液'],
            bl_audio:['秘密','見えた','プレイ傾向','＜応募方法＞','＜応募〆切＞'],
            otome_manga:['秘密','見えた','プレイ傾向','＜応募方法＞','＜応募〆切＞','プレイ','白棒修正','白線修正','黒線修正','本文','実在の人物','+他','＋他','作者X','イラストや漫画','表紙デザイン','両方あります','キャラ紹介など','歳。入社3年目','一方'],
            bl_manga:['秘密','見えた','プレイ傾向','＜応募方法＞','＜応募〆切＞','憂瓏'],
          };
          function buckets(report){
            if(!report) throw new Error('report missing');
            const promoted=[...(report.auto_candidates?.tags||[]),...(report.auto_candidates?.phrases||[])];
            const pset=new Set(promoted.map(x=>x.label));
            const pending=[...(report.pending_candidates?.tags||[]),...(report.pending_candidates?.phrases||[])].filter(x=>!pset.has(x.label));
            const qset=new Set(pending.map(x=>x.label));
            const today=[...(report.emerging_tags||[]),...(report.emerging_phrases||[])].filter(x=>!pset.has(x.label)&&!qset.has(x.label));
            return {promoted:promoted.map(x=>x.label),watching:[...pending,...today].map(x=>x.label)};
          }
          const markets={};
          for(const [name,report] of Object.entries(reports)){
            const b=buckets(report);
            const bad=reject[name].filter(x=>[...b.promoted,...b.watching].includes(x));
            if(bad.length){console.error(name,bad,b);process.exit(2);}
            markets[name]=b;
          }
          const out={checked_at:new Date().toISOString(),verified:true,markets};
          fs.writeFileSync('/tmp/verified.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE
            then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1

      - name: Record verified production state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" statusrepo
          cd statusrepo
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p status
          cp /tmp/verified.json status/production-word-candidates-four-markets.json
          git add status/production-word-candidates-four-markets.json
          git commit -m 'status: verified production word candidates four markets'
          git push origin main
