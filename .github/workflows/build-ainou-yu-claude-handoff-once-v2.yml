name: Build Ainou Yu Claude handoff once v2

on:
  push:
    paths:
      - 'triggers/build-ainou-yu-claude-handoff-v2.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone source repo
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" target

      - name: Build consolidated Claude handoff
        shell: bash
        run: |
          cd target
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const dir = 'data/research/review-reading-packets/deep-dive-ainou-yu-direct';
          const reviews = JSON.parse(fs.readFileSync(path.join(dir, 'reviews.json'), 'utf8'));
          const audit = JSON.parse(fs.readFileSync(path.join(dir, 'analysis-audit.json'), 'utf8'));
          const labels = JSON.parse(fs.readFileSync(path.join(dir, 'official-label-mention-audit.json'), 'utf8'));
          const combined = {
            handoff_version: 1,
            purpose: 'Claude/other LLM handoff: full evidence packet for RJ01306051. Read all 151 reviews before drawing conclusions.',
            analysis_rules: [
              'Treat individual review text as primary evidence.',
              'Do not equate keyword mention share with causal sales contribution.',
              'Keep observed facts, interpretations, and hypotheses separate.',
              'Pay attention to negative and 4/5 reviews, not only 5/5 praise.',
              'Do not claim an element was unimportant merely because reviewers did not explicitly name it.',
              'When proposing hit factors, explain the mechanism connecting character/story/performance/sexual content to user response.'
            ],
            work: {
              product_id: reviews.product_id,
              title: reviews.title,
              circle: reviews.circle,
              official_work_url: reviews.official_work_url,
              source: reviews.source,
              fetched_at: reviews.fetched_at,
              expected_review_count: reviews.expected_review_count,
              fetched_review_count: reviews.fetched_review_count,
              rating_distribution: reviews.rating_distribution,
              catalog_row: audit.catalog_row,
              official_page: audit.official_page
            },
            aggregate_analysis: {
              category_audit: audit.categories,
              low_rated_reviews: audit.low_rated_reviews,
              top_tokens: audit.top_tokens,
              official_label_mention_audit: labels.labels
            },
            reviews: reviews.reviews
          };
          fs.writeFileSync(path.join(dir, 'claude-handoff-all-151.json'), JSON.stringify(combined, null, 2) + '\n');
          const categories = Object.entries(audit.categories || {}).map(([k,v]) => ({ key:k, mentions:v.review_mentions, share:v.share })).sort((a,b) => b.mentions - a.mentions);
          const labelRows = Object.entries(labels.labels || {}).map(([k,v]) => ({ key:k, mentions:v.mentions, share:v.share })).sort((a,b) => b.mentions - a.mentions);
          let md = '';
          md += '# 愛脳ユウ / RJ01306051 — Claude引き継ぎ用・151レビュー全件パケット\n\n';
          md += '## 0. このファイルの用途\n\n';
          md += 'DLsite公式レビューAPIから取得した151件を省略せず全文収録。集計値だけで結論を出さず、必ず後半の151件本文も読むこと。\n\n';
          md += '### 読み方のルール\n\n';
          md += '- レビュー本文＝一次証拠。カテゴリ集計・ラベル言及数＝補助証拠。\n';
          md += '- 言及率が低いことを売上寄与が低いことと同義にしない。\n';
          md += '- FACT／INTERPRETATION／HYPOTHESISを分離する。\n';
          md += '- 5/5だけでなく4/5・3/5も重視する。\n';
          md += '- ヒット要因はタグ名の列挙ではなく、ユーザー反応につながるメカニズムまで説明する。\n\n';
          md += '## 1. 作品・データ概要\n\n';
          md += `- product_id: ${reviews.product_id}\n- title: ${reviews.title}\n- circle: ${reviews.circle}\n- official URL: ${reviews.official_work_url}\n- source: ${reviews.source}\n- fetched: ${reviews.fetched_review_count}/${reviews.expected_review_count}\n`;
          md += `- rating distribution: 5相当=${reviews.rating_distribution['50'] || 0}, 4相当=${reviews.rating_distribution['40'] || 0}, 3相当=${reviews.rating_distribution['30'] || 0}\n`;
          if (audit.catalog_row) {
            md += `- sales_count snapshot: ${audit.catalog_row.sales_count}\n- rating snapshot: ${audit.catalog_row.rating}\n- price_yen: ${audit.catalog_row.price_yen}\n`;
            md += `- voice actor: ${(audit.catalog_row.voice_actors || []).join(', ')}\n- scenario: ${(audit.catalog_row.scenario_by || []).join(', ')}\n- illustration: ${(audit.catalog_row.illust_by || []).join(', ')}\n`;
            md += `- official labels: ${(audit.catalog_row.labels || []).join(' / ')}\n`;
          }
          md += '\n## 2. レビュー横断カテゴリ集計\n\n| category | reviews | share |\n|---|---:|---:|\n';
          for (const x of categories) md += `| ${x.key} | ${x.mentions} | ${x.share}% |\n`;
          md += '\n## 3. 公式タグのレビュー本文内・明示言及監査\n\n※文字列・近似語ベースの明示言及数。存在や売上寄与そのものを測る指標ではない。\n\n| official label | reviews mentioning | share |\n|---|---:|---:|\n';
          for (const x of labelRows) md += `| ${x.key} | ${x.mentions} | ${x.share}% |\n`;
          md += '\n## 4. 低評価側（5/5未満）全文\n\n';
          for (const r of (audit.low_rated_reviews || [])) {
            md += `### ${r.rate_num/10}/5 — ${r.title}\n\n- review_ref: ${r.review_ref}\n- date: ${r.date}\n- good_review: ${r.good_review}\n\n${r.text}\n\n`;
          }
          md += '\n## 5. 全151レビュー・全文\n\n';
          reviews.reviews.forEach((r, i) => {
            md += `### Review ${String(i+1).padStart(3,'0')} / 151 — ${r.rate_num/10}/5 — ${r.title}\n\n`;
            md += `- review_ref: ${r.review_ref}\n- date: ${r.date}\n- purchased: ${r.is_purchased}\n- good_review: ${r.good_review}\n- bad_review: ${r.bad_review}\n- recommend: ${r.recommend}\n- spoiler: ${r.spoiler}\n\n${r.text}\n\n---\n\n`;
          });
          fs.writeFileSync(path.join(dir, 'claude-handoff-all-151.md'), md);
          console.log(JSON.stringify({reviews: reviews.reviews.length, categories: categories.length, labels: labelRows.length, md_chars: md.length}, null, 2));
          NODE

      - name: Commit handoff files
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research/review-reading-packets/deep-dive-ainou-yu-direct/claude-handoff-all-151.md data/research/review-reading-packets/deep-dive-ainou-yu-direct/claude-handoff-all-151.json
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m '[CF-Pages-Skip] [skip actions] research: add complete Ainou Yu Claude handoff'; git pull --rebase origin main; git push origin HEAD:main; fi
