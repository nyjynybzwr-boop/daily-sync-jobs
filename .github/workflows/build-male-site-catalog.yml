# v2: sharded outputs keep every static asset below Cloudflare Pages' 25 MiB limit
name: Build male site catalog from R2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-male-site-catalog.yml'

concurrency:
  group: build-male-site-catalog
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_BUCKET_NAME: melosignal-data

    steps:
      - name: Require credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        working-directory: work
        run: npm ci

      - name: Verify both R2 crawls are complete
        working-directory: work
        run: |
          set -euo pipefail
          node - <<'NODE'
          for (const media of ['audio','manga']) {
            const p=require(`./data/male/r2/${media}-progress.json`);
            if (Number(p.pending||0)!==0) throw new Error(`${media}: pending=${p.pending}`);
            if (p.stopped_reason) throw new Error(`${media}: stopped_reason=${p.stopped_reason}`);
            if (Number(p.processed||0)!==Number(p.source_catalog_ids||0)) throw new Error(`${media}: processed/source mismatch`);
            console.log(media,{processed:p.processed,next_chunk:p.next_chunk,errors:(p.errors||[]).length});
          }
          NODE

      - name: Download completed R2 chunks
        working-directory: work
        run: |
          set -euo pipefail
          retry_get() {
            local key="$1" file="$2" attempt=1
            while true; do
              if npx --yes wrangler@latest r2 object get "${R2_BUCKET_NAME}/${key}" --file "$file" --remote >/dev/null 2>&1; then
                return 0
              fi
              if [ "$attempt" -ge 3 ]; then
                echo "R2 download failed after 3 attempts: $key" >&2
                return 1
              fi
              sleep $((attempt * 3))
              attempt=$((attempt + 1))
            done
          }
          for media in audio manga; do
            count="$(node -e "const p=require('./data/male/r2/${media}-progress.json');process.stdout.write(String(Number(p.next_chunk||0)))")"
            mkdir -p ".tmp/male-r2-download/${media}"
            echo "Downloading ${media}: ${count} chunks"
            for ((i=0;i<count;i++)); do
              padded="$(printf '%05d' "$i")"
              file=".tmp/male-r2-download/${media}/chunk-${padded}.json.gz"
              retry_get "male/${media}/raw/chunk-${padded}.json.gz" "$file"
              if (( (i + 1) % 20 == 0 || i + 1 == count )); then echo "${media}: $((i+1))/${count}"; fi
            done
          done

      - name: Build Pages-safe male audio catalog
        working-directory: work
        env:
          MALE_MEDIA: audio
          INPUT_DIR: .tmp/male-r2-download/audio
          OUT_DIR: web/data/catalog/male
        run: node scripts/build-male-r2-web-sharded.mjs

      - name: Build Pages-safe male manga catalog
        working-directory: work
        env:
          MALE_MEDIA: manga
          INPUT_DIR: .tmp/male-r2-download/manga
          OUT_DIR: web/data/catalog/manga/male
        run: node scripts/build-male-r2-web-sharded.mjs

      - name: Materialize lightweight male audio release-date source
        working-directory: work
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const zlib=require('zlib');
          const dir='.tmp/male-r2-download/audio';
          const files=fs.readdirSync(dir).filter(name=>/^chunk-\d{5}\.json\.gz$/.test(name)).sort();
          const rows=[];
          const seen=new Set();
          for(const name of files){
            const payload=JSON.parse(zlib.gunzipSync(fs.readFileSync(path.join(dir,name))).toString('utf8'));
            for(const item of payload.works||[]){
              const product_id=String(item.product_id||'').toUpperCase();
              if(!product_id||seen.has(product_id))continue;
              seen.add(product_id);
              rows.push({product_id,release_date_text:item.release_date_text||item.release_date||null});
            }
          }
          fs.mkdirSync('data/catalog/male/full',{recursive:true});
          fs.writeFileSync('data/catalog/male/full/details.json',JSON.stringify(rows));
          console.log({male_audio_release_rows:rows.length});
          if(rows.length<60000)throw new Error(`male audio release-date source unexpectedly small: ${rows.length}`);
          NODE

      - name: Rebuild male audio market insights
        working-directory: work
        run: |
          set -euo pipefail
          node scripts/build-market-insights.mjs --market=male
          node scripts/filter-market-insight-pairs.mjs --market=male
          node - <<'NODE'
          const fs=require('fs');
          const full=JSON.parse(fs.readFileSync('web/data/reports/male/market-insights.json','utf8'));
          const compact=JSON.parse(fs.readFileSync('web/data/reports/male/market-insights-compact.json','utf8'));
          if(full.market!=='male'||compact.market!=='male')throw new Error('male market insight identity mismatch');
          if(!compact.notable_pairs?.length)throw new Error('male market-insights notable_pairs empty');
          if(!compact.top_segments?.length)throw new Error('male market-insights top_segments empty');
          if(!compact.pair_filter_policy)throw new Error('male semantic pair filter was not applied');
          console.log({male_insight_pairs:compact.notable_pairs.length,male_segments:compact.top_segments.length,pair_filter_policy:compact.pair_filter_policy});
          NODE

      - name: Validate generated site data and Pages file limits
        working-directory: work
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const expected={
            'web/data/catalog/male':61892,
            'web/data/catalog/manga/male':129383,
          };
          const LIMIT=25*1024*1024;
          for(const [root,count] of Object.entries(expected)){
            const summary=JSON.parse(fs.readFileSync(`${root}/summary.json`,'utf8'));
            const stub=JSON.parse(fs.readFileSync(`${root}/search-index.json`,'utf8'));
            const manifest=JSON.parse(fs.readFileSync(`${root}/search-manifest.json`,'utf8'));
            if(summary.total_works!==count)throw new Error(`${root}: summary count ${summary.total_works} != ${count}`);
            if(stub.total_works!==count||!stub.sharded)throw new Error(`${root}: sharded search stub invalid`);
            if(manifest.total_works!==count||!manifest.sharded)throw new Error(`${root}: manifest count mismatch`);
            const workCount=(manifest.works_shards||[]).reduce((n,row)=>n+Number(row.count||0),0);
            if(workCount!==count)throw new Error(`${root}: work shard total ${workCount} != ${count}`);
            const files=fs.readdirSync(root).filter(name=>name.endsWith('.json'));
            let largest={name:'',bytes:0};
            for(const name of files){
              const bytes=fs.statSync(path.join(root,name)).size;
              if(bytes>=LIMIT)throw new Error(`${root}/${name} ${(bytes/1048576).toFixed(2)}MiB exceeds Pages 25MiB`);
              if(bytes>largest.bytes)largest={name,bytes};
            }
            console.log(root,{works:count,files:files.length,largest:largest.name,largestMiB:(largest.bytes/1048576).toFixed(2),postingShards:manifest.posting_shards.length,workShards:manifest.works_shards.length,termShards:manifest.term_shards.length});
          }
          NODE

      - name: Commit generated male catalog data to private source
        working-directory: work
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/data/catalog/male web/data/catalog/manga/male web/data/reports/male
          if git diff --cached --quiet; then
            echo 'No male catalog or market-insight web-data changes.'
            exit 0
          fi
          git commit -m '[skip actions] data: publish male full-catalog web indexes and insights'
          git pull --rebase origin main
          git push origin HEAD:main
