name: Materialize review evaluation inventory and training supplement

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/materialize-review-evaluation-inventory-and-training.yml'
      - '.review-evaluation-inventory-trigger'

permissions:
  contents: read

concurrency:
  group: review-evaluation-inventory-training
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      R2_BUCKET_NAME: melosignal-data
      REVIEW_SEGMENT: otome-audio
      REVIEW_TRAINING_SUPPLEMENT_ROWS: '800'
      REVIEW_TRAINING_SUPPLEMENT_WORKS_PER_BAND: '40'
      REVIEW_TRAINING_SUPPLEMENT_MAX_PER_CIRCLE: '2'
      REVIEW_TRAINING_SUPPLEMENT_MAX_EVIDENCE_PER_WORK: '20'
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify frozen rollout inputs
        working-directory: work
        run: |
          set -euo pipefail
          node --check scripts/materialize-review-evaluation-full-corpus-inventory.mjs
          node --check scripts/build-review-evaluation-training-supplement.mjs
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('data/research/review-evaluation-spec/review-evaluation-full-corpus-rollout-readiness.json','utf8'));
          const m=JSON.parse(fs.readFileSync('data/reviews/manifests/otome-audio.json','utf8'));
          if(r.status!=='READY_FOR_FULL_CORPUS_BATCH_ROLLOUT'||r.ready!==true) throw new Error(`rollout gate blocked: ${r.status}`);
          if(r.analysis_version_id!=='rev-eval-46255c55e8d1c5dc') throw new Error(`unexpected analysis version ${r.analysis_version_id}`);
          if(r.selected_confidence_slice!=='medium_or_high') throw new Error(`unexpected confidence slice ${r.selected_confidence_slice}`);
          if((r.blockers||[]).length) throw new Error(`blockers: ${r.blockers.join(', ')}`);
          if(m.target_fingerprint!=='sha256:984c47535f5b26a8f8bcba4f554ea468f55ee5e50de125d22e68edfbb432afa7') throw new Error('source fingerprint changed');
          if(Number(m.fetched_reviews)!==206304) throw new Error(`unexpected review count ${m.fetched_reviews}`);
          console.log({status:r.status,analysis_version_id:r.analysis_version_id,review_count:m.fetched_reviews});
          NODE

      - name: Download frozen otome-audio review chunks from R2
        working-directory: work
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          dir=".tmp/reviews-evaluation/${REVIEW_SEGMENT}"
          mkdir -p "$dir"
          node - <<'NODE' > .tmp/review-eval-inventory-chunk-keys.txt
          const fs=require('fs');
          const segment=process.env.REVIEW_SEGMENT;
          const m=JSON.parse(fs.readFileSync(`data/reviews/manifests/${segment}.json`,'utf8'));
          if(Number(m.processed_target_works||0)<Number(m.source_target_works||0)) throw new Error(`${segment}: review crawl incomplete ${m.processed_target_works}/${m.source_target_works}`);
          const chunks=(m.chunks||[]).filter(c=>c.complete&&!c.stopped_reason).sort((a,b)=>Number(a.index)-Number(b.index));
          if(chunks.length!==Number(m.next_chunk||chunks.length)) throw new Error(`${segment}: incomplete chunk sequence ${chunks.length}/${m.next_chunk}`);
          for(const c of chunks) console.log(c.key);
          NODE
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            out="$dir/$(basename "$key")"
            echo "download $key"
            ok=0
            for attempt in 1 2 3; do
              if npx --yes wrangler@latest r2 object get "${R2_BUCKET_NAME}/${key}" --file "$out" --remote >/dev/null; then ok=1; break; fi
              sleep $((attempt * 5))
            done
            [ "$ok" -eq 1 ] || { echo "failed to download $key" >&2; exit 1; }
          done < .tmp/review-eval-inventory-chunk-keys.txt

      - name: Materialize exact-deduped full-corpus inventory
        working-directory: work
        env:
          REVIEW_CHUNK_DIR: .tmp/reviews-evaluation/otome-audio
        run: node scripts/materialize-review-evaluation-full-corpus-inventory.mjs

      - name: Build representative blind training supplement
        working-directory: work
        run: node scripts/build-review-evaluation-training-supplement.mjs

      - name: Verify inventory parity and supplement anti-leakage
        working-directory: work
        run: |
          set -euo pipefail
          inv="data/research/review-evaluation-full-corpus/rev-eval-46255c55e8d1c5dc/inventory"
          sup="data/research/review-evaluation-training/rev-eval-46255c55e8d1c5dc/representative-supplement-v1"
          test -s "$inv/inventory-stats.json"
          test -s "$inv/inventory-manifest.json"
          test -s "$sup/training-supplement-input.json"
          test -s "$sup/training-supplement-predictions.template.json"
          test -s "$sup/training-supplement-selection-audit.json"
          test -s "$sup/manifest.json"
          node - "$inv/inventory-stats.json" "$sup/training-supplement-input.json" "$sup/training-supplement-selection-audit.json" <<'NODE'
          const fs=require('fs');
          const inv=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const input=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          const audit=JSON.parse(fs.readFileSync(process.argv[4],'utf8'));
          if(inv.counts.per_work_dedup_occurrence_count!==683824) throw new Error(`extractor parity failed ${inv.counts.per_work_dedup_occurrence_count}`);
          if(inv.parity.matches_existing_full_corpus_manifest!==true) throw new Error('existing full-corpus manifest parity false');
          if(input.counts.rows!==800||input.rows.length!==800) throw new Error(`supplement row count ${input.rows.length}`);
          if(input.counts.bands.high!==267||input.counts.bands.medium!==267||input.counts.bands.low!==266) throw new Error(`band quota mismatch ${JSON.stringify(input.counts.bands)}`);
          if(audit.anti_leakage.excludes_shadow_446_products!==true||audit.anti_leakage.excludes_discovery48_and_comparison_products!==true||audit.anti_leakage.excludes_all_rest75_products!==true) throw new Error('anti-leakage flags missing');
          for(const row of input.rows){
            if('product_id' in row||'title' in row||'circle' in row||'review_count_band' in row||'rating' in row) throw new Error(`model packet metadata leak ${row.row_id}`);
          }
          console.log({inventory:inv.counts,supplement:input.counts,anti_leakage:audit.anti_leakage});
          NODE
          if grep -E -n 'https?://|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' "$sup/training-supplement-input.json"; then
            echo 'privacy verifier: URL/email-like text leaked' >&2; exit 1
          fi

      - name: Upload canonical inventory artifacts to R2
        working-directory: work
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          manifest="data/research/review-evaluation-full-corpus/rev-eval-46255c55e8d1c5dc/inventory/inventory-manifest.json"
          node - "$manifest" <<'NODE' > .tmp/review-eval-inventory-upload.tsv
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          for(const a of Object.values(m.artifacts)) console.log(`${a.local_path}\t${a.r2_key}\t${a.sha256}`);
          NODE
          while IFS=$'\t' read -r local key sha; do
            echo "upload $key"
            npx --yes wrangler@latest r2 object put "${R2_BUCKET_NAME}/${key}" --file "$local" --remote >/dev/null
            got=$(sha256sum "$local" | awk '{print $1}')
            [ "$got" = "$sha" ] || { echo "local sha mismatch for $local" >&2; exit 1; }
          done < .tmp/review-eval-inventory-upload.tsv

      - name: Commit compact inventory metadata and training packet to private source
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          inv="data/research/review-evaluation-full-corpus/rev-eval-46255c55e8d1c5dc/inventory"
          sup="data/research/review-evaluation-training/rev-eval-46255c55e8d1c5dc/representative-supplement-v1"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$inv/inventory-stats.json" "$inv/inventory-manifest.json" "$sup"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: materialize inventory and training supplement v1" || exit 0
          git pull --rebase origin main
          git push origin main
