name: Read Ainou Yu reviews fast once

on:
  push:
    paths:
      - '.github/workflows/read-ainou-yu-reviews-fast-once.yml'

permissions:
  contents: read

jobs:
  fetch-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch official DLsite reviews and write private packet
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const productId='RJ01306051';
          const headers={
            'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1',
            'Accept-Language':'ja-JP,ja;q=0.9',
            'Accept':'application/json,text/plain,*/*'
          };
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const clean=v=>String(v??'').replace(/\s+/g,' ').trim();
          const rows=[];
          for(let page=1;page<=30;page++){
            const url=`https://www.dlsite.com/girls/api/review?product_id=${productId}&limit=20&mix_pickup=false&page=${page}&order=regist_d&locale=ja_JP`;
            let json=null;
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const res=await fetch(url,{headers,redirect:'follow'});
                if(!res.ok) throw new Error(`HTTP ${res.status}`);
                const body=await res.text();
                json=JSON.parse(body);
                if(json?.is_success!==true) throw new Error(`API_ERROR ${clean(json?.error_msg||'is_success=false')}`);
                break;
              }catch(e){if(attempt===3) throw e; await sleep(attempt*1200);}
            }
            const list=Array.isArray(json.review_list)?json.review_list:[];
            if(!list.length) break;
            for(const r of list) rows.push({
              review_id:clean(r.member_review_id||r.review_id||''),
              title:String(r.review_title??''), text:String(r.review_text??''),
              entry_date:clean(r.entry_date||''), regist_date:clean(r.regist_date||''),
              rate_num:Number(r.rate_num)||null,
              is_purchased:['1','true'].includes(String(r.is_purchased??'').toLowerCase())||r.is_purchased===true,
              recommend:clean(r.recommend||''), spoiler:clean(r.spoiler||''),
              good_review:Number(r.good_review)||0, bad_review:Number(r.bad_review)||0,
              genre:Array.isArray(r.genre)?r.genre:[]
            });
            if(list.length<20) break;
            await sleep(750);
          }
          const dedup=[...new Map(rows.map(r=>[r.review_id||`${r.entry_date}:${r.title}:${r.text}`,r])).values()];
          const out={schema_version:1,source:'official_dlsite_review_api',product_id:productId,fetched_at:new Date().toISOString(),review_count:dedup.length,reviews:dedup};
          fs.writeFileSync('/tmp/ainou-yu-reviews.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify({product_id:productId,review_count:dedup.length}));
          NODE
          content=$(base64 -w0 /tmp/ainou-yu-reviews.json)
          path='data/research/interview-2026-09-01/ainou-yu-reviews-fast.json'
          payload=$(node -e 'console.log(JSON.stringify({message:"[CF-Pages-Skip] [skip actions] research: cache Ainou Yu reviews fast",content:process.argv[1],branch:"main"}))' "$content")
          curl -fsS -X PUT \
            -H "Authorization: Bearer $SYNC_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$SOURCE_REPO/contents/$path" \
            -d "$payload" >/dev/null
