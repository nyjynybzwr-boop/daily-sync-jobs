# trigger: deploy winpaths activation fix a99ad66a
name: Force deploy latest MeloSignal to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cloudflare-pages-force-deploy.yml'

concurrency:
  group: cloudflare-pages-force-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_BUCKET_NAME: melosignal-data
      CF_PAGES_PROJECT: dlsite-trend-radar
      PROD_BASE: https://dlsite-trend-radar.pages.dev

    steps:
      - name: Require credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID missing' >&2; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN missing' >&2; exit 1; }

      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: work
        run: npm ci

      - name: Build Cloudflare Pages output and refresh R2 large data
        working-directory: work
        run: npm run build:cloudflare-pages

      - name: Verify hidden gems exist in built static page
        working-directory: work
        run: |
          set -euo pipefail
          grep -Fq '隠れた名作' site/all.html
          grep -Fq 'hiddenGemsList' site/all.html
          grep -Fq 'renderHiddenGems' site/all-core.js

      - name: Directly deploy latest build to existing Pages project
        working-directory: work
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          npx --yes wrangler@latest pages deploy site \
            --project-name "$CF_PAGES_PROJECT" \
            --branch main \
            --commit-hash "$SHA" \
            --commit-message "Force production refresh from $SHA"

      - name: Verify production static page is new
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 24); do
            echo "verify attempt $attempt/24"
            if html="$(curl -LfsS --max-time 30 "$PROD_BASE/all.html?deploycheck=$(date +%s)")" \
              && printf '%s' "$html" | grep -Fq '隠れた名作' \
              && printf '%s' "$html" | grep -Fq 'hiddenGemsList'
            then
              ok=1
              break
            fi
            sleep 10
          done
          test "$ok" = 1

      - name: Record production deployment status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" statusrepo
          cd statusrepo
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p status
          cat > status/cloudflare-pages-force-deploy.json <<JSON
          {
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "production": "https://dlsite-trend-radar.pages.dev",
            "hidden_gems_visible_in_static_html": true,
            "verified": true
          }
          JSON
          git add status/cloudflare-pages-force-deploy.json
          git commit -m 'status: Cloudflare Pages force deploy'
          git push origin main
