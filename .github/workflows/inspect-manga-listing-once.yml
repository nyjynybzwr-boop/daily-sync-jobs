name: Compare manga catalog routes once

on:
  push:
    paths:
      - '.github/workflows/inspect-manga-listing-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare DLsite girls manga routes
        run: |
          npm install --no-save cheerio
          node --input-type=module <<'NODE'
          import * as cheerio from 'cheerio';
          const UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1';
          const bases=[
            ['girls-touch','https://www.dlsite.com/girls-touch/works/type/=/work_type_category/comic'],
            ['girls','https://www.dlsite.com/girls/works/type/=/work_type_category/comic'],
            ['girls-pro-touch','https://www.dlsite.com/girls-pro-touch/works/type/=/work_type_category/comic'],
          ];
          const pages=[1,240,241,259,260];
          const idOf=(h='')=>(h.match(/product_id\/(RJ\d+|VJ\d+|BJ\d+|AJ\d+)/i)?.[1]||'').toUpperCase();
          for(const [name,base] of bases) for(const page of pages) {
            const res=await fetch(`${base}/page/${page}`,{headers:{'User-Agent':UA,'Accept-Language':'ja-JP,ja;q=0.9'},redirect:'follow'});
            const html=await res.text(); const $=cheerio.load(html);
            const ids=[];
            $('ul.n_work_list.type_grid.type_horizontal').not('.type_grid_min').first().find('a[href*="/work/=/product_id/"]').each((_,a)=>{const id=idOf($(a).attr('href'));if(id&&!ids.includes(id))ids.push(id)});
            const text=$('body').text().replace(/\s+/g,' ').trim();
            const count=text.match(/([\d,]+)\s*件中\s*([\d,]+)\s*[-−ー]\s*([\d,]+)\s*件目/)?.[0]||'';
            console.log('ROUTE_CHECK '+JSON.stringify({name,page,status:res.status,final_url:res.url,title:$('title').text().trim(),count_text:count,main_count:ids.length,first:ids.slice(0,3),canonical:$('link[rel="canonical"]').attr('href')||''}));
          }
          NODE
