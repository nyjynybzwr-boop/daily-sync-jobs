name: Call Tokyo manga probe once

on:
  push:
    paths:
      - '.github/workflows/inspect-manga-listing-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call deployed Tokyo Vercel probe
        run: |
          set -e
          URL='https://dlsite-trend-radar.vercel.app/api/manga-region-probe'
          echo "Calling $URL"
          BODY=$(curl -fsSL --retry 2 --retry-delay 2 "$URL")
          echo "TOKYO_PROBE_RESPONSE $BODY"
          node -e '
            const x=JSON.parse(process.argv[1]);
            console.log("TOKYO_PROBE_AUDIT "+JSON.stringify({region:x.region,listing:x.listing,missing:x.missing,known:x.known}));
            if (x.region !== "hnd1") throw new Error(`Expected hnd1, got ${x.region}`);
            if (String(x.listing?.count) !== "7743") throw new Error(`Expected listing count 7743, got ${x.listing?.count}`);
            if (x.missing?.geo_blocked) throw new Error("RJ01512512 is still geo-blocked from Tokyo probe");
          ' "$BODY"
