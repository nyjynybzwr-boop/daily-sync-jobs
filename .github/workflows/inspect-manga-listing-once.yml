name: Verify fixed manga catalog index once

on:
  push:
    paths:
      - '.github/workflows/inspect-manga-listing-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fixed collector against one live comic page
        working-directory: work
        env:
          DLSITE_CATALOG_BASE: https://www.dlsite.com/girls-touch/works/type/=/work_type_category/comic
          DATA_ROOT: /tmp/manga-index-check
          MAX_PAGES_PER_RUN: '1'
          PAGE_DELAY_MS: '0'
        run: |
          node scripts/collect-catalog-index.mjs
          node - <<'NODE'
          const fs=require('fs');
          const ids=JSON.parse(fs.readFileSync('/tmp/manga-index-check/index/ids.json'));
          const cp=JSON.parse(fs.readFileSync('/tmp/manga-index-check/index/checkpoint.json'));
          const count=Object.keys(ids).length;
          console.log('FIXED_MANGA_INDEX_VERIFY '+JSON.stringify({count,last_page:cp.last_page,done:cp.done,stopped_reason:cp.stopped_reason,sample:Object.values(ids).slice(0,5)}));
          if(count !== 30) throw new Error(`Expected exactly 30 result-grid works on page 1, got ${count}`);
          if(cp.last_page !== 1 || cp.done) throw new Error(`Unexpected checkpoint ${JSON.stringify(cp)}`);
          NODE
