name: Probe Japan-only manga work once

on:
  push:
    paths:
      - '.github/workflows/inspect-manga-listing-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe RJ01512512 from hosted runner
        run: |
          npm install --no-save cheerio
          node --input-type=module <<'NODE'
          import * as cheerio from 'cheerio';
          const id='RJ01512512';
          const UA='Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1';
          const urls=[
            ['girls-touch',`https://www.dlsite.com/girls-touch/work/=/product_id/${id}.html`],
            ['girls',`https://www.dlsite.com/girls/work/=/product_id/${id}.html`],
            ['girls-pro-touch',`https://www.dlsite.com/girls-pro-touch/work/=/product_id/${id}.html`],
          ];
          const profiles=[
            ['plain',{}],
            ['jp-cookie',{'Cookie':'locale=ja_JP; adultchecked=1; over18=1'}],
            ['jp-forwarded',{'X-Forwarded-For':'133.18.0.1','X-Real-IP':'133.18.0.1','CF-IPCountry':'JP'}],
          ];
          for(const [name,url] of urls) for(const [profile,extra] of profiles){
            const res=await fetch(url,{headers:{'User-Agent':UA,'Accept-Language':'ja-JP,ja;q=0.9',...extra},redirect:'follow'});
            const html=await res.text(); const $=cheerio.load(html); const body=$('body').text().replace(/\s+/g,' ').trim();
            const signals=['お住まいの地域','地域','販売できません','購入できません','閲覧できません','not available','unavailable','茅原啓佑','ぽつねんじん'].filter(s=>body.toLowerCase().includes(s.toLowerCase()));
            console.log('PRODUCT_PROBE '+JSON.stringify({name,profile,status:res.status,final_url:res.url,title:$('title').text().trim(),html_length:html.length,signals,body_head:body.slice(0,500),canonical:$('link[rel="canonical"]').attr('href')||'',set_cookie:res.headers.get('set-cookie')||''}));
          }
          NODE
