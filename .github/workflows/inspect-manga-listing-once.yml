name: Strict post-push manga catalog audit once

on:
  push:
    paths:
      - '.github/workflows/inspect-manga-listing-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - name: Materialize pushed manga details
        working-directory: work
        run: git lfs pull --include="data/manga/catalog/full/details.json"
      - name: Run strict catalog audit from fresh clone
        working-directory: work
        run: node scripts/audit-manga-catalog.mjs
