name: Probe Tokyo manga ranking HTML once

on:
  push:
    paths:
      - '.github/workflows/inspect-manga-listing-once.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - name: Probe raw ranking HTML through Tokyo relay
        working-directory: work
        run: |
          set -euo pipefail
          source scripts/ci/dlsite-jp-relay-env.sh
          # Re-run after the Vercel deployment containing kind=ranking is live.
          node --input-type=module <<'NODE'
          const relay=process.env.DLSITE_JP_RELAY_BASE;
          const token=process.env.DLSITE_JP_RELAY_TOKEN;
          const periods=['day','week','month'];
          for(const period of periods){
            const res=await fetch(`${relay}?kind=ranking&period=${period}`,{headers:{Authorization:`Bearer ${token}`}});
            const html=await res.text();
            const ids=[...html.matchAll(/product_id\/(RJ\d+|VJ\d+|BJ\d+|AJ\d+)/gi)].map(m=>m[1].toUpperCase());
            const unique=[...new Set(ids)];
            const title=(html.match(/<title[^>]*>([\s\S]*?)<\/title>/i)?.[1]||'').replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
            console.log('TOKYO_RANKING_HTML '+JSON.stringify({period,status:res.status,title,unique_count:unique.length,first:unique.slice(0,40),has_screenshot_work:unique.includes('RJ01512512'),html_length:html.length}));
            if(!res.ok) throw new Error(`${period} relay HTTP ${res.status}: ${html.slice(0,200)}`);
            if(unique.length<30) throw new Error(`${period} raw HTML has too few product IDs: ${unique.length}`);
          }
          NODE
