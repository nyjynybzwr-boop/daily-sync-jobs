name: Inspect Tokyo manga ranking DOM once

on:
  push:
    paths:
      - '.github/workflows/inspect-manga-listing-once.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - name: Inspect ranking DOM containers
        working-directory: work
        run: |
          set -euo pipefail
          npm install --no-save cheerio
          source scripts/ci/dlsite-jp-relay-env.sh
          node --input-type=module <<'NODE'
          import * as cheerio from 'cheerio';
          const relay=process.env.DLSITE_JP_RELAY_BASE;
          const token=process.env.DLSITE_JP_RELAY_TOKEN;
          const res=await fetch(`${relay}?kind=ranking&period=day`,{headers:{Authorization:`Bearer ${token}`}});
          const html=await res.text();
          if(!res.ok) throw new Error(`relay HTTP ${res.status}: ${html.slice(0,200)}`);
          const $=cheerio.load(html);
          const idOf=(href='')=>(href.match(/product_id\/(RJ\d+|VJ\d+|BJ\d+|AJ\d+)/i)?.[1]||'').toUpperCase();
          const links=$('a[href*="/work/=/product_id/"]').toArray();
          const rows=[];
          for(const a of links){
            const id=idOf($(a).attr('href')); if(!id) continue;
            const chain=[]; let p=$(a);
            for(let d=0; d<8 && p.length; d++,p=p.parent()){
              const el=p.get(0); if(!el) break;
              chain.push(`${el.tagName}${p.attr('id')?'#'+p.attr('id'):''}${p.attr('class')?'.'+p.attr('class').trim().replace(/\s+/g,'.'):''}`);
            }
            rows.push({id,text:($(a).text()||$(a).attr('title')||$(a).find('img').attr('alt')||'').replace(/\s+/g,' ').trim().slice(0,100),chain});
          }
          const unique=[]; for(const r of rows) if(!unique.some(x=>x.id===r.id)) unique.push(r);
          console.log('RANK_LINKS '+JSON.stringify(unique.slice(0,35)));
          const stats=new Map();
          for(const r of unique){ for(const key of r.chain){ if(!stats.has(key))stats.set(key,new Set()); stats.get(key).add(r.id); } }
          const ranked=[...stats].map(([key,ids])=>({key,count:ids.size,ids:[...ids].slice(0,8)})).sort((a,b)=>Math.abs(a.count-30)-Math.abs(b.count-30)||b.count-a.count);
          console.log('RANK_ANCESTORS '+JSON.stringify(ranked.slice(0,80)));
          NODE
