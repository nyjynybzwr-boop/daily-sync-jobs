name: Audit existing manga work types once

on:
  push:
    paths:
      - '.github/workflows/inspect-manga-listing-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - name: Materialize manga details
        working-directory: work
        run: git lfs pull --include="data/manga/catalog/full/details.json"
      - name: Count current work types
        working-directory: work
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const ids=JSON.parse(fs.readFileSync('data/manga/catalog/index/ids.json'));
          const details=JSON.parse(fs.readFileSync('data/manga/catalog/full/details.json'));
          const groups=new Map();
          for(const [id,row] of Object.entries(details)) {
            const key=`${row.work_type_value ?? 'null'}|${row.work_type_name ?? 'null'}|excluded=${Boolean(row.excluded_work_type)}|error=${Boolean(row.detail_error)}`;
            if(!groups.has(key)) groups.set(key,{key,count:0,samples:[]});
            const g=groups.get(key); g.count++;
            if(g.samples.length<8) g.samples.push({id,title:ids[id]?.title||row.title||'',url:ids[id]?.url||row.url||''});
          }
          const sorted=[...groups.values()].sort((a,b)=>b.count-a.count);
          console.log('MANGA_WORK_TYPE_DISTRIBUTION '+JSON.stringify({indexed:Object.keys(ids).length,details:Object.keys(details).length,groups:sorted}));
          NODE
