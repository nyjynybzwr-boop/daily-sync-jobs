name: Inspect manga language filters once

on:
  push:
    paths:
      - '.github/workflows/inspect-manga-listing-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect manga language filter controls
        run: |
          npm install --no-save cheerio
          node --input-type=module <<'NODE'
          import * as cheerio from 'cheerio';
          const url='https://www.dlsite.com/girls-touch/works/type/=/work_type_category/comic/page/1';
          const res=await fetch(url,{headers:{'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1','Accept-Language':'ja-JP,ja;q=0.9'}});
          const html=await res.text(); const $=cheerio.load(html);
          const controls=$('input,option,select').toArray().map(el=>({tag:el.tagName,name:$(el).attr('name')||'',value:$(el).attr('value')||'',checked:$(el).is(':checked'),selected:$(el).is(':selected'),id:$(el).attr('id')||'',parent:$(el).parent().text().replace(/\s+/g,' ').trim().slice(0,150)})).filter(x=>/option|lang|language/i.test(x.name)||/JPN|NM|ENG|CHI|KOR|日本語|英語|中国語|韓国語/.test(x.value+' '+x.parent));
          const links=$('a').toArray().map(a=>({text:$(a).text().replace(/\s+/g,' ').trim(),href:$(a).attr('href')||''})).filter(x=>/言語|日本語|英語|中国語|韓国語|lang_options|options%5B/.test(x.text+' '+x.href)).slice(0,200);
          const text=$('body').text().replace(/\s+/g,' ').trim();
          const snippets=[];
          for(const word of ['言語','日本語','英語','中国語','韓国語']) { let pos=0; while((pos=text.indexOf(word,pos))>=0 && snippets.length<50){snippets.push(text.slice(Math.max(0,pos-120),Math.min(text.length,pos+260)));pos+=word.length;} }
          console.log('LANG_CONTROLS '+JSON.stringify(controls.slice(0,300)));
          console.log('LANG_LINKS '+JSON.stringify(links));
          console.log('LANG_SNIPPETS '+JSON.stringify(snippets));
          NODE
