name: Inspect manga count contexts once

on:
  push:
    paths:
      - '.github/workflows/inspect-manga-listing-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect count and filter contexts
        run: |
          npm install --no-save cheerio
          node --input-type=module <<'NODE'
          import * as cheerio from 'cheerio';
          const mobile='Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1';
          const desktop='Mozilla/5.0 (Macintosh; Intel Mac OS X 14_5) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36';
          const url='https://www.dlsite.com/girls-touch/works/type/=/work_type_category/comic/page/1';
          for (const [profile,headers] of [
            ['mobile',{'User-Agent':mobile,'Accept-Language':'ja-JP,ja;q=0.9'}],
            ['desktop',{'User-Agent':desktop,'Accept-Language':'ja-JP,ja;q=0.9'}],
            ['mobile-adultchecked',{'User-Agent':mobile,'Accept-Language':'ja-JP,ja;q=0.9','Cookie':'adultchecked=1; locale=ja_JP'}],
          ]) {
            const res=await fetch(url,{headers,redirect:'follow'});
            const html=await res.text(); const $=cheerio.load(html); const body=$('body').text().replace(/\s+/g,' ').trim();
            const count=body.match(/([\d,]+)\s*件中\s*([\d,]+)\s*[-−ー]\s*([\d,]+)\s*件目/)?.[1]||null;
            const summary=(body.match(/作品カテゴリ:[^検索条件]{0,700}/)||[])[0]||'';
            const raw7743=[]; let pos=-1; while((pos=html.indexOf('7743',pos+1))>=0 && raw7743.length<10) raw7743.push(html.slice(Math.max(0,pos-220),pos+220).replace(/\s+/g,' '));
            const nearCounts=[];
            for(const m of body.matchAll(/\b([7-8][\d,]{3,5})\s*件/g)){
              const n=Number(m[1].replace(/,/g,'')); if(n>=7000&&n<=9000) nearCounts.push({n,context:body.slice(Math.max(0,m.index-120),m.index+180)});
              if(nearCounts.length>=30) break;
            }
            const labels=$('label').toArray().map(el=>$(el).text().replace(/\s+/g,' ').trim()).filter(t=>/AI|販売終了|予告|翻訳|同人|商業|電子書籍|対象作品|日本語|言語/.test(t)).slice(0,80);
            const inputs=$('input,select,option').toArray().map(el=>({tag:el.tagName,name:$(el).attr('name')||'',value:$(el).attr('value')||'',checked:$(el).is(':checked'),text:$(el).text().replace(/\s+/g,' ').trim().slice(0,80)})).filter(x=>/ai|sale|end|announce|work_category|language|option|translation/i.test(`${x.name} ${x.value} ${x.text}`)).slice(0,100);
            console.log('PROFILE '+JSON.stringify({profile,status:res.status,count,summary:summary.slice(0,700),raw7743,nearCounts,labels,inputs}));
          }
          NODE
