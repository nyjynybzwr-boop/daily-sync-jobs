name: Test US detail parser on Japan-only manga once

on:
  push:
    paths:
      - '.github/workflows/inspect-manga-listing-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install parser dependency
        working-directory: work
        run: npm install --no-save devalue
      - name: Parse Japan-only product directly from US runner
        working-directory: work
        run: |
          node --input-type=module <<'NODE'
          import { fetchDlsiteProductPlain } from './scripts/lib/dlsite-fetch-detail.mjs';
          const seed={product_id:'RJ01512512',url:'https://www.dlsite.com/girls-touch/work/=/product_id/RJ01512512.html',title:'茅原啓佑の×恋'};
          try {
            const row=await fetchDlsiteProductPlain(seed);
            console.log('US_DETAIL_PARSE '+JSON.stringify({ok:true,product_id:row.product_id,title:row.title,work_type_value:row.work_type_value,work_type_name:row.work_type_name,detail_error:row.detail_error||null,description:(row.description||'').slice(0,120),tags:row.tags?.slice?.(0,10)||[],sales_count:row.sales_count??null,price_yen:row.price_yen??null,detail_parser_version:row.detail_parser_version??null}));
          } catch (e) {
            console.log('US_DETAIL_PARSE '+JSON.stringify({ok:false,error:String(e?.message||e)}));
          }
          NODE
