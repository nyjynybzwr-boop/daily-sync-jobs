name: Analyze review experience hit trends

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-review-experience-hit-trends.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_BUCKET_NAME: melosignal-data
      REVIEW_SEGMENT: otome-audio
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download derived experience analysis from R2
        working-directory: work
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/reviews-experience
          key="reviews-derived/experience/${REVIEW_SEGMENT}/latest.json.gz"
          out=".tmp/reviews-experience/${REVIEW_SEGMENT}-experience.json.gz"
          npx --yes wrangler@latest r2 object get "${R2_BUCKET_NAME}/${key}" --file "$out" --remote >/dev/null
          test -s "$out"

      - name: Build hit-stratified review trends
        working-directory: work
        env:
          REVIEW_EXPERIENCE_GZ: .tmp/reviews-experience/otome-audio-experience.json.gz
          REVIEW_HIT_TRENDS_OUT: data/research/review-experience-hit-trends/otome-audio.json
        run: node scripts/analyze-review-experience-hit-trends.mjs

      - name: Verify output
        working-directory: work
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync('data/research/review-experience-hit-trends/otome-audio.json','utf8'));
          if(!j.yearly?.length||!j.focus_dimensions?.safety_affection)throw new Error('hit trend output incomplete');
          console.log(j.yearly.map(y=>({year:y.year,coverage:y.review_coverage,top25:y.groups.top25.works})));
          NODE

      - name: Commit hit trend summary to private source
        working-directory: work
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          file="data/research/review-experience-hit-trends/otome-audio.json"
          git add "$file"
          git commit -m "[CF-Pages-Skip] [skip actions] reviews: otome-audio hit experience trends" || exit 0
          git pull --rebase origin main
          git push origin main
