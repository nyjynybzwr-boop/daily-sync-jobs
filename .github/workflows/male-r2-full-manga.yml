name: Male manga full catalog to R2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/male-r2-full-manga.yml'
  schedule:
    - cron: '37 */6 * * *'

concurrency:
  group: male-r2-full-manga
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_BUCKET_NAME: melosignal-data
      MALE_MEDIA: manga
      CHUNK_SIZE: '500'
      DETAIL_DELAY_MS: '800'
      MALE_R2_MAX_BYTES: '7516192768'
      PILOT: '0'

    steps:
      - name: Require credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'CLOUDFLARE_ACCOUNT_ID missing' >&2; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'CLOUDFLARE_API_TOKEN missing' >&2; exit 1; }

      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Wait for manga index reconciliation on the initial push run
        if: github.event_name == 'push'
        working-directory: work
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 30); do
            git pull --rebase origin main
            read ids total gap <<<"$(node - <<'NODE'
          const c=require('./data/male/manga/catalog/index/checkpoint.json');
          const i=require('./data/male/manga/catalog/index/ids.json');
          const ids=Object.keys(i).length;
          const total=Number(c.source_total_count||0);
          process.stdout.write(`${ids} ${total} ${total-ids}`);
          NODE
          )"
            echo "reconcile check $attempt: ids=$ids total=$total gap=$gap"
            if [ "$gap" = 0 ]; then ready=1; break; fi
            sleep 60
          done
          if [ "$ready" != 1 ]; then
            echo 'Manga index is still not reconciled; leaving this run without crawling.'
            exit 78
          fi

      - name: Verify exact accepted manga crawl count
        working-directory: work
        run: |
          set -euo pipefail
          git pull --rebase origin main
          node - <<'NODE'
          const c=require('./data/male/manga/catalog/index/checkpoint.json');
          const i=require('./data/male/manga/catalog/index/ids.json');
          const ids=Object.keys(i).length;
          const total=Number(c.source_total_count||0);
          console.log({ids,total,gap:total-ids,listing_total:c.source_listing_total_count??null,accepted_gap:c.accepted_gap??0,done:c.done,stopped_reason:c.stopped_reason});
          if (!c.done || c.stopped_reason || ids !== total) process.exit(2);
          NODE

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: work
        run: |
          set -euo pipefail
          npm ci >/tmp/npm-ci.log 2>&1
          npm install --no-save devalue >>/tmp/npm-ci.log 2>&1

      - name: Crawl and upload up to 20 chunks
        working-directory: work
        run: |
          set -euo pipefail
          for batch in $(seq 1 20); do
            git pull --rebase origin main
            chunk_index="$(node -e "const p=require('./data/male/r2/manga-progress.json');process.stdout.write(String(p.next_chunk||0))")"
            total="$(node -e "const i=require('./data/male/manga/catalog/index/ids.json');process.stdout.write(String(Object.keys(i).length))")"
            offset=$((chunk_index * 500))
            if [ "$offset" -ge "$total" ]; then
              echo "Manga catalog complete: next_chunk=$chunk_index total=$total"
              break
            fi

            echo "=== manga full batch $batch / chunk $chunk_index / total $total ==="
            CHUNK_INDEX="$chunk_index" node scripts/crawl-male-r2-chunk.mjs

            node - <<'NODE'
          const p=require('./data/male/r2/manga-progress.json');
          const c=p.last_chunk||{};
          if (c.detail_error_count !== 0) throw new Error(`detail errors in chunk ${c.index}: ${c.detail_error_count}`);
          if (c.expected_work_type_count !== c.success_count) throw new Error(`non-MNG work in chunk ${c.index}: ${c.expected_work_type_count}/${c.success_count}`);
          NODE

            padded="$(printf '%05d' "$chunk_index")"
            chunk=".tmp/male-r2/manga/chunk-${padded}.json.gz"
            manifest="data/male/r2/manga-manifest.json"
            progress="data/male/r2/manga-progress.json"
            test -s "$chunk"
            test -s "$manifest"
            test -s "$progress"

            npx --yes wrangler@latest r2 object put "${R2_BUCKET_NAME}/male/manga/raw/chunk-${padded}.json.gz" --file "$chunk" --remote
            npx --yes wrangler@latest r2 object put "${R2_BUCKET_NAME}/male/manga/manifest.json" --file "$manifest" --remote

            bash scripts/ci/push.sh "$progress $manifest" "[CF-Pages-Skip] [skip actions] male manga R2 progress"
            node -e "const p=require('./data/male/r2/manga-progress.json');console.log({processed:p.processed,pending:p.pending,next_chunk:p.next_chunk,stored_bytes:p.stored_bytes,errors:p.errors?.length||0,stopped_reason:p.stopped_reason})"
          done

      - name: Final status
        working-directory: work
        run: |
          git pull --rebase origin main
          cat data/male/r2/manga-progress.json

      - name: Continue immediately while manga remains
        working-directory: work
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git pull --rebase origin main
          pending="$(node -e "const p=require('./data/male/r2/manga-progress.json');process.stdout.write(String(Number(p.pending||0)))")"
          stopped="$(node -e "const p=require('./data/male/r2/manga-progress.json');process.stdout.write(String(p.stopped_reason||''))")"
          errors="$(node -e "const p=require('./data/male/r2/manga-progress.json');process.stdout.write(String((p.errors||[]).length))")"
          echo "continuation check: pending=$pending stopped=$stopped errors=$errors"
          if [ -n "$stopped" ] || [ "$errors" != '0' ]; then
            echo 'Not chaining because the last run recorded a crawl error.'
            exit 0
          fi
          if [ "$pending" -gt 0 ]; then
            echo 'Queueing the next manga R2 run immediately.'
            gh workflow run male-r2-full-manga.yml --repo "$GITHUB_REPOSITORY"
          else
            echo 'Male manga R2 crawl is complete.'
          fi
