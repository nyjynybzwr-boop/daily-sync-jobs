name: Daily Target A sync

on:
  workflow_dispatch:
  schedule:
    # Primary run at 23:25 JST, plus one unattended self-healing retry at
    # 23:40 JST. Every run first checks whether today's
    # data/raw/<date>.json already exists and no-ops if so, so a healthy
    # primary run makes the retry free.
    #
    # Both crons MUST stay before midnight JST. "today" below is whatever
    # the JST wall clock says when the job runs, not the date the primary
    # run was trying to collect for - once JST midnight has passed this
    # target's day-ranking scrape reflects the NEW day (DLsite's "day"
    # ranking has no way to ask for a past day), so a post-midnight run
    # would silently collect and label the wrong day's data as a "recovery"
    # of the missed one instead of actually filling the gap. A retry after
    # midnight only makes sense once collect-ranking.mjs can be told which
    # calendar day to target explicitly - it can't today.
    - cron: '25 14 * * *'
    - cron: '40 14 * * *'
  push:
    paths:
      - '.sync-target-a-trigger'
      - '.github/workflows/sync-target-a-daily.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: sync-target-a-v2
  cancel-in-progress: false

jobs:
  sync-target-a:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Check whether today's Target A snapshot is missing
        id: need
        working-directory: work
        run: |
          set -euo pipefail
          today=$(TZ=Asia/Tokyo date +%F)
          echo "today=$today" >> "$GITHUB_OUTPUT"
          if [ -s "data/raw/${today}.json" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Target A ${today} already exists; fallback is a no-op."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Target A ${today} is missing; fallback will collect it."
          fi

      - name: Setup Node
        if: steps.need.outputs.needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies and browser
        if: steps.need.outputs.needed == 'true'
        working-directory: work
        run: |
          set -euo pipefail
          npm ci >/tmp/step.log 2>&1 || (cat /tmp/step.log; echo 'Dependency installation failed.'; exit 1)
          npm install --no-save playwright devalue >/tmp/step.log 2>&1 || (cat /tmp/step.log; echo 'Browser dependency installation failed.'; exit 1)
          npx playwright install --with-deps chromium >>/tmp/step.log 2>&1 || (cat /tmp/step.log; echo 'Browser installation failed.'; exit 1)

      - name: Collect Target A daily ranking
        if: steps.need.outputs.needed == 'true'
        working-directory: work
        run: |
          set -euo pipefail
          timeout 12m node scripts/collect-ranking.mjs

      - name: Verify today's Target A daily snapshot
        if: steps.need.outputs.needed == 'true'
        working-directory: work
        run: |
          set -euo pipefail
          today="${{ steps.need.outputs.today }}"
          test -s "data/raw/${today}.json" || { echo "missing data/raw/${today}.json" >&2; exit 1; }
          node - "$today" <<'NODE'
          const fs=require('fs');const today=process.argv[2];const p=JSON.parse(fs.readFileSync(`data/raw/${today}.json`,'utf8'));
          if(p.captured_date_jst!==today) throw new Error(`date mismatch ${p.captured_date_jst}`);
          if(p.category!=='voice') throw new Error(`unexpected category ${p.category}`);
          if(!Array.isArray(p.items)||p.items.length===0) throw new Error('empty Target A ranking');
          if(p.stopped_reason) throw new Error(`collector stopped: ${p.stopped_reason}`);
          console.log({today,item_count:p.item_count,source_item_count:p.source_item_count,http_status:p.http_status});
          NODE

      - name: Checkpoint Target A daily immediately
        if: steps.need.outputs.needed == 'true'
        working-directory: work
        run: |
          set -euo pipefail
          bash scripts/ci/push.sh "data/raw" "[skip actions] data: target A daily checkpoint $(TZ=Asia/Tokyo date +%F' '%H:%M)" >/tmp/step.log 2>&1 || (cat /tmp/step.log; echo 'Push Target A daily failed.'; exit 1)

      - name: Analyze Target A daily
        if: steps.need.outputs.needed == 'true'
        working-directory: work
        run: |
          set -euo pipefail
          timeout 8m node scripts/analyze-trends.mjs || { echo '::warning::Target A daily analysis timed out/failed after the raw daily checkpoint was already pushed.'; exit 0; }
          bash scripts/ci/push.sh "data/labeled data/reports" "[skip actions] data: target A daily analysis $(TZ=Asia/Tokyo date +%F' '%H:%M)" >/tmp/step.log 2>&1 || { cat /tmp/step.log; echo '::warning::Target A daily analysis push failed; raw daily checkpoint is safe.'; exit 0; }

      - name: Collect Target A week and month rankings
        id: windows
        if: steps.need.outputs.needed == 'true'
        working-directory: work
        run: |
          set -euo pipefail
          if timeout 25m node scripts/collect-window-rankings.mjs; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo '::warning::Target A week/month collection timed out or failed; raw daily checkpoint is safe.'
          fi

      - name: Analyze and push Target A windows
        if: steps.need.outputs.needed == 'true' && steps.windows.outputs.ok == 'true'
        working-directory: work
        run: |
          set -euo pipefail
          timeout 8m node scripts/analyze-window-rankings.mjs || { echo '::warning::Target A window analysis timed out/failed.'; exit 0; }
          bash scripts/ci/push.sh "data/windows" "[skip actions] data: target A windows $(TZ=Asia/Tokyo date +%F' '%H:%M)" >/tmp/step.log 2>&1 || { cat /tmp/step.log; echo '::warning::Target A window push failed.'; exit 0; }
