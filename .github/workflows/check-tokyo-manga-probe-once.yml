name: Check Tokyo manga probe once

on:
  push:
    paths:
      - '.github/workflows/check-tokyo-manga-probe-once.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect deployed Tokyo probe
        run: |
          set -e
          URL='https://dlsite-trend-radar.vercel.app/api/manga-region-probe'
          CODE=$(curl -sS -o /tmp/probe.json -w '%{http_code}' "$URL")
          echo "http=$CODE"
          cat /tmp/probe.json
          echo
          test "$CODE" = "200"
          grep -q '"region"' /tmp/probe.json
