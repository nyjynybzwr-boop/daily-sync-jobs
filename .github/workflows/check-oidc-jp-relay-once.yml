name: Verify OIDC Tokyo DLsite relay once

on:
  push:
    paths:
      - '.github/workflows/check-oidc-jp-relay-once.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request short-lived GitHub OIDC token
        run: |
          set -euo pipefail
          JSON=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=melosignal-dlsite-jp-relay")
          TOKEN=$(printf '%s' "$JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          echo "::add-mask::$TOKEN"
          echo "OIDC_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Verify listing and restricted product through Tokyo relay
        run: |
          set -euo pipefail
          BASE='https://dlsite-trend-radar.vercel.app/api/dlsite-jp-relay'
          for i in $(seq 1 12); do
            echo "attempt $i"
            CODE=$(curl -sS -o /tmp/list.html -D /tmp/headers.txt -w '%{http_code}' -H "Authorization: Bearer $OIDC_TOKEN" "$BASE?kind=listing&page=1" || true)
            if [ "$CODE" = '200' ]; then break; fi
            sleep 10
          done
          echo "http=$CODE"
          REGION=$(awk 'BEGIN{IGNORECASE=1}/^x-melosignal-relay-region:/{gsub("\\r","");print $2;exit}' /tmp/headers.txt)
          COUNT=$(python3 - <<'PY'
          import html,re
          raw=open('/tmp/list.html',encoding='utf-8').read()
          text=html.unescape(re.sub(r'<[^>]+>',' ',raw))
          text=re.sub(r'\s+',' ',text)
          m=re.search(r'([\d,]+)\s*件中\s*1\s*[-−ー]\s*30\s*件目',text)
          print(m.group(1).replace(',','') if m else '')
          PY
          )
          echo "region=$REGION count=$COUNT"
          test "$CODE" = '200'
          test "$REGION" = 'hnd1'
          test "$COUNT" = '7743'

          curl -fsSL -H "Authorization: Bearer $OIDC_TOKEN" "$BASE?kind=detail&id=RJ01512512" -o /tmp/detail.html
          grep -q '茅原啓佑の×恋' /tmp/detail.html
          ! grep -q 'お住いの国・地域からは本作品は購入できません' /tmp/detail.html
          echo 'OIDC_RELAY_OK count=7743 product=RJ01512512'
