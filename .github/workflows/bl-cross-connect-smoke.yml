name: BL cross connection smoke

on:
  push:
    paths:
      - '.github/workflows/bl-cross-connect-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout helper repo
        uses: actions/checkout@v4

      - name: Checkout private source
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GIT_LFS_SKIP_SMUDGE: '1'
        run: git clone --quiet --branch main --single-branch "https://x-access-token:${SYNC_TOKEN}@github.com/${SOURCE_REPO}.git" work

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: work
        run: npm ci

      - name: Materialize BL catalogs
        working-directory: work
        run: git lfs pull --include="data/bl/catalog/full/details.json,data/manga/bl/catalog/full/details.json"

      - name: Generate BL cross signals
        working-directory: work
        run: node scripts/run-cross-leadlag-bl.mjs

      - name: Build and validate site connection
        working-directory: work
        run: |
          npm run build:site
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('site/data/cross/bl.json','utf8'));
          const lead=JSON.parse(fs.readFileSync('data/cross/bl-leadlag.json','utf8'));
          const manga=JSON.parse(fs.readFileSync('web/data/catalog/manga/bl/summary.json','utf8'));
          const html=fs.readFileSync('site/cross.html','utf8');
          if(x.audience!=='bl') throw new Error('BL audience not connected');
          if(manga.total_works!==10991) throw new Error(`BL manga count=${manga.total_works}`);
          if(x.sources?.comic?.total_works!==10991) throw new Error(`BL cross comic source=${x.sources?.comic?.total_works}`);
          if(!x.sources?.audio?.total_works) throw new Error('BL audio source missing');
          if(!x.lead_lag?.available) throw new Error('BL lead/lag not merged');
          if(!html.includes('cross-market-switch.js')) throw new Error('market switch not injected');
          const all=[...(lead.directions?.audio_to_comic||[]),...(lead.directions?.comic_to_audio||[])];
          if(all.some(r=>!['high','medium'].includes(r.confidence))) throw new Error('invalid confidence leaked');
          const out={
            checked_at:new Date().toISOString(),
            status:'success',
            audio_total_works:x.sources.audio.total_works,
            comic_total_works:x.sources.comic.total_works,
            common_labels:x.market_structure?.common_labels||0,
            analyzed_labels:lead.coverage?.analyzed_labels||0,
            directional_signals:lead.coverage?.directional_signals||0,
            high_confidence:lead.coverage?.high_confidence||0,
            medium_confidence:lead.coverage?.medium_confidence||0,
            next_wave:{
              audio_to_comic:(lead.next_wave?.audio_to_comic||[]).map(r=>r.label),
              comic_to_audio:(lead.next_wave?.comic_to_audio||[]).map(r=>r.label),
            },
            cross_market_switch:true
          };
          fs.writeFileSync('../status/bl-cross-connect.json',JSON.stringify(out,null,2)+'\n');
          console.log(JSON.stringify(out,null,2));
          NODE

      - name: Publish smoke result
        if: always()
        run: |
          set -euo pipefail
          mkdir -p status
          if [[ ! -f status/bl-cross-connect.json ]]; then
            cat > status/bl-cross-connect.json <<EOF
          {
            "checked_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "status": "failed_before_validation"
          }
          EOF
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git pull --rebase origin main || true
          git add status/bl-cross-connect.json
          if git diff --cached --quiet; then
            echo 'Smoke status unchanged.'
          else
            git commit -m "status: BL cross connection smoke"
            git push
          fi
